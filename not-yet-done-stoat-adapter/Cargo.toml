[package]
name = "not-yet-done-stoat-adapter"
version = "0.1.0"
edition = "2024"

[dependencies]
sea-orm     = { workspace = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
fieldsmith  = { workspace = true }
uuid        = { workspace = true }
serde       = { workspace = true }
serde_yaml  = { workspace = true }
serde_json  = { workspace = true }
reqwest     = { workspace = true }
chrono      = { workspace = true }
dirs        = { workspace = true }
not-yet-done-content = { path = "../not-yet-done-content" }

# WebSocket gateway. Stoat/Revolt bootstrap (server list) and live
# updates are push-only over WS, so a streaming client is required —
# this is the first adapter that holds a long-lived socket.
# native-tls matches reqwest's default-tls backend (openssl), so we
# don't pull a second TLS stack into the tree.
tokio-tungstenite = { version = "0.29", features = ["connect", "native-tls"] }
futures-util      = "0.3.31"

[dev-dependencies]
tokio       = { workspace = true }
serde       = { workspace = true }
serde_yaml  = { workspace = true }
serde_json  = { workspace = true }
