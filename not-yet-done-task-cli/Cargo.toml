[package]
name = "not-yet-done-task-cli"
version = "0.1.0"
edition = "2024"

# Dedicated tasks/trackings CLI. Unlike `not-yet-done-cli` (the generic adapter
# front-end for *foreign* systems like Jira/Confluence/Postgres), this binary is
# a first-class client of the native domain core — it talks to
# `not-yet-done-task-core` directly with typed services, so it can offer the
# rich, domain-shaped commands (tree dumps, joined tracking export, time moves)
# that scripts rely on and that a generic NodeSummary protocol can't express.
[[bin]]
name = "nyd-t"
path = "src/main.rs"

[dependencies]
not-yet-done-task-core = { path = "../not-yet-done-task-core" }
sea-orm        = { workspace = true }
shaku          = { workspace = true }
tokio          = { workspace = true }
anyhow         = { workspace = true }
tusks          = "2.1"
chrono         = { workspace = true }
# Natural-language date parsing for `track` time arguments
# (e.g. "yesterday 14:00", "last monday", "in 2 hours", "eod").
natural-date   = { path = "../natural-date" }
serde          = { workspace = true }
# Domain-shaped JSON output for `track export` / `task tree` (consumed by the
# Python report/equalize scripts).
serde_json     = { workspace = true }
# `tag new` opens an editor on a temp file.
tempfile       = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile   = { workspace = true }
