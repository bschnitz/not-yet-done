[package]
name = "not-yet-done-mail-adapter"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio       = { workspace = true }
async-trait = { workspace = true }
fieldsmith  = { workspace = true }
serde       = { workspace = true }
serde_yaml  = { workspace = true }
serde_json  = { workspace = true }
chrono      = { workspace = true }
dirs        = { workspace = true }
futures     = { workspace = true }
thiserror   = { workspace = true }
not-yet-done-content = { path = "../not-yet-done-content" }

# IMAP. `async-imap` is the client Delta Chat drives; the workspace is
# fully tokio-async, so the synchronous `imap` crate would mean a blocking
# pool per account. native-tls (openssl) keeps us on the single TLS stack
# reqwest and tokio-tungstenite already use.
async-imap       = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
mail-parser      = "0.11"

# Composing. `lettre` builds the MIME message and speaks SMTP; it stays on
# native-tls so the crate keeps the single TLS stack it already has for
# IMAP; no connection pool, because a transport is built per send and a
# pooled one is an idle socket the provider closes anyway. `comrak` turns what the user wrote into HTML (CommonMark *plus*
# GFM — tables are what people write in mail), `htmd` turns the original's
# HTML into the Markdown quote the editor shows, which is read and never
# sent, so readability is its whole job.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1",
    "tokio1-native-tls",
] }
comrak = { version = "0.54", default-features = false }
htmd   = "0.5"

[dev-dependencies]
tokio      = { workspace = true }
serde_yaml = { workspace = true }
# Only to assert that a blank flag slot is as wide as the glyph it
# stands in for — the adapter itself never measures anything.
unicode-width = { workspace = true }
