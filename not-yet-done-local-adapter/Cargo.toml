[package]
name = "not-yet-done-local-adapter"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio       = { workspace = true }
async-trait = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
serde_yaml  = { workspace = true }
dirs        = { workspace = true }
slug        = "0.1"
# Human-friendly datetime / offset parsing for the trackings adapter's
# `split`/`move` actions, which receive their time points as Form strings
# (mirrors the CLI's `track split`/`track move` parsing).
chrono-english = { workspace = true }
dateparser     = { workspace = true }
not-yet-done-content = { path = "../not-yet-done-content" }
not-yet-done-task-core = { path = "../not-yet-done-task-core" }
not-yet-done-filter  = { path = "../not-yet-done-filter" }

[dev-dependencies]
tokio = { workspace = true }
# tree_edit integration tests build a real in-memory SQLite DB directly.
sea-orm = { workspace = true }
shaku = { workspace = true }
chrono = { workspace = true }
