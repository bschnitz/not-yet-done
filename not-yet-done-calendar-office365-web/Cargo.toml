[package]
name = "not-yet-done-calendar-office365-web"
version = "0.1.0"
edition = "2024"

# Calendar backend (backend type `office365-web`) for tenants that can only be
# reached through the browser. It implements the `CalendarBackend` seam from
# calendar-core on top of the app-agnostic `not-yet-done-office365-web` session
# wrapper: it resolves (and shares, by account key) an authenticated Office 365
# web session and maps its `MsCalEvent`s onto the neutral `CalEvent` DTO.
#
# This is the only crate that knows both worlds; it depends on calendar-core
# and the session wrapper, never on the adapter or the TUI.

[dependencies]
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
serde_yaml  = { workspace = true }
# For the ready-signal broadcast + the forwarder task re-broadcasting the
# session's loaded signal onto it.
tokio       = { workspace = true }

not-yet-done-calendar-core = { path = "../not-yet-done-calendar-core" }
not-yet-done-content        = { path = "../not-yet-done-content" }
not-yet-done-office365-web = { path = "../not-yet-done-office365-web" }
