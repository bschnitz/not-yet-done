[workspace]
resolver = "3"
members = [
  "not-yet-done-cli",
  "not-yet-done-task-cli",
  "not-yet-done-core",
  "not-yet-done-tui",
  "not-yet-done-macros",
  "not-yet-done-forest",
  "ratatui_form_widgets",
  "grid-render-sim",
  "not-yet-done-grid-core",
  "not-yet-done-ratatui",
  "not-yet-done-table",
  "not-yet-done-waybar",
  "not-yet-done-content",
  "not-yet-done-filter",
  "not-yet-done-task-core",
  "not-yet-done-jira-adapter",
  "not-yet-done-taiga-adapter",
  "not-yet-done-transport",
  "not-yet-done-postgres-adapter",
  "not-yet-done-confluence-adapter",
  "not-yet-done-stoat-adapter",
  "not-yet-done-local-adapter",
  "not-yet-done-host",
]

[workspace.dependencies]
sea-orm = { version = "2.0.0-rc", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "schema-sync",
    "entity-registry",
    "macros",
] }
anyhow = "1.0.102"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.22.0", features = ["v4", "v5"] }
shaku = { version = "0.6.2", features = ["derive"] }
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["clock"] }
regex = "1.12.3"
chrono-english = "0.1.8"
dateparser     = "0.2.1"
assert_cmd = "2.2.0"
predicates = "3.1.4"
tempfile = "3.27.0"
dirs = "6.0.0"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
# reqwest 0.13 flipped the default TLS backend from native-tls to rustls
# and made `query`/`form` opt-in features. We keep native-tls (openssl)
# to preserve the existing behaviour and stay on a single TLS stack with
# the Stoat gateway's tokio-tungstenite (also native-tls). default-tls is
# dropped via default-features=false; charset/http2/system-proxy are the
# remaining reqwest defaults we still want (system-proxy matters behind a
# corporate HTTP proxy). `query` is now required for RequestBuilder::query.
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
    "charset",
    "http2",
    "system-proxy",
    "json",
    "multipart",
    "query",
] }
base64 = "0.22"
slug = "0.1"
serde_yaml = "0.9.34"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30"
fuzzy-matcher = "0.3.7"
unicode-width = "0.2.0"
arboard = { version = "3", features = ["wayland-data-control"] }
globset = "0.4"
ignore = "0.4"
not-yet-done-macros = { path = "not-yet-done-macros" }
not-yet-done-forest = { path = "not-yet-done-forest" }
not-yet-done-ratatui = { path = "../not-yet-done-ratatui" }
