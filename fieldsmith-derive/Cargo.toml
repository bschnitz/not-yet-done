[package]
name = "fieldsmith-derive"
description = "Derive macro for fieldsmith: reflect a struct into a runtime schema."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bschnitz/not-yet-done"
readme = "README.md"
keywords = ["config", "derive", "reflection", "serde", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "config"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
