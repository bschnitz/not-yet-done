[package]
name = "not-yet-done-host"
version = "0.1.0"
edition = "2024"

# Shared "host" wiring used by every front-end (TUI, CLI, Waybar): the adapter
# factory registry, the cross-adapter event bus, and instance resolution from
# the view configs. Lives in its own crate so the CLI and Waybar can build
# adapters exactly the way the TUI does, without depending on the whole TUI
# binary crate (Block D — adapterise CLI + Waybar).

[dependencies]
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_yaml = { workspace = true }
# Hook subsystem (D5): chrono timestamps the throttle window; serde_json reads/
# writes the host-level state file `~/.local/state/not_yet_done/hooks.json`.
serde_json = { workspace = true }
chrono     = { workspace = true }
dirs       = { workspace = true }
# Event hooks: script bindings run as child processes on the front-end's
# runtime (`process`, `time` for the timeout, `sync` for the bus receiver).
tokio      = { workspace = true, features = ["process", "rt", "sync", "time"] }

not-yet-done-content = { path = "../not-yet-done-content" }
not-yet-done-custom-columns = { path = "../not-yet-done-custom-columns" }
not-yet-done-scripts = { path = "../not-yet-done-scripts" }

# Every adapter the host knows how to construct. Adding an adapter to the
# product means adding it here (and to `factories()`), once — all front-ends
# inherit it.
not-yet-done-jira-adapter       = { path = "../not-yet-done-jira-adapter" }
not-yet-done-kimai-adapter      = { path = "../not-yet-done-kimai-adapter" }
not-yet-done-taiga-adapter      = { path = "../not-yet-done-taiga-adapter" }
not-yet-done-postgres-adapter   = { path = "../not-yet-done-postgres-adapter" }
not-yet-done-sqlite-adapter     = { path = "../not-yet-done-sqlite-adapter" }
not-yet-done-confluence-adapter = { path = "../not-yet-done-confluence-adapter" }
not-yet-done-stoat-adapter      = { path = "../not-yet-done-stoat-adapter" }
not-yet-done-mail-adapter       = { path = "../not-yet-done-mail-adapter" }
not-yet-done-local-adapter      = { path = "../not-yet-done-local-adapter" }
not-yet-done-calendar-adapter   = { path = "../not-yet-done-calendar-adapter" }
not-yet-done-workflow           = { path = "../not-yet-done-workflow" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
