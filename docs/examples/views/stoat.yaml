# Example: Stoat view configuration
#
# Place in: ~/.config/not_yet_done/views/stoat.yaml
# Adapter config: ~/.config/not_yet_done/views/stoat-adapter.yaml
#
# Read-only browsing as a TREE + live updates. Tree shape:
#
#   Server
#   ├─ (uncategorized channels)        ← channels in no category
#   └─ Category
#      └─ Channel
#         → drill into messages (flat list, preview with `p`)
#
# Opening this tab logs in, discovers the WebSocket URL, and connects the
# gateway in the background (status banner: Connecting → Ready, or
# NeedsCreds → … → Ready). The tree fills from the WS `Ready` snapshot
# automatically (no manual `r`). Server/category/channel structure is read
# live from gateway state; message bodies are pulled over REST on demand.
#
# LIVE: while a channel's messages are open, new/edited/deleted messages
# and reactions refresh on arrival; a reconnect resyncs every view.
# Structural changes are live too: a channel created/renamed/deleted and
# any category change (add/remove/rename/reassign/reorder) update the tree
# without a reload. (Only joining/leaving a whole server still needs a
# reconnect.) `r` still works as a manual reload.
#
# WRITE (Phase 3): in a channel's message list, `a` composes a new message
# (empty $EDITOR, Markdown), `e` edits the selected message, `d` deletes
# it, and `+` opens an emoji picker to react. Editing/deleting another
# user's message is rejected by the server with a clean error. Sent/edited/
# deleted messages also arrive as live events, so the list refreshes either
# way.
#
# Tree notes (validator rules):
#  - Each level's `tree_label` must be a key in that level's own `columns`
#    (the only rule the validator enforces). The renderer resolves the
#    label cell per row via the node_type_chain, so label keys need NOT
#    match across levels — see docs/decisions/0003-*. Here `name` happens
#    to be the key on server, channel and category alike.
#  - `tree_find` / `fuzzy_filter` / `search` live ONCE, at the view root.
#  - The same `stoat:channel` type appears at two depths (under the server
#    as uncategorized, and under a category). That's fine: the
#    duplicate-node_type rule only forbids duplicates among *sibling*
#    tree branches at one level.
#  - `stoat:message` carries no `tree_label`, so a channel is not
#    expandable inline — Enter DRILLS into the flat message list instead.

tab:
  name: Stoat
  order: 7
  icon: "󰭹"
  # While any row in this view is unread, the tab bar puts a marker in front
  # of the icon and emphasises the label — the only unread cue a *background*
  # chat tab can give. Both keys are optional: the marker falls back to the
  # view's own `unread_marker` below (so tree and tab agree) and then to 🔔,
  # the style defaults to bold. Uncomment to override:
  #   unread_marker: "🔔"
  #   unread_style: [bold]     # or: unread, or { fg: unread, modifiers: [bold] }

adapter:
  type: stoat
  id: chat
  config: stoat-adapter.yaml
  # `manual_connect` defaults to true: the adapter logs in and opens its
  # socket only after you press `r`. Set it to false to connect at startup —
  # note that a login needing an answer then raises its dialog right away,
  # over whatever tab you happen to be on.

views:
  - name: chats
    node_type: "stoat:server"
    default: true
    # Enable the `w` window-leader chords (split / close / focus / pane-tag
    # switch) on this view — it uses a coupled message split below, so
    # multi-pane navigation is meaningful here. Off by default everywhere else.
    window_ops: true
    tree_label: name
    # UNREAD highlight (read-state from Revolt `sync/unreads` + acks): a
    # server/category/channel with unread messages gets the marker glyph + its
    # name painted in the `unread` color throughout this tree (a server or
    # category is unread when any channel below it is); an unread message's
    # header (author/time line) is painted the same way in the message list.
    # The flag clears when you SEND in the channel or a `ChannelAck` arrives
    # (from this or another client). `unread_style` is a theme color name
    # (default: theme `unread`); `unread_marker` is the leading glyph (default
    # 💬; "" suppresses it, color only). Both are optional — omit for defaults.
    # Overridden to a bell here because 💬 marks the channel *type* below
    # (`icon:`) — the two glyphs answer different questions and must differ.
    unread_style: unread
    unread_marker: "🔔"
    columns:
      - { key: name, label: Name, source: label, sizing: "flex(1)" }
    actions:
      - { name: refresh, key: r, type: reload }
      # Create directly under the server (cursor on the server row): a
      # channel lands uncategorized, a category is appended to the
      # server's category list. The keys `al`/`ay` are multi-char
      # *chords* — they are NOT in the typed `keybindings.content`
      # section, so the App's chord interceptor consults this view's
      # keymap via ContentView::yaml_action_chord_prefix. `type: custom`
      # targets the SELECTED node (here the server) and opens its
      # `InputSpec::Form` — a single `name` field. Any multi-char
      # `actions:` key works as a chord this way, with no extra wiring.
      - { name: new channel, key: al, type: custom, id: create_channel }
      - { name: new category, key: ay, type: custom, id: create_category }
      - name: tree find
        key: /
        type: tree_find
        tree_find:
          prompt: Search channels
    # Cut/paste move a channel between categories. `C` cuts the channel
    # under the cursor (it is NOT deleted — only marked); `P` pastes it
    # onto the target the cursor sits on. `P` on the SERVER row drops the
    # channel into the uncategorized branch. The cut is local to this tab
    # (switching tabs aborts it) and pressing `C` again on the same row
    # cancels it. These are generic `shortcuts:` (the shared mark/paste-move
    # vocabulary, dispatched via `invoke_action`), not editor actions.
    # The `cut` hint lives in the TOP action bar (the adapter places the
    # `mark-move` action there) and lights up in the accent color while a
    # channel is cut, so the armed cut stays visible until `P` or a cancel.
    shortcuts:
      P: paste-move
    children:
      # Branch order = render order at the server level: uncategorized
      # channels first, then categories.
      - name: channels
        node_type: "stoat:channel"
        tree_label: name
        # `icon:` = the row's TYPE glyph, drawn right before the label on
        # every row of this level (unlike `leaf_glyph`, which only marks
        # rows with nothing below them). It earns its keep here because
        # uncategorized channels and categories share this tree level: with
        # no glyph, a channel directly under the server reads exactly like a
        # category, and expanding it surprises you with messages.
        icon: "💬"
        columns:
          - { key: name, label: Channel, source: label, sizing: "flex(1)" }
        # Rename the channel under the cursor. `PATCH /channels/{id}` is a
        # single-field delta; the gateway's ChannelUpdate echo refreshes
        # the tree without a reload. `R` is a single char (no chord).
        #
        # `A` posts local files into the channel: `InputSpec::FilePicker
        # { multi: true }` opens the TUI's picker, the adapter uploads each
        # pick and sends them as messages with an empty body. Revolt allows
        # 5 files per message, so a larger selection is split across several
        # messages instead of being rejected. There is no caption — the API
        # cannot add a file to an existing message; `e` on the posted
        # message adds text in place afterwards. `type: custom` because a
        # file picker is not the editor pipeline.
        actions:
          - { name: rename, key: R, type: custom, id: rename }
          - { name: attach, key: A, type: custom, id: attach }
        # `C` cuts THIS channel (mark for move, no delete); `P` pastes a
        # previously-cut channel beside this one (into the same container).
        shortcuts:
          C: mark-move
          P: paste-move
        # Enter on a channel has no tree-continuing child (messages carry
        # no tree_label), so it DRILLS into the message list. `split` opens
        # that list in a focused pane to the right (80%) while the channel
        # tree stays on the left (20%). `coupled: true` makes the channel
        # tree *own* that message pane: drilling into another channel
        # hot-replaces the open chat instead of stacking a second split.
        children:
          - name: messages
            node_type: "stoat:message"
            split: { direction: right, ratio: 0.8, coupled: true }
            # This message pane is a *coupled* child: drilling in pushes a
            # nav frame so the pane can hot-replace on the next channel. That
            # frame would otherwise make Backspace claim `Back` and pop the
            # chat back to the channel list — navigation that belongs to the
            # tree on the left. Disable `Back` here so Backspace is inert.
            # `link_hop: f` opts this pane into vimium-style link-hop (label
            # every visible link, type the label to open it). Link-hop is
            # opt-in per view/child now, so it is bound only where useful —
            # here, on the chat messages that actually carry URLs.
            keybindings: { back: null, link_hop: f }
            # `smooth_scroll: true` makes this (long, multi-line) list scroll
            # one physical line at a time over the whole content instead of
            # jumping message-to-message — the body "glides" continuously.
            # The highlight (what `e`/`d`/`+`/`p` act on) glides with the
            # content, but hands off one message at a time as soon as the
            # next one is on screen — so `j`/`k` still walk the chat
            # message by message while the body scrolls line by line.
            # Default is `false` (classic row-by-row scrolling).
            smooth_scroll: true
            # `mark_read_on_reach_end:` is a generic engine hook: when the
            # cursor first lands on the LAST (newest) row of this flat list
            # AND that row is still unread, the engine invokes the named
            # action (`mark-read`) on the selected message node once. The
            # message node acks the channel up to that message (PUT ack) and
            # records the read locally, so the channel's unread marker clears.
            # This is the "cursor onto the newest message clears the flag"
            # behaviour — NOT auto-ack on open: drilling in selects the last
            # message only if there's a single message; otherwise you must
            # scroll to the bottom. The unread gate makes it idempotent (it
            # never re-fires after the ack-driven reload). Drop the line to
            # disable. Ignored in tree mode (flat lists only).
            mark_read_on_reach_end: mark-read
            # `cursor_on_open:` is the same idea at the other end of the list:
            # opening this level puts the cursor on the first message the user
            # has NOT read yet (the `unread` metadata field the tree highlight
            # already uses), anchored at the TOP edge so the rest of the unread
            # run reads downward from it — scroll on and you eventually hit
            # `mark_read_on_reach_end` above. With nothing unread it falls back
            # to the newest message. Only *opening* applies it: a reload, a live
            # invalidation or an incoming message never yanks the cursor away
            # from where you scrolled. Other values: `first` (the old default),
            # `last`.
            cursor_on_open: first_unread
            # `columns:` defines the data + sizing + per-column fg color
            # (`style:` is a theme reference). `row_layout:` arranges those
            # columns onto multiple physical lines per message — a chat look:
            #   line 1: author + time  (highlighted via the column styles)
            #   line 2: the message body
            #   line 3: a blank spacer ([])
            # Without `row_layout:` this would render as a normal one-line
            # table (Author | Time | Message). In multi-line mode the column
            # header is suppressed. An empty line is a spacer and stays
            # outside the selection block; any other line can opt out too via
            # `{ columns: [...], highlight_on_select: false }`.
            columns:
              - { key: author, source: author, style: accent, sizing: max }
              - { key: time, source: time, style: text_dim, sizing: max }
              # `markdown: true` renders the body as multiple soft-wrapped
              # lines (headings, lists, inline emphasis, code). `source:
              # content` reads the raw, unflattened body (the adapter's
              # `content` metadata field) rather than the collapsed `label`.
              # A markdown column must be the only column on its row_layout
              # line — hence `[content]` stands alone below.
              - {
                  key: content,
                  source: content,
                  markdown: true,
                  sizing: "flex(1)",
                }
            row_layout:
              - [author, time]
              - [content]
              - []
            actions:
              # Compose a new message in this channel (create: parent =
              # channel, child = stoat:message). `id` is the channel
              # node's action id. `editor: compose-below` selects a named
              # editor profile from `editors:` in tui.yaml (here: a chat
              # composer in a horizontal split below the terminal, e.g.
              # `kitty @ launch --location=hsplit --bias 20` for an 80:20
              # split-down). Define that profile in tui.yaml, or drop
              # `editor:` to use `default`. `key: n` keeps Enter on the
              # message list free; `n`/search-next only claims the key
              # while a search is active.
              #
              # `commit_on_save: true` → the first `:w` sends, each later
              # `:w` edits the just-sent message in place; an unchanged save
              # (or the editor close) is a no-op, so nothing is sent twice.
              # Needs a detached editor profile (inline: false).
              - {
                  name: new,
                  key: n,
                  type: create,
                  id: send_message,
                  editor: compose-below,
                  commit_on_save: true,
                }
              # Edit / delete / react operate on the SELECTED message node.
              # `commit_on_save` here means every `:w` edits the message live.
              - {
                  name: edit,
                  key: e,
                  type: edit,
                  id: edit_message,
                  editor: compose-below,
                  commit_on_save: true,
                }
              - { name: delete, key: d, type: custom, id: delete_message }
              - { name: react, key: "+", type: custom, id: react }
              # `i` downloads the message's image attachments to a temp dir
              # and opens the first in the OS viewer (xdg-open) — the rest
              # sit in the same dir so the viewer can page through them.
              - { name: images, key: i, type: custom, id: open-images }
              - { name: refresh, key: r, type: reload }
            # `p` previews the selected message's full body (Markdown) —
            # the same text the table row shows collapsed to one line.
            preview:
              enabled: true
              source: content
              markdown: true # render the body as soft-wrapped markdown
              keybinding: p
            # Files posted with a message. The message node reports
            # `has_children` only when it actually carries files, so Enter
            # drills into this list on those messages and does nothing on
            # the rest. Revolt has no per-attachment endpoint — files only
            # ever ship embedded in their message — so the node ids are
            # composite (`<channel>/msg/<message>/file/<file>`) and the
            # adapter re-reads the parent message to resolve one.
            #
            # This level is only needed to reach a file *as a file*. Image
            # attachments already render inline in the body above (the
            # adapter emits them as markdown images), and `i` on the
            # message opens all of them in the OS viewer at once.
            children:
              - name: attachments
                node_type: "stoat:attachment"
                columns:
                  - {
                      key: filename,
                      label: File,
                      source: label,
                      style: text_high,
                      sizing: "flex(1)",
                    }
                  - { key: size, label: Size, sizing: max }
                  - { key: content_type, label: Type, sizing: max }
                actions:
                  # `open` downloads once into a per-message temp dir and
                  # hands the path to the frontend (xdg-open). All files of
                  # one message land in the same dir, so the viewer can page
                  # through them; re-opening reuses the downloaded bytes.
                  - { name: open, key: o, type: custom, id: open }
                  # Saves EVERY file of the parent message into a directory
                  # the form asks for (`~` is expanded, missing parents are
                  # created). There is no delete: Revolt cannot remove a
                  # single file from a message, only the whole message.
                  - {
                      name: download all,
                      key: D,
                      type: custom,
                      id: download_all,
                    }
                  - { name: refresh, key: r, type: reload }

      - name: categories
        node_type: "stoat:category"
        tree_label: name
        # The counterpart to the channels branch above — it is the PAIR of
        # glyphs that makes the shared level readable.
        icon: "📁"
        columns:
          - { key: name, label: Category, source: label, sizing: "flex(1)" }
        # A channel can also be created INSIDE a category (cursor on a
        # category row). Stoat has no "create in category" endpoint, so
        # the adapter does it in two steps: create the channel (it lands
        # uncategorized), then PATCH the server's full category list with
        # the new channel added to this category. Same `al` chord as the
        # server level — `type: custom` resolves to whichever row the
        # cursor sits on, so one key serves both placements.
        # Plus rename the category itself (R) — edits the title in the
        # server's full category list and PATCHes it back (no per-category
        # endpoint), echoed live via ServerUpdate.
        actions:
          - { name: new channel, key: al, type: custom, id: create_channel }
          - { name: rename, key: R, type: custom, id: rename }
        # `P` on a category row pastes a cut channel INTO this category.
        # (Categories themselves aren't cut — only channels are, so there's
        # no `C` here.)
        shortcuts:
          P: paste-move
        children:
          - name: channels
            node_type: "stoat:channel"
            tree_label: name
            # Same glyph as the uncategorized branch — a channel looks like
            # a channel wherever it sits.
            icon: "💬"
            columns:
              - { key: name, label: Channel, source: label, sizing: "flex(1)" }
            # Rename a channel inside a category, and post files into it —
            # same pair as the uncategorized branch.
            actions:
              - { name: rename, key: R, type: custom, id: rename }
              - { name: attach, key: A, type: custom, id: attach }
            # Cut/paste a channel inside a category — same move pair as the
            # uncategorized branch.
            shortcuts:
              C: mark-move
              P: paste-move
            children:
              - name: messages
                node_type: "stoat:message"
                split: { direction: right, ratio: 0.8, coupled: true }
                # Disable `Back` on this coupled pane too (see the
                # uncategorized-channels branch above for why).
                # `link_hop: f` opts this pane into vimium-style link-hop (label
                # every visible link, type the label to open it). Link-hop is
                # opt-in per view/child now, so it is bound only where useful —
                # here, on the chat messages that actually carry URLs.
                keybindings: { back: null, link_hop: f }
                # Smooth line-wise scrolling + same chat layout as the
                # uncategorized-channels branch above.
                smooth_scroll: true
                # Same cursor-on-newest ack hook, and the same open-on-the-first-
                # unread-message placement, as the uncategorized branch.
                mark_read_on_reach_end: mark-read
                cursor_on_open: first_unread
                columns:
                  - { key: author, source: author, style: accent, sizing: max }
                  - { key: time, source: time, style: text_dim, sizing: max }
                  # `markdown: true` — soft-wrapped multi-line body; `source:
                  # content` reads the raw body (not the collapsed `label`).
                  - {
                      key: content,
                      source: content,
                      markdown: true,
                      sizing: "flex(1)",
                    }
                row_layout:
                  - [author, time]
                  - [content]
                  - []
                actions:
                  - {
                      name: new,
                      key: n,
                      type: create,
                      id: send_message,
                      editor: compose-below,
                      commit_on_save: true,
                    }
                  - {
                      name: edit,
                      key: e,
                      type: edit,
                      id: edit_message,
                      editor: compose-below,
                      commit_on_save: true,
                    }
                  - { name: delete, key: d, type: custom, id: delete_message }
                  - { name: react, key: "+", type: custom, id: react }
                  # `i` downloads the message's image attachments and opens
                  # the first in the OS viewer (see the other messages block).
                  - { name: images, key: i, type: custom, id: open-images }
                  - { name: refresh, key: r, type: reload }
                preview:
                  enabled: true
                  source: content
                  markdown: true # render the body as soft-wrapped markdown
                  keybinding: p
                # Same attachment level as the uncategorized branch — Enter
                # on a message that carries files drills into them.
                children:
                  - name: attachments
                    node_type: "stoat:attachment"
                    columns:
                      - {
                          key: filename,
                          label: File,
                          source: label,
                          style: text_high,
                          sizing: "flex(1)",
                        }
                      - { key: size, label: Size, sizing: max }
                      - { key: content_type, label: Type, sizing: max }
                    actions:
                      - { name: open, key: o, type: custom, id: open }
                      - {
                          name: download all,
                          key: D,
                          type: custom,
                          id: download_all,
                        }
                      - { name: refresh, key: r, type: reload }

  # To browse direct-message / group channels instead of servers, point a
  # second view's top level at stoat:channel (the root lists DMs there).
