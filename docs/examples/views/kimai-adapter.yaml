# Example: Kimai adapter credentials
#
# Place in: ~/.config/not_yet_done/views/kimai-adapter.yaml
# Referenced by kimai.yaml via: adapter.config: kimai-adapter.yaml
#
# Kimai's API auth depends on the server version:
#
#   - up to 2.13: the `X-AUTH-USER` / `X-AUTH-TOKEN` header pair, where the
#     token is the "API password" set on the user's profile page
#     → mechanism `user-api-token` (username + token), shown below.
#   - 2.14+: personal API tokens via `Authorization: Bearer`
#     → mechanism `bearer-token` with a single `token` binding.
#
# The credentials are static, so there is no login flow and no persisted
# session — the adapter resolves the providers once per process.
#
# `nyd config auth kimai` prints both mechanisms with their fields and
# every provider; `nyd config build kimai` asks and writes the block.

url: https://kimai.example.com

name: kimai # optional human-readable label

auth:
  mechanism: user-api-token
  bindings:
    - field: username
      provider:
        # `command` runs a shell command and uses its trimmed stdout —
        # the natural fit for a `pass` entry. Swap for
        # `{ type: env, var: KIMAI_USER }` or
        # `{ type: literal, value: alice }`.
        type: command
        script: pass show services/kimai/user
    - field: token
      provider:
        type: command
        script: pass show services/kimai/api-password

# Kimai 2.14+ with a personal API token — one field, no username:
#
# auth:
#   mechanism: bearer-token
#   bindings:
#     - field: token
#       provider: { type: keyring, service: kimai, account: alice }

# How many days back the timesheet listing reaches (the API is filtered to
# `begin >= now - lookback_days`). Optional; defaults to 92 (~3 months).
# Kimai instances accumulate years of records — raise this when you need
# deeper history, at the cost of a larger initial load.
# lookback_days: 92

# Hard ceiling (seconds) on every HTTP request, including connection
# setup. Optional; defaults to 20. See taiga-adapter.yaml for the
# rationale (a dead keep-alive socket must fail instead of freezing the
# TUI).
# request_timeout_secs: 20

# Hard ceiling (seconds) on just the connection-establishment phase
# (DNS + TCP + TLS). Optional; defaults to min(request_timeout_secs, 10).
# connect_timeout_secs: 30

# How a request that produced no answer at all is sent again — the connection
# refused, the handshake lost, the answer never arriving. Such a failure says
# nothing about the server a moment later, so the adapter repeats the call
# instead of handing the error straight to the user.
#
# `attempts` counts the first try; `1` switches repeating off. `backoff_ms` is
# the wait before the second attempt and doubles before each further one.
# Defaults: 2 attempts, 250 ms.
#
# Only calls without side effects are repeated after a *timeout*, because a
# timed-out request may well have arrived and run — repeating an edit or a
# create there would do it twice. When the connection never came up, every
# call is repeated: nothing reached the server, so nothing can be doubled.
# retry:
#   attempts: 2
#   backoff_ms: 250

# Names for projects and activities the API refuses to show (403). Kimai
# leaves the user's own timesheets on such a project out of the listing — a
# closed project the user's teams no longer reach, say. The adapter still
# finds them through its timesheet index (see `scan-hidden` on the root),
# but cannot read the project's or activity's name; without an entry here
# they render as `#<id>`. With one, saved queries can name them too.
# names:
#   projects:
#     - { id: 4711, name: Migration, customer: Acme }
#   activities:
#     - { id: 42, name: Consulting }
