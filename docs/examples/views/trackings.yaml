# Example: Trackings view configuration (adapterized Trackings tab — plan phase A2)
#
# Place in: ~/.config/not_yet_done/views/trackings.yaml
#
# Like `tasks`, the `trackings` adapter is *in-process*: it wraps the host's
# own TrackingRepository + TaskService (no network, no adapter-config file).
# `adapter.type: trackings` resolves to the in-process TrackingAdapterFactory
# the App registers at startup with a live handle to the core services.
#
# ## A2a scope (read path)
#
# The whole non-deleted tracking list loads once into an eager snapshot —
# one flat row per started/stopped interval, newest first. Columns are typed
# (M2): `taskpath` is a `kind: path` (the task's parent chain, styled with a
# separator), `started`/`ended` are localized datetimes, `duration` is a
# right-aligned `H:MM:SS`.
#
# **Live durations (M9).** A running tracking's duration ticks every second.
# Instead of a render-time `kind: elapsed` column (which can't also show a
# completed tracking's static `ended − started` in the *same* column), the
# adapter drives the generic live-row mechanism: while ≥1 tracking runs it
# asks the frontend to pull `live_rows()` at 1 Hz and patches the running
# rows in place; when the last one stops the pull stops. So the single
# `duration` column reads live for active rows and static for completed ones.
#
# **Grouping + totals (E2).** `group_by` + `aggregates` below bucket the
# list by day and sum the durations per group + overall (footer). `zg`
# cycles the grouping at runtime (Day/Week/Month/Year/None) and `u` opens
# a direct-jump menu over the same five states (native-`u` parity); the
# status is view-state, not persisted. Drop the `group_by` block for a
# flat list.
#
# Saved-query filtering (`q` menu / `:query`) runs a `FilterExpr` through the
# repository (`find_filtered`, which understands tracking columns and the
# joined task description) and thins the list to the matches.
#
# ## A2b scope (mutations)
#
# `d` soft-deletes a tracking (keeping its times) through the confirm flow;
# `R`/`A` restore deleted trackings; `s` toggles time tracking on the row's
# task. See the `shortcuts:` block below. Scripts run via the generic
# `:script` menu (`x`, `type: script`).
#
# ## A2c scope (Condensed + Tree)
#
# The native "Condensed" mode is rebuilt as a second view (`key: v`) on the
# generic **nested grouping** (M3 `then_by`): the list groups by day
# (`group_by`) and then by task (`then_by`), with `summary_only` collapsing
# each (day, task) cell to one summed row.
#
# The native "Tree" mode is a third view (`key: t`): the *task forest*
# (`tracking:tree-item`) with tracked time rolled up per task. Its `duration`
# column declares a `tree_aggregate` fold — `zt` toggles each task between its
# **own** tracked time and its **subtree-cumulated** total (M4). The adapter
# supplies both values and advertises `supports_tree_aggregation`.
#
# `a` switches back to the flat list from either.
#
# Until the C1 cutover this file is illustrative: the bespoke native Trackings
# tab still ships; copying this file in stands up the adapter path alongside
# it for comparison.

tab:
  name: Trackings
  order: 2
  icon: "󱎫"

adapter:
  type: trackings

views:
  # Flat list of trackings. No `tree_label` / no children — every row is a
  # leaf (`tracking:entry`). `key: a` switches back here from Condensed
  # (mirrors the native "normal" mode key).
  - name: trackings
    node_type: "tracking:entry"
    default: true
    key: a

    # Saved-query filter. Queries live as one file per name under the
    # adapter's data dir (`<data>/not_yet_done/trackings/<id>/queries/
    # <name>.yaml`, raw FilterExpr body) — define them with `:query new`
    # or drop files in by hand; the `q` menu lists them. Shortcut keys
    # are stored separately in the `query_shortcut` DB table, scoped
    # `trackings/<id>/<view>` (set them with ctrl+s inside the menu).
    # `editable: false` drops the top-level `Q` edit-query binding — the
    # `q` menu's ctrl+e edit covers rewriting bodies, so the extra key
    # only added noise next to the native tab.
    #
    # `default:` is a raw query body applied on startup (native parity:
    # the bespoke tab starts time-boxed to the last month). Drop it to
    # show the whole list.
    query:
      editable: false
      menu_key: q
      default: |
        query:
          and:
            - [deleted, =, false]
            - [started_at, gt, last month]

    # Group by calendar day, newest day first (`order: desc` — group keys
    # are ISO-formatted, so lexical descending = reverse-chronological).
    # `zg` re-buckets at runtime (Day → Week → Month → Year → None). The
    # day headers render with ISO week + weekday (`W24 2026-06-08 Mon`).
    #
    # `total_column: total` routes each day's summed duration into the
    # dedicated `total` column on the day's *last* row instead of onto the
    # `──` header — the classic time-sheet layout where a Total column
    # closes each day. The `total` column hides while grouping is off.
    group_by:
      column: started
      bucket: day
      order: desc
    aggregates:
      - column: duration
        op: sum
        total_column: total

    # Tree-label-less flat columns. `taskpath` (the parent chain) renders as
    # a styled `kind: path`; `started`/`ended` as localized datetimes (a
    # running tracking shows `running` in Ended); `duration` as right-aligned
    # `H:MM:SS` (live for running rows, see M9).
    columns:
      # Running-tracking marker: a `⏱` glyph on open rows, blank otherwise.
      - key: marker
        label: "⏱"
        style: accent
        sizing: max
      # Constant 30-wide task name (long descriptions truncate) so the time
      # columns never get squeezed; the path column flexes into the rest.
      # `fixed` counts toward the pane budget — `auto(5,30)` would not and
      # would push the trailing `total` column off-screen.
      - key: task
        label: Task
        source: label
        style: text_med
        sizing: "fixed(30)"
      - key: started
        label: Started
        kind: datetime
        style: secondary
        sizing: max
      - key: ended
        label: Ended
        kind: datetime
        style: secondary
        sizing: max
      - key: duration
        label: Duration
        kind: duration
        style: tertiary
        sizing: max
      - key: taskpath
        label: Taskpath
        kind: path
        separator: "/"
        style: text_med
        sizing: "flex(1)"
      # Per-group total target (see `aggregates` above). Only visible while
      # grouped; filled on each day's closing row + the Σ footer.
      - key: total
        label: Total
        kind: duration
        style: accent
        sizing: max

    actions:
      # Local filter-while-typing over the loaded rows.
      - name: fuzzy filter
        key: f
        type: fuzzy_filter
        fuzzy_filter:
          fields: [task, taskpath]
      # Run a script against the selected tracking (generic `:script` menu;
      # scripts live under `<data>/not_yet_done/scripts/trackings/tracking_entry/`).
      - name: script
        key: x
        type: script
      - name: refresh
        key: r
        type: reload

    # Adapter-backed per-row shortcuts (A2b), dispatched via `invoke_action`
    # against the selected tracking (or, for `restore all`, the list root via
    # the `parent:` prefix).
    #
    #   * `d` delete — soft-delete the tracking, keeping its start/end times,
    #     through the generic confirm-then-delete flow. The row drops out of
    #     the list (only non-deleted trackings are shown).
    #   * `R` restore — undelete a previously deleted tracking (and purge the
    #     successors a split produced). `A` restore-all does the same across
    #     every deleted tracking the list can reach.
    #   * `s` toggle-tracking — start/stop time tracking on the row's *task*
    #     (shares the host's exclusivity policy with the Tasks tab).
    #
    # Note: the list shows only non-deleted rows, so `R`/`A` are recovery
    # hooks with no visible target today — a "show deleted" sub-view is future
    # work. This mirrors the bespoke native Trackings tab exactly.
    shortcuts:
      d: delete
      R: restore
      s: toggle-tracking
      A: parent:restore-all

  # ── Condensed (A2c) ──────────────────────────────────────────────────
  #
  # The native Trackings "Condensed" mode, rebuilt on the generic nested
  # grouping (M3 `then_by`). Switched to with `v` (mirrors the native
  # condensed key); `a` switches back to the flat list above.
  #
  # Two grouping levels: the **outer** `group_by` buckets by calendar day,
  # the **inner** `then_by` groups by task. `summary_only: true` collapses
  # each (day, task) cell to a single representative row showing the task's
  # path + name and the summed duration for that task *on that day*. So a
  # task worked on across two days appears once per day, each with that
  # day's total — exactly the native two-level Condensed layout.
  #
  # `zg` cycles only the outer (day) level (Day → Week → Month → Year →
  # None); the inner per-task grouping always stays. With the outer level
  # cycled off you get one row per task over the whole filtered range.
  #
  # The inner level keys on the hidden `task_id` field, never the visible
  # `task` label, so two distinct tasks that happen to share a description
  # do not merge.
  - name: condensed
    node_type: "tracking:entry"
    key: v

    # Same saved-query filter + startup default as the flat list.
    query:
      editable: false
      menu_key: q
      default: |
        query:
          and:
            - [deleted, =, false]
            - [started_at, gt, last month]

    group_by:
      column: started
      bucket: day
      order: desc
    then_by:
      - column: task_id
    summary_only: true
    aggregates:
      - column: duration
        op: sum
        total_column: total

    # No started/ended columns — a condensed row spans many intervals, so a
    # single start/end is meaningless. Task + path + the summed duration,
    # with the day total closing each day in the `total` column.
    columns:
      - key: marker
        label: "⏱"
        style: accent
        sizing: max
      - key: task
        label: Task
        source: label
        style: text_med
        sizing: "fixed(30)"
      - key: duration
        label: Duration
        kind: duration
        style: tertiary
        sizing: max
      - key: taskpath
        label: Taskpath
        kind: path
        separator: "/"
        style: text_med
        sizing: "flex(1)"
      - key: total
        label: Total
        kind: duration
        style: accent
        sizing: max

    # Same per-row shortcuts as the flat list (delete/restore/toggle act on
    # the representative tracking of the selected condensed row).
    shortcuts:
      d: delete
      R: restore
      s: toggle-tracking
      A: parent:restore-all

  # ── Tree (A2c) ───────────────────────────────────────────────────────
  #
  # The native Trackings "Tree" mode: the *task forest* with tracked time
  # rolled up per task. Each row is a `tracking:tree-item` (a task, not a
  # single interval); drilling expands a task's subtasks. Switched to with
  # `t` (toggle-tracking moved to `s`, the native track key, freeing `t`
  # for the subtab — full native key parity); `a` switches
  # back to the flat list.
  #
  # The `duration` column declares `tree_aggregate`: by default it shows each
  # task's **subtree-cumulated** total (own + all descendants), and `zt`
  # toggles every such column to the task's **own** tracked time. The adapter
  # supplies both as canonical seconds (`duration` = own, `duration_cumulated`
  # = subtree) and advertises `supports_tree_aggregation`; the engine never
  # folds the tree itself (it's lazy), so the cumulated value is the
  # adapter's. The tree is pruned to tasks with tracked time somewhere in
  # their subtree, and durations bake at load (no live tick, like Condensed).
  - name: tree
    node_type: "tracking:tree-item"
    key: t
    tree_label: task
    # Connector-glyph color for this tree (box prefix + expand arrows). Omit
    # to inherit the theme's `tree_connector`. See tasks.yaml for the rationale.
    tree_connector_style: text_dim

    columns:
      - key: task
        label: Task
        source: label
        style: text_high
        sizing: "flex(1)"
      - key: marker
        label: "⏱"
        style: accent
        sizing: max
      # Duration with a tree-fold toggle. `default: cumulated` shows the
      # subtree total first; `zt` flips all `tree_aggregate` columns to the
      # node's own value (read from the column's own `key`, `duration`).
      - key: duration
        label: Duration
        kind: duration
        sizing: max
        tree_aggregate:
          cumulated_field: duration_cumulated
          default: cumulated

    actions:
      # Local filter-while-typing over the loaded task rows.
      - name: fuzzy filter
        key: f
        type: fuzzy_filter
        fuzzy_filter:
          fields: [task]
      - name: refresh
        key: r
        type: reload

    # `s` starts/stops tracking on the selected task (adapter `toggle-tracking`,
    # shared exclusivity policy).
    shortcuts:
      s: toggle-tracking

    children:
      # Recursive subtask branch — the same ChildDef at every depth. Drilling
      # a task expands its subtasks (those with tracked time), and so on.
      - name: subtasks
        node_type: "tracking:tree-item"
        tree_label: task
        recursive: true

        columns:
          - key: task
            label: Task
            source: label
            style: text_high
            sizing: "flex(1)"
          - key: marker
            label: "⏱"
            style: accent
            sizing: max
          - key: duration
            label: Duration
            kind: duration
            sizing: max
            tree_aggregate:
              cumulated_field: duration_cumulated
              default: cumulated

        actions:
          - name: refresh
            key: r
            type: reload

        shortcuts:
          s: toggle-tracking
