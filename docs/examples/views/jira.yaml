# Example: Jira view configuration
#
# Place in: ~/.config/not_yet_done/views/jira.yaml
# Adapter config: ~/.config/not_yet_done/views/jira-adapter.yaml

tab:
  name: Jira
  order: 3
  icon: "󰌃"

adapter:
  type: jira
  config: jira-adapter.yaml

views:
  # This tab has two subtabs: the normal ticket list (`key: i`) and the
  # bookmarks list (`key: m`, defined below). Switch between them with those
  # keys. Both render the same `jira:issue` rows, so drill-down, comments,
  # attachments, edit and transitions behave identically — the bookmarks
  # subtab only swaps the root listing (bookmarked issues) and drops the
  # query/JQL menu. They share one bookmark set (stored per Jira server).
  - name: tickets
    node_type: "jira:issue"
    default: true
    key: i

    query:
      default: "assignee = currentUser() ORDER BY updated DESC"
      editable: true
      # `menu_key` opens the q-menu that lists *all* saved queries for
      # this view. Saved-query bodies are no longer carried in this
      # file — manage them with `:query new <name>` / `:query edit
      # <name>` / `:query delete <name>` (the body file is owned by
      # the adapter, one YAML/JQL file per query under the adapter's
      # per-instance data dir). Keyboard shortcuts for saved queries
      # are bound via Ctrl+f in the q-menu and stored in the
      # `query_shortcut` table — they survive across YAML edits.
      menu_key: q

    columns:
      - key: key
        label: Key
        style: accent
        sizing: max
      - key: type
        label: Type
        sizing: max
      - key: status
        label: Status
        style: success
        sizing: max
      - key: priority
        label: Priority
        style: warning
        sizing: max
      - key: summary
        label: Summary
        source: label
        style: text_high
        sizing: "flex(1)"

    preview:
      enabled: true
      source: content
      split: horizontal
      ratio: 50
      keybinding: p

    actions:
      - name: fuzzy filter
        key: f
        type: fuzzy_filter
        fuzzy_filter:
          fields: [key, summary] # only search these fields (omit for all)
      - name: search
        key: /
        type: search
        search:
          fields: [summary, key] # /-search target fields (omit for all)
      - name: free text
        key: s
        type: text_search
        text_search:
          # Optional prompt shown in the action bar while the input is open
          # (defaults to "free-text search…").
          prompt: "Jira-Suche"
          # `{q}` is replaced by the user's input ("\" and `"` get escaped).
          # `{key_or}` expands to `issuekey = "{q}" OR ` when the input matches
          # `PROJECT-123`, and to the empty string otherwise — so the same
          # template works for both free-text searches and direct key lookups.
          # No `ORDER BY` clause → Jira sorts `text ~`-matches by relevance
          # (Lucene score), like the in-product search field does.
          query_template: '{key_or}text ~ "{q}"'
      - name: edit + comments
        key: e
        type: edit
        id: edit_with_comments # body + all comments inline; `--- add ---` to post
      - name: edit
        key: E
        type: edit
        id: edit_full # Node-side action id (see jira adapter)
      - name: refresh
        key: r
        type: reload
      - name: comments
        # `c` is reserved tab-wide by the built-in column-config fallback
        # (likewise `S` = sort, `:` = command line). Binding an action to
        # one of those keys is a hard config error at startup — hence `C`
        # (Shift+C) here. To deliberately take the key anyway, set
        # `force: true` on the action: it drops the built-in claim for that
        # key on this level so the action wins cleanly.
        key: C
        type: navigate
        navigate_to: "jira:comment"
      - name: attachments
        key: a
        type: navigate
        navigate_to: "jira:attachment"
      - name: transition
        key: t
        type: custom
        id: transition # InputSpec::Picker — adapter supplies options
      - name: toggle watch
        key: w
        type: custom
        id: toggle_watch # InputSpec::None — toggles current user's watch state
      - name: bookmark
        key: B
        type: custom
        # InputSpec::None — toggles this issue's bookmark *without* a
        # confirmation prompt (a `type: custom` action dispatches straight to
        # `execute`). Bookmarks are stored in the adapter's cache DB keyed by
        # the Jira server, so the bookmarks subtab below lists exactly these
        # issues regardless of which view-file instance set them.
        id: toggle-bookmark
      - name: download attachments
        key: D
        type: custom
        # InputSpec::Form — prompts for a target directory, then saves every
        # attachment of *this issue* there as `<id>-<filename>` (same helper as
        # the attachment list's `download all`; created if missing). The
        # issue-level variant lets a script fetch all files with only the key.
        id: download-attachments
      # `export-bundle` (InputSpec::None) emits a single JSON document —
      # metadata, `[~user]`→display-name map, the attachment manifest (with the
      # exact on-disk `<id>-<filename>`), and all comments (newest first). It is
      # meant for scripts via the CLI (`nyd jira do export-bundle <KEY>`); the
      # body itself comes from the generic `cat` verb. Bind a key here only if
      # you want it in the TUI action bar.

    children:
      - name: Comments
        key: c
        node_type: "jira:comment"
        columns:
          - key: author
            label: Author
            style: accent
            sizing: max
          - key: created
            label: Created
            sizing: max
          - key: body
            label: Comment
            source: label
            sizing: "flex(1)"

        preview:
          enabled: true
          source: content
          split: horizontal
          ratio: 50
          keybinding: p

        actions:
          - name: fuzzy filter
            key: f
            type: fuzzy_filter
          - name: edit
            key: e
            type: edit
            id: edit_full
          - name: add
            key: a
            type: create
            id: create_comment

      - name: Attachments
        key: a
        node_type: "jira:attachment"
        columns:
          - key: filename
            label: Filename
            source: label
            style: accent
            sizing: "flex(1)"
          - key: author
            label: Author
            sizing: max
          - key: size
            label: Size
            sizing: max
          - key: mime_type
            label: Type
            sizing: max
          - key: created
            label: Created
            sizing: max
        actions:
          - name: open
            key: o
            type: custom
            id: open # downloads + xdg-open in background
          - name: download all
            key: D
            type: custom
            id: download_all # InputSpec::Form — prompts for a target directory,
            # then saves every attachment of the issue there (dir created if
            # missing; errors on a non-directory path or no permission)
        # `delete` must be a `shortcuts:` binding (not an `actions:` entry): a
        # row-level `type: custom` action dispatches straight to `execute` and
        # cannot ask for confirmation, whereas a shortcut routes through
        # `invoke_action`, which returns `DeleteSelf` so the TUI shows a
        # `(y/n)` prompt before the irreversible REST delete.
        shortcuts:
          d: delete

  # ── Bookmarks subtab ─────────────────────────────────────────────────────
  # Switch here from the tickets subtab with `m`; switch back with `i`. This
  # is the ordinary tickets view restricted to the issues you bookmarked
  # (toggle with `B` in the tickets subtab). The rows are the same
  # `jira:issue` nodes, so drill-down / comments / attachments / edit /
  # transitions behave exactly as above. The only deliberately-missing piece
  # is the query/JQL menu: the bookmark set *is* the query.
  - name: bookmarks
    node_type: "jira:bookmark"
    key: m

    # No `query:` block — the bookmark set is the query. There is no JQL
    # editing and no q-menu here (the one function the bookmarks subtab drops).

    columns:
      - key: key
        label: Key
        style: accent
        sizing: max
      - key: type
        label: Type
        sizing: max
      - key: status
        label: Status
        style: success
        sizing: max
      - key: priority
        label: Priority
        style: warning
        sizing: max
      - key: summary
        label: Summary
        source: label
        style: text_high
        sizing: "flex(1)"
      # Synthetic column carried only by the bookmarks listing. Sort it
      # locally on demand (`S` / the sort menu) — there is no default
      # ordering. `kind: datetime` parses the RFC3339 stamp for the sort.
      - key: bookmarked_at
        label: Bookmarked
        kind: datetime
        sizing: max

    preview:
      enabled: true
      source: content
      split: horizontal
      ratio: 50
      keybinding: p

    actions:
      - name: fuzzy filter
        key: f
        type: fuzzy_filter
        fuzzy_filter:
          fields: [key, summary]
      - name: search
        key: /
        type: search
        search:
          fields: [summary, key]
      - name: edit + comments
        key: e
        type: edit
        id: edit_with_comments
      - name: edit
        key: E
        type: edit
        id: edit_full
      - name: refresh
        key: r
        type: reload
      - name: comments
        key: C
        type: navigate
        navigate_to: "jira:comment"
      - name: attachments
        key: a
        type: navigate
        navigate_to: "jira:attachment"
      - name: transition
        key: t
        type: custom
        id: transition

    # Removing a bookmark here asks for confirmation. Like the attachment
    # `delete` above, this must be a `shortcuts:` binding (not an `actions:`
    # entry): a shortcut routes through `invoke_action`, which returns
    # `Confirm` so the TUI shows a `(y/n)` prompt; on "y" the bookmark is
    # dropped and the row disappears on reload. (The tickets subtab's `B`
    # toggles without confirmation via `execute`.)
    shortcuts:
      b: remove-bookmark

    children:
      - name: Comments
        key: c
        node_type: "jira:comment"
        columns:
          - key: author
            label: Author
            style: accent
            sizing: max
          - key: created
            label: Created
            sizing: max
          - key: body
            label: Comment
            source: label
            sizing: "flex(1)"
        preview:
          enabled: true
          source: content
          split: horizontal
          ratio: 50
          keybinding: p
        actions:
          - name: fuzzy filter
            key: f
            type: fuzzy_filter
          - name: edit
            key: e
            type: edit
            id: edit_full
          - name: add
            key: a
            type: create
            id: create_comment

      - name: Attachments
        key: a
        node_type: "jira:attachment"
        columns:
          - key: filename
            label: Filename
            source: label
            style: accent
            sizing: "flex(1)"
          - key: author
            label: Author
            sizing: max
          - key: size
            label: Size
            sizing: max
          - key: mime_type
            label: Type
            sizing: max
          - key: created
            label: Created
            sizing: max
        actions:
          - name: open
            key: o
            type: custom
            id: open
          - name: download all
            key: D
            type: custom
            id: download_all
        shortcuts:
          d: delete
