# Example: Taiga view configuration
#
# Place in: ~/.config/not_yet_done/views/taiga.yaml
# Adapter config: ~/.config/not_yet_done/views/taiga-adapter.yaml
#
# Unlike Jira, Taiga has no JQL — every query body is a YAML mapping
# with three top-level keys:
#
#   queries:   list of {type, ...filter} entries — each fires one API
#              call against `/api/v1/{type}s` (tasks/issues/epics/
#              userstories). Required.
#   sort:      optional default sort, list of {column, direction}.
#              Runtime sort from the UI overrides this.
#              Columns: ref, type, status, assignee, creator, subject,
#              modified, project.
#   page:      optional `{ size: N }` — default page size for this view.
#              The TUI may request a different offset/limit at runtime.
#
# In each `queries:` entry both `type` and any filter field can be a
# YAML list — the entry then fans out into the cartesian product. This
# is needed because Taiga's API rejects multi-value filters
# (`?project=2,3` → 400, `?project__in` is silently ignored, repeated
# `?project=...` only keeps the last).
#
# Placeholders inside query templates (resolved by the TUI before the
# adapter ever sees the YAML):
#   <input>            → user input from the action bar (escaped).
#   <input_if_numeric> → numeric input is substituted as-is; non-numeric
#                        input becomes the sentinel `__OMIT__`, which
#                        causes the adapter to drop the containing
#                        query block.
# Adapter-side placeholder:
#   $me → resolved against /api/v1/users/me at request time.

tab:
  name: Taiga
  order: 4
  icon: "󰓦"

adapter:
  type: taiga
  config: taiga-adapter.yaml

views:
  - name: items
    node_type: "taiga:item" # virtual: lets the merged list mix all four types
    default: true

    query:
      # Default query: everything assigned to me, all four types in one
      # sorted feed. The list-valued `type` field fans out into one API
      # call per type — `userstory` needs its own block because of the
      # extra `is_archived` filter.
      default:
        queries:
          - { type: [task, issue, epic], assigned_to: $me }
          - { type: userstory, assigned_to: $me, is_archived: false }
          # User stories support multiple assignees (`assigned_users`); the
          # server-side `assigned_to` filter only matches the primary one, so a
          # second block catches stories where you're a secondary assignee.
          - { type: userstory, assigned_users: $me, is_archived: false }
        sort:
          - { column: type, direction: asc }
          - { column: modified, direction: desc }
        page:
          size: 50
      editable: false
      # `menu_key` opens the q-menu that lists *all* saved queries for
      # this view. Saved-query bodies are no longer carried in this
      # file — manage them with `:query new <name>` / `:query edit
      # <name>` / `:query delete <name>` (the adapter writes one YAML
      # file per query under
      # `<XDG_DATA_HOME>/not_yet_done/taiga/<instance>/queries/`).
      # Keyboard shortcuts for saved queries are bound via Ctrl+f in
      # the q-menu and stored in the `query_shortcut` DB table.
      menu_key: q

    columns:
      - key: ref
        label: Ref
        style: accent
        sizing: max
      - key: type
        label: Type
        sizing: max
      - key: status
        label: Status
        style: success
        sizing: max
      - key: assignee
        label: Assignee
        sizing: max
      # Who filed the item (Taiga's `owner`). Read-only, like `assignee`.
      - key: creator
        label: Creator
        sizing: max
      - key: subject
        label: Subject
        source: label
        style: text_high
        sizing: "flex(1)"

    # Preview pane:
    #   source: "content" (default) reads node.content().read_text().
    #   source: "action" runs the named adapter action's `prepare()` and
    #     shows the resulting editor template — useful for previewing
    #     the buffer that `e` would open. `action: <id>` is required.
    #   node_id_from: <metadata-key> redirects the preview at a linked
    #     node — same semantics as ActionDef.node_id_from. E.g. a
    #     notification row carries `target_id: userstory:42` and the
    #     preview shows that target instead of the notification itself.
    # Scroll the preview pane with ctrl+u / ctrl+d (half page).
    preview:
      enabled: true
      source: content
      split: horizontal
      ratio: 50
      keybinding: p

    actions:
      - name: fuzzy filter
        key: f
        type: fuzzy_filter
        fuzzy_filter:
          fields: [ref, subject]
      - name: search
        key: /
        type: search
        search:
          fields: [subject, ref]
      - name: free text
        key: s
        type: text_search
        text_search:
          prompt: "Taiga-Suche"
          # YAML query template. <input> is replaced by the (escaped)
          # search term.
          #
          # `q` is Taiga's own full-text filter and already covers the ref,
          # so "112" and "#112" both find item #112 — no extra `ref:` block
          # needed. Do not add one: Taiga's list endpoints ignore `ref` as a
          # filter and answer with the *complete* unfiltered list, which
          # would bury the actual hits.
          #
          # List every type that should be searchable — a type missing here
          # is simply never found.
          query_template:
            queries:
              - { type: [task, issue, epic, userstory], q: "<input>" }
      - name: edit + comments
        key: e
        type: edit
        id: edit_with_comments
      - name: edit
        key: E
        type: edit
        id: edit_full
      - name: refresh
        key: r
        type: reload
      - name: comments
        key: C
        type: navigate
        navigate_to: "taiga:comment"
      - name: attachments
        key: a
        type: navigate
        navigate_to: "taiga:attachment"
      - name: toggle watch
        key: w
        type: custom
        id: toggle_watch
      - name: upload attachment
        key: A
        type: custom
        id: upload_attachment
      # Convert an item to another type. Opens a target-type picker (issue,
      # epic, user story — never task, and never the row's own type); tasks can
      # convert out but are never a target. Picking a target opens a
      # type-specific editor pre-filled with the target's fields plus a note
      # listing what has no equivalent there. On save the adapter creates the
      # target, migrates comments + attachments, then DELETES the source. It is
      # a `custom` (Picker) action; the per-target `convert:<type>` editors it
      # opens need no keybinding of their own.
      - name: convert
        key: V
        type: custom
        id: convert
        # Modal menu→editor flow: keep it in the top action bar (custom is
        # otherwise status-bar-only) and light it up while the target picker or
        # its editor is open.
        in_action_bar: true

    children:
      - name: Comments
        key: c
        node_type: "taiga:comment"
        columns:
          - key: author
            label: Author
            style: accent
            sizing: max
          - key: created
            label: Created
            sizing: max
          - key: body
            label: Comment
            source: label
            sizing: "flex(1)"
        preview:
          enabled: true
          source: content
          split: horizontal
          ratio: 50
          keybinding: p
        actions:
          - name: fuzzy filter
            key: f
            type: fuzzy_filter
          - name: edit
            key: e
            type: edit
            id: edit_full
        # `delete` must be a `shortcuts:` binding (not an `actions:` entry): a
        # row-level `type: custom` action dispatches straight to `execute` and
        # cannot ask for confirmation, whereas a shortcut routes through
        # `invoke_action`, which returns `DeleteSelf` so the TUI shows a
        # `(y/n)` prompt before the irreversible REST delete.
        shortcuts:
          d: delete

      - name: Attachments
        key: a
        node_type: "taiga:attachment"
        columns:
          - key: filename
            label: Filename
            source: label
            style: accent
            sizing: "flex(1)"
          - key: size
            label: Size
            sizing: max
          - key: created
            label: Created
            sizing: max
          - key: description
            label: Description
            sizing: "flex(1)"
        actions:
          - name: open
            key: o
            type: custom
            id: open
          - name: download all
            key: D
            type: custom
            id: download_all # InputSpec::Form — prompts for a target directory,
            # then saves every attachment of the item there (dir created if
            # missing; errors on a non-directory path or no permission)
        # `delete` must be a `shortcuts:` binding (not an `actions:` entry): a
        # row-level `type: custom` action dispatches straight to `execute` and
        # cannot ask for confirmation, whereas a shortcut routes through
        # `invoke_action`, which returns `DeleteSelf` so the TUI shows a
        # `(y/n)` prompt before the irreversible REST delete.
        shortcuts:
          d: delete
