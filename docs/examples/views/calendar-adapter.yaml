# Example: Calendar adapter connections + credentials
#
# Place in: ~/.config/not_yet_done/views/calendar-adapter.yaml
# Referenced by calendar.yaml via: adapter.config: calendar-adapter.yaml
#
# This adapter is multi-connection: one `connections` entry per calendar
# source. Entries may mix backend types and include several instances of the
# same backend — the example below connects TWO Microsoft 365 mailboxes
# (Teams/Outlook show the same calendar), each its own connection.
#
# Backends are compiled in via cargo features (default: `microsoft`). A
# connection whose `backend:` isn't compiled into the build is a startup error.
#
# Each connection's `config:` sub-tree is opaque to the adapter and handed
# verbatim to that backend — so its shape is backend-specific. For
# `backend: microsoft` it is:
#
#   token   — a credential provider yielding a Graph bearer token (required)
#   name    — display label for the "Account" column (optional; defaults to id)
#
# Auth (first iteration) is a bearer token from a `command` credential
# provider. The Azure CLI mints a Graph token for a logged-in account:
#
#   az account get-access-token \
#     --resource https://graph.microsoft.com \
#     --tenant <TENANT_ID> \
#     --query accessToken -o tsv
#
# The token is resolved lazily and re-resolved automatically on a 401, so an
# az-minted token (≈1 h lifetime) refreshes without a reconnect. A full
# in-process OAuth2 device-code flow can be added later as a second `token`
# mechanism without touching the view or this file's shape.
#
# For `backend: office365-web` (browser-driven; for tenants where Graph is
# blocked by device-compliance Conditional Access and the calendar lives behind
# Outlook on the web) the `config:` sub-tree is instead:
#
#   account_key   — session registry key (required). Connections sharing a key
#                   share ONE browser, so a single interactive sign-on serves
#                   them all (e.g. a calendar and a future mail backend).
#   name          — display label for the "Account" column (optional).
#   account       — the account the flow signs on as (optional; becomes the
#                   flow's `{{data.account}}`). Leave it out only when the
#                   browser's own values file names the account — with two
#                   connections each must name its own.
#   profile_dir   — persistent browser data directory (required); the sign-on
#                   and its cookies survive here across restarts. `~/` is
#                   expanded against $HOME.
#   headless      — rest hidden (optional; true). `false` always shows the
#                   browser window, for a fully manual setup.
#   auto_headed   — while resting hidden, show the window the moment the run
#                   has something to say to you (the second factor) and hide
#                   it again once the run is over (optional; true). `false`
#                   never pops a window: what the run says then reaches you
#                   through the event bus alone (see calendar.yaml).
#   secrets       — one credential provider per secret the flow may ask for,
#                   keyed by the name the flow declares (optional). Any
#                   provider works; `command` wrapping `pass`/`op` is the
#                   intended default.
#   flow          — the flow a calendar read runs: a name on the browser's
#                   shelf or a path to a flow directory (optional;
#                   `nyd-calendar`).
#   browser       — the `drunken-browser` binary (optional; found on PATH).
#
# This backend starts one hidden `drunken-browser` per account_key and drives
# it over its socket: every calendar read runs the `nyd-calendar` flow from the
# browser's shelf, which signs on if it has to, fetches the calendar view and
# yields the events. Secrets never touch the browser's command line or
# environment: the flow *asks* for a secret it needs, the answer is resolved
# here and handed to the run over the socket. For that to happen the browser's
# own values file (`~/.config/browsertest/values.yaml`) must say `ask` for the
# secret — a command written there wins over this config, for every account.
# When the sign-on reaches the second factor the run says so ("Tap 42 on your
# phone to sign in"); the sentence is published on the event bus as
# `office365-web:mfa:number-match` and, with `auto_headed`, the window comes up
# for it. Enable the backend with the `office365-web` cargo feature (on by
# default).

connections:
  - id: work
    backend: microsoft
    config:
      name: Work
      token:
        # `command` runs a shell command and uses its trimmed stdout.
        type: command
        script: >-
          az account get-access-token
          --resource https://graph.microsoft.com
          --tenant <WORK_TENANT_ID>
          --query accessToken -o tsv

  - id: side
    backend: microsoft
    config:
      name: Side project
      token:
        type: command
        script: >-
          az account get-access-token
          --resource https://graph.microsoft.com
          --tenant <SIDE_TENANT_ID>
          --query accessToken -o tsv

  # A tenant reachable only through the browser (Graph blocked). No token — the
  # browser signs on itself and keeps the session in profile_dir. The flow asks
  # for the password by the name it declares (`calendar-password`); the
  # provider below answers. Drop `secrets` to type the password by hand in the
  # browser window.
  - id: web
    backend: office365-web
    config:
      account_key: web
      name: Web calendar
      account: user@example.com
      profile_dir: ~/.local/state/not_yet_done/office365-web/web
      headless: true
      auto_headed: true
      secrets:
        calendar-password:
          # `command` runs a shell command and uses its trimmed stdout — here a
          # password manager. Any credential provider works (env, file, keyring).
          type: command
          script: pass show example/office365/password
      # flow: nyd-calendar
      # browser: ~/.cargo/bin/drunken-browser

  # A CalDAV server (backend: caldav) — mail.de, Nextcloud, Baïkal, Fastmail,
  # iCloud, Radicale, … Auth is HTTP Basic. `url` is the entry point: a
  # principal, a calendar-home, or a single calendar collection URL; the backend
  # discovers the account's calendars from it and asks the server to expand
  # recurring events into concrete instances. Enable with the `caldav` cargo
  # feature (on by default). The `config:` sub-tree is:
  #
  #   url        — entry URL (required): principal / calendar-home / collection.
  #   username   — credential provider for the Basic-auth login (required).
  #   password   — credential provider for the Basic-auth password (required).
  #   name       — display label for the "Account" column (optional).
  #   calendars  — explicit collection URLs to query, skipping discovery
  #                (optional; absolute URLs or paths relative to the server root).
  #   danger_accept_invalid_certs — skip TLS verification for a self-signed
  #                private server (optional; default false — leave off for
  #                public providers).
  #   request_timeout_secs — per-request timeout (optional; default 30).
  - id: mailde
    backend: caldav
    config:
      name: mail.de
      url: https://kalender.mail.de/principals/user@mail.de
      username:
        type: literal
        value: user@mail.de
      password:
        type: command
        script: pass show example/mailde/password
      # Pin specific calendars instead of discovering them all:
      # calendars:
      #   - /calendars/user@mail.de/private/

# How often (seconds) the background task re-fetches every connection to detect
# externally-made changes and refresh the view. Optional; defaults to 300.
# poll_interval_secs: 300

# Event window: how many days back / forward the listing spans, resolved
# against "now" on every fetch. Optional; default 7 back / 30 forward.
# window_past_days: 7
# window_future_days: 30

# Reminder lead times: how many minutes before a timed event's start the
# adapter emits a reminder — one fire per entry, so `[15, 5]` reminds fifteen
# *and* five minutes ahead. Accepts a bare scalar (`5`) or a list. This is only
# the *when*; whether a tab acts on reminders and what command runs is the
# frontend's choice — see the `reminder:` block in calendar.yaml. Optional;
# defaults to a single 5-minute reminder. An empty list turns reminders off.
# reminder_lead_minutes: [15, 5]
