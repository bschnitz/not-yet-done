# Example: Calendar view configuration
#
# Place in: ~/.config/not_yet_done/views/calendar.yaml
# Connections + credentials live in the adapter config referenced below —
# see calendar-adapter.yaml next to this file.
#
# One adapter, many calendars: the `calendar` adapter aggregates events from
# every configured connection (see calendar-adapter.yaml) into a single flat,
# time-sorted list — the calendar counterpart of the trackings tab. Rows from
# all accounts are merged; the `account` column shows each event's origin.
#
# Grouping is engine-side, exactly like the trackings / Kimai views: `group_by`
# buckets the rows by day on the (local-time) `start`, `zg` cycles the bucket
# (Day/Week/Month/Year/None) at runtime, and `S` opens the item-sort picker
# over the adapter's sortable columns (start, end, account, show_as, title).
#
# Filtering is the same saved-query mechanism the trackings tab uses (see the
# `query:` block on the view below): a `FilterExpr` body, evaluated in memory
# against the loaded events. Natural-language dates on `start`/`end` resolve
# exactly as on trackings (`[start, gte, "next monday"]`), and title search is
# `[title, has, "standup"]` (case-insensitive substring). Columns:
# `title`/`subject`, `start`, `end`, `account`/`calendar`, `location`,
# `organizer`, `show_as`/`status`, `body`, `all_day`. The query only narrows
# the already-loaded time window (`window_*_days` in the adapter config), so a
# date bound outside that window matches nothing until the window is widened.
#
# Read-only for now. Live update is automatic and decoupled: the adapter polls
# every connection in the background (`poll_interval_secs` in the adapter
# config) and, when it detects an externally-made change, refreshes the view on
# its own — no key press needed. `r` forces an immediate refresh.
#
# Load mode — three choices, set by `adapter.auto_connect` below:
#   * `startup`: the calendar loads as soon as the app starts, opening the
#     connection(s) up front. The background poll then keeps it fresh. Best
#     when connecting is cheap and you always want it live — but a backend
#     that needs an answer to log in will raise its dialog at startup, over
#     whatever tab you are on.
#   * `on_open`: it connects the first time you switch to this tab — the same
#     up-front load, but only for a day you actually open the calendar, and any
#     login dialog lands on the tab it belongs to.
#   * omitted / `never` (default): nothing connects until you focus the tab and press `r` (the
#     `reload` action). Until then the tab shows a "press r to connect" banner
#     and no connection — and no browser, for the browser-backed backends — is
#     opened. The background poll also stays dormant until that first load, so
#     the browser only ever appears on demand. Best for expensive or
#     interactive-login backends (e.g. office365-web) you don't want spun up on
#     every launch.

tab:
  name: Calendar
  order: 8
  icon: "󰃰"

adapter:
  type: calendar
  config: calendar-adapter.yaml
  # Load only when you focus the tab and press `r` — this is the default, and
  # spelled out here because it is the interesting end of the choice above.
  # Set it to `on_open` or `startup` to load the calendar without the keypress.
  auto_connect: never

# Reminders (optional). The adapter decides *when* a reminder fires — a fixed
# lead time before each timed event's start (`reminder_lead_minutes` in the
# adapter config, default 5). This block decides whether this tab acts on those
# reminders at all and what runs when one fires. Omit it and the tab ignores
# reminders entirely.
#
# `command` runs through `sh -c`, detached, once per fired reminder. The event's
# fields arrive as environment variables — never spliced into the string, so an
# event title can't be interpreted as shell:
#   NYD_REMINDER_ID            stable event id
#   NYD_REMINDER_TITLE         event title
#   NYD_REMINDER_DETAIL        "Account · Location" (location omitted if absent)
#   NYD_REMINDER_WHEN          event start, local-time RFC3339
#   NYD_REMINDER_UNTIL         event end, local-time RFC3339 (empty if none)
#   NYD_REMINDER_LEAD_MINUTES  whole minutes until start when it fired
#
# The example below uses `herald`, a single top-edge Wayland banner: `--until`
# keeps it on screen until the event is over, and `--animation lava` gives it the
# lava-lamp backdrop. A plain desktop notification works just as well, e.g.:
#   command: >-
#     notify-send "$NYD_REMINDER_TITLE"
#     "in $NYD_REMINDER_LEAD_MINUTES min — $NYD_REMINDER_DETAIL"
reminder:
  enabled: true
  command: >-
    herald --animation lava --until "$NYD_REMINDER_UNTIL"
    --title "$NYD_REMINDER_TITLE" --detail "$NYD_REMINDER_DETAIL"

views:
  - name: events
    node_type: "calendar:event"
    default: true

    # Saved-query filter — same mechanism as the trackings tab. The body is a
    # `FilterExpr` evaluated in memory against each loaded event. `menu_key: q`
    # opens the query menu (list / apply / ctrl+e edit / ctrl+s bind a shortcut);
    # `editable: true` keeps the top-level `Q` binding to edit the active query
    # directly. Queries persist one file per name under the adapter's data dir
    # (`<data>/not_yet_done/calendar/<id>/queries/<name>.yaml`).
    #
    # Dates on start/end accept relative phrases ("today", "tomorrow",
    # "2 weeks", "next monday" — note NO "in" prefix), period boundaries
    # ("start of day", "end of week", "end of next week", "start of month",
    # "end of quarter", "end of year"), and ISO dates (2026-07-20).
    #
    # Examples (write via `Q` or `:query new`):
    #   query:
    #     [title, has, standup]              # title substring (case-insensitive)
    #   query:
    #     and:
    #       - [start, gte, "start of day"]
    #       - [start, lte, "end of next week"]
    #       - [show_as, =, busy]
    #
    # No `default:` here — the adapter's time window is the only baseline filter,
    # so the tab opens showing everything in the window. Add a `default:` block
    # (like trackings) to start time-boxed.
    #
    # `template:` (below) seeds the editor when you create a *new* query — it is
    # never applied as a live filter, so it may be entirely commented examples.
    # (`default`, by contrast, IS the active baseline filter.) The trailing
    # match-everything line is a harmless starting point you replace.
    query:
      editable: true
      menu_key: q
      template: |
        # Filter the loaded calendar events. Replace the query below, or
        # uncomment one of the examples. Columns: title/subject, start, end,
        # account/calendar, location, organizer, show_as/status, body, all_day.
        #
        # Dates on start/end accept:
        #   - relative:  today, tomorrow, "2 weeks", "3 days", "next monday"
        #                (note: NO "in" prefix — "2 weeks", not "in 2 weeks")
        #   - period boundaries: "start of day", "end of week", "end of next week",
        #                "start of month", "end of quarter", "end of year", …
        #   - ISO dates: 2026-07-20
        #
        #   query:
        #     [title, has, standup]            # title substring (case-insensitive)
        #
        #   query:
        #     and:
        #       - [start, gte, "start of day"]
        #       - [start, lte, "end of next week"]
        #       - [show_as, =, busy]
        #
        # The line below matches everything — replace it with your filter:
        query:
          [title, has, ""]

    # Day buckets, soonest first. (Flip to `desc` to put upcoming days on
    # top; there is no per-day aggregate here — events aren't durations to
    # sum, unlike timesheets.)
    group_by:
      column: start
      bucket: day
      order: asc

    columns:
      - key: start
        label: Start
        kind: datetime
        style: text_high
        sizing: max
      - key: end
        label: End
        kind: datetime
        style: secondary
        sizing: max
      # No value of its own: the table engine renders `start` − now and ticks
      # it live, so the next meeting counts down in place instead of going
      # stale between loads. An event that has already begun counts on with a
      # leading "-", which is the honest answer for a row that is happening.
      - key: starts_in
        label: In
        kind: countdown
        countdown_to: start
        style: tertiary
        sizing: "fixed(10)"
      - key: account
        label: Account
        style: tertiary
        sizing: "fixed(16)"
      - key: show_as
        label: Show as
        style: secondary
        sizing: "fixed(10)"
      - key: location
        label: Location
        style: secondary
        sizing: "fixed(20)"
      # Event creator/organizer. Populated for meetings that carry an ORGANIZER
      # (Teams/Outlook invites via the microsoft/office365-web backends); empty
      # for personal CalDAV events that have no organizer.
      - key: organizer
        label: Organizer
        style: secondary
        sizing: "fixed(18)"
      # Event title; falls back to "(no title)" for an untitled event.
      - key: title
        label: Title
        source: label
        style: text_med
        sizing: "flex(1)"

    # `p` opens a horizontal split showing the selected event's full detail
    # (Markdown: when/where/organizer + body) rendered from the node content.
    preview:
      enabled: true
      source: content
      split: horizontal
      ratio: 50
      keybinding: p

    # Bus event → action bindings (rule engine). When the office365-web backend
    # reaches a Microsoft Authenticator *number-match* challenge during a
    # sign-on, the browser run says what to do ("Tap 42 on your phone to sign
    # in") and the backend publishes that sentence as
    # `office365-web:mfa:number-match`. Bind it to the `show auth number` action
    # below so the sentence appears in the notification bar; the same action
    # auto-clears when the run is over (`office365-web:mfa:resolved`). No key
    # is pressed — this is a purely event-driven reaction. Only relevant for
    # the office365-web calendar backend; harmless for msgraph connections
    # (they never publish it).
    event_actions:
      - on: "office365-web:mfa:number-match"
        run: show auth number

    actions:
      # Event-only notify (no `key:`): fired by the `event_actions` binding
      # above. `{message}` is filled from the event payload. `on_event` retracts
      # the message once the sign-in resolves, scoped to the same connection so
      # one account's completion never clears another's prompt.
      - name: show auth number
        type: notify
        # `prominent: true` routes this to the loud top alert bar (theme
        # alert_fg/alert_bg) so the number can't be missed. Drop it (or set
        # `notifications.alert_enabled: false` in tui.yaml) to use the ordinary
        # bottom notification bar instead.
        prominent: true
        message: "Microsoft Authenticator: {message}"
        on_event:
          "office365-web:mfa:resolved": close
      # Local filter-while-typing over the loaded rows.
      # Create a calendar event (form popup → `execute("create", …)`). The
      # adapter advertises this action on the calendar root with a full
      # Title/Start/End/All-day/Show-as/Location/Notes form (plus a Calendar
      # picker when more than one connection is configured). `on_container:
      # true` dispatches it against the adapter root, so `a` works at the
      # un-drilled event list where there is no selected row. Start and end
      # take natural-language dates ("tomorrow 14:00"); for an all-day event
      # the end is the last day it covers, so a one-day event ends on the day
      # it starts.
      - name: create
        key: 'a a'
        type: custom
        id: create
        on_container: true
        # Per-action form styling. Overrides the generic form popup's classic
        # look (single column, no field bar, dropdown selects) for THIS action
        # only. Colours are NOT set here — they live in the theme's `form:`
        # block (`tui-theme.yaml`), which falls back to the base app theme. The
        # field bar is only visible once `form.field_bg` is set there.
        form:
          # 1 (default) or 2 columns. The event form is wide, so two columns.
          columns: 2
          # Explicit per-column field placement by field key (outer list =
          # columns left→right; unlisted keys stay in column 0 in spec order).
          # `account` only exists with >1 connection — listing it is harmless
          # when it is absent. Omit `column_assignment` to auto-balance.
          column_assignment:
            - [title, account, start, end, all_day]
            - [show_as, location, body]
          # Panel chrome (centred, borderless, content-sized) plus a filled
          # bar behind the focused field — needs theme `form.field_bg` to be
          # visible. This is the default; `false` opts back into the classic
          # bordered box that fills the whole popup area.
          field_bar: true
          # `inline` = radio list, every option visible (Show as / Calendar
          # render as inline radios); `dropdown` (default) = collapsed.
          select_style: inline
      # Show or hide the browser window behind a browser-driven connection
      # (`office365-web`): `execute("toggle_window")` flips every connection
      # that has one, so a stuck sign-in can be watched — and hidden again.
      # `on_container: true` dispatches it against the adapter root, like
      # `create` above.
      - name: toggle browser
        key: 'a h'
        type: custom
        id: toggle_window
        on_container: true
      # Fetch every connection now — the `fetch: on_demand` ones too — and
      # store the result; the status line reports each connection. The same
      # action serves a scheduler from the command line:
      #   nyd adapter calendar root sync --arg connections=work,mailde --arg timeout=120
      # (`connections` defaults to all, `timeout` — seconds per connection —
      # to 300). Any connection that did not sync makes it exit 1 — unless
      # every one that did not only waited for a sign-in nobody answered
      # (an authenticator number shown, then the timeout; a locked password
      # store's passphrase with no terminal to type it on): that exits 75,
      # "try again later", which a scheduler need not count as a failure.
      - name: sync now
        key: 'a s'
        type: custom
        id: sync
        on_container: true
      # Delete the event under the cursor at its source, after a confirm. An
      # occurrence of a series is deleted alone where the backend addresses
      # occurrences (Graph, Outlook on the web); CalDAV stores a series as
      # one resource, so there the whole series goes. Nobody is sent a
      # cancellation. An event the server no longer has (deleted elsewhere)
      # is removed from nyd all the same. From the command line:
      #   nyd adapter calendar <event id> delete --yes
      - { key: d, id: delete }
      # Edit the event under the cursor: the same form as `create`, filled with
      # the event's values. Only the fields you change are sent, so an
      # untouched Notes field keeps its formatting and a CalDAV event keeps
      # its time zone, attendees and alarms; an unchanged form sends nothing.
      # Graph edits one occurrence of a series alone. CalDAV stores a series
      # as one resource, so it refuses to edit a recurring event rather than
      # move every occurrence; it also refuses when the event changed on the
      # server since the last fetch — refresh and edit again. Outlook on the
      # web (`office365-web`) cannot edit yet. From the command line, only
      # the named fields change:
      #   nyd adapter calendar <event id> edit --field location="Room 2"
      - name: edit
        key: 'e e'
        id: edit
        form:
          columns: 2
          column_assignment:
            - [title, start, end, all_day]
            - [show_as, location, body]
          field_bar: true
          select_style: inline
      # Local filter-while-typing over the loaded rows.
      - name: fuzzy filter
        key: f
        type: fuzzy_filter
        fuzzy_filter:
          fields: [title, account, location]
      - name: refresh
        key: r
        type: reload
