# Example: systemd view configuration — the SYSTEM manager
#
# Place in: ~/.config/not_yet_done/views/systemd-system.yaml
#
# Two more lines are needed to reach it, and neither is in this file:
#
#   * `adapter.id: systemd-system` — an instance id is derived from the adapter
#     type when it is not given, and systemd.yaml already claims `systemd`. Two
#     files of the same type without an explicit id is a config error
#     ("duplicate adapter instance id"), not a silent second instance.
#   * `system` in `tabs.order` in tui.yaml — that list is an allowlist, not just
#     an order. A tab missing from it is loaded and keeps its keys, but it is
#     not shown and nothing switches to it.
#
# The companion of systemd.yaml, pointed at the other manager. Everything the
# tab can do and why is explained there; this file only says what is different
# here, because two managers hold two different sets of units and there is no
# view that shows both.
#
# Why a second file rather than a subtab: `adapter:` is declared per tab, so one
# tab is one adapter instance is one manager. Making one instance serve both
# would mean every node id carrying which manager it came from — `sshd.service`
# exists on both — and that reaches into the live watcher, the journal calls and
# the protection list. A second tab costs one tab key and nothing else.
#
# ---------------------------------------------------------------------------
# What this tab does, and where it stops
#
# Reading the system manager needs no privileges at all: listing its units, its
# journal (for a user in `systemd-journal` or `wheel`) and `systemd-analyze`
# work exactly as they do for the user manager.
#
# Writing is a polkit action, every time. The manager answers an unauthorised
# call with
#
#   Access denied as the requested operation requires interactive
#   authentication. However, interactive authentication has not been enabled
#   by the calling program.
#
# which is an invitation rather than a refusal, and the adapter accepts it: it
# marks its writes as willing to wait for a human, so polkit asks — usually
# once per session, since the policy for `manage-units` is `auth_admin_keep`.
# Answer the dialog and the verb runs; dismiss it and the tab says so in a
# plain sentence, because declining is an answer, not an error.
#
# So the **runtime** verbs are here and work: start, stop, restart, reload,
# kill, reset-failed, freeze. What they change lasts as long as the machine is
# up, and the same row shows you the result.
#
# The **unit-file** verbs are here too — enable, disable, their `--now` pair,
# and preset — and they carry a second question the user tab does not need. On
# the user manager, disabling something decides what your next login does. Here
# the same key decides what the machine does at its next boot, for every
# account on it. Only the adapter can say that sentence, because only the
# adapter knows which unit is meant: polkit's dialog knows only that something
# wants `manage-unit-files`. So the prompt is sharper here, and it comes first,
# before any password is asked for.
#
# Expect **two dialogs** for one file verb on a cold session, not one. Writing
# the symlinks is `manage-unit-files` and making the manager notice them is
# `reload-daemon` — separate polkit actions, each remembered separately. The
# reload could be skipped when the change list comes back empty, which would
# hide the second dialog most of the time; it is not, because an empty list has
# meant "the symlinks were already right, the manager's picture was not" often
# enough to make that a bad trade.
#
# **Masking is the exception**, and it is not withheld because it is dangerous.
# It is withheld because it is invisible: a masked unit shows `inactive` with
# no failure and no journal line, exactly like a unit nobody started, and the
# symlink to `/dev/null` that explains it is not in any runtime column. That is
# where hours go. `mask` and `unmask` therefore stay with `systemctl`, and the
# adapter enforces it rather than trusting this file — the CLI refuses them on
# this manager too, so a binding for `a m` here would simply be inert.
#
# Editing and creating unit files are still absent for the same reason as in
# phase 7 stage 1: a system unit file is not this tab's to write.
# ---------------------------------------------------------------------------

tab:
  name: system
  order: 14
  icon: "󰒓"

adapter:
  type: systemd
  config_inline: |
    # The system manager on the system bus — plain `systemctl`, no --user.
    manager: system
    timeout_secs: 10
    # Deadline for a write polkit is asking a human about, in seconds.
    # 0 = no deadline. Separate from `timeout_secs` and far larger, because
    # it bounds something else: ten seconds of silence on a local bus means a
    # fault, while a call waiting on a password dialog is silent on purpose.
    # Not unbounded either — a dialog nobody answers has to give the pane
    # back eventually.
    auth_timeout_secs: 300
    # The built-in protection list here is the *system* one: it covers
    # *.slice, *.scope, the dbus trio, systemd-journald.service and .socket,
    # systemd-logind.service, and the target chain sysinit → basic →
    # multi-user → graphical → default. sshd.service and
    # NetworkManager.service are deliberately not on it — they can cut a
    # remote session, but a tab that refuses what you came to do is a tab you
    # work around. `protect:` and `unprotect:` adjust it exactly as in
    # systemd.yaml.
  # Local and never logs in, so it loads at startup like the other local tabs.
  manual_connect: false

views:
  # ---------------------------------------------------------------- services
  - name: Services
    key: "t s"
    default: true
    node_type: "systemd:service"
    tree_label: name
    query:
      editable: true
      menu_key: q
      template: |
        # Filter the loaded services. Columns: name, description, load, active,
        # sub, enabled, since, pid, mem, mem_peak, tasks, cpu, startup,
        # restarts, needs_reload, dropins, fragment, exposure.
        #
        #   query:
        #     [active, =, failed]            # what is broken
        #     [fragment, like, "/etc/%"]     # what this machine was given
        #     [startup, gte, 1]              # what cost a second or more
        #     [mem, gt, 104857600]           # what holds over 100 MiB
        #
        # `[fragment, like, "/etc/%"]` is the system manager's version of "what
        # did I write myself": /usr/lib is the distribution's, /etc is the
        # administrator's.
        #
        # The line below matches everything — replace it with your filter:
        query:
          [name, has, ""]
    columns:
      - key: name
        label: Unit
        source: label
        style: text_high
        sizing: "flex(2)"
      - key: active
        label: Active
        sizing: "fixed(10)"
      - key: sub
        label: Sub
        style: secondary
        sizing: "fixed(10)"
      - key: enabled
        label: Enabled
        style: tertiary
        sizing: "fixed(9)"
      - key: cpu
        label: CPU
        kind: duration
        sizing: "fixed(9)"
      - key: mem
        label: Mem
        kind: bytes
        sizing: "fixed(11)"
      - key: mem_peak
        label: Peak
        kind: bytes
        sizing: "fixed(11)"
        hidden: true
      - key: tasks
        label: Tasks
        kind: number
        sizing: "fixed(6)"
      - key: restarts
        label: Restarts
        kind: number
        sizing: "fixed(8)"
      - key: startup
        label: Startup
        kind: duration
        format: precise
        sizing: "fixed(9)"
      - key: since
        label: Since
        kind: datetime
        style: secondary
        sizing: max
      - key: description
        label: Description
        style: secondary
        sizing: "flex(3)"
      - key: load
        label: Load
        sizing: "fixed(9)"
        hidden: true
      - key: pid
        label: PID
        kind: number
        sizing: "fixed(8)"
        hidden: true
      - key: dropins
        label: Drop-ins
        kind: number
        sizing: "fixed(9)"
        hidden: true
      - key: exposure
        label: Exposure
        kind: number
        sizing: "fixed(9)"
        hidden: true
      - key: fragment
        label: Fragment
        kind: path
        sizing: "flex(2)"
        hidden: true
    highlights:
      - when: { field: active, matches: '^failed$' }
        style: warning
    actions:
      - { name: refresh, key: r, type: reload }
      # The reading keys.
      - { name: properties, key: P, type: navigate, navigate_to: "systemd:property" }
      - { name: journal, key: J, type: navigate, navigate_to: "systemd:log" }
      - { name: ordering, key: D, type: navigate, navigate_to: "systemd:order" }
      - { name: security, key: H, type: navigate, navigate_to: "systemd:security" }
      # Following the journal opens a terminal and reads; no privilege in it.
      - { name: follow in a terminal, key: "a j", id: follow }
      # The runtime verbs. Every one of them is a polkit action on this bus,
      # so the first press of the session opens a password dialog and the ones
      # after it usually do not — `auth_admin_keep` remembers. Dismissing the
      # dialog is not an error: the tab says the write was not authorised and
      # nothing happened.
      #
      # The disruptive ones still ask their own question first, before polkit
      # sees anything. Two prompts for one stop is not one too many here: the
      # adapter's asks whether you meant *this unit* — only it knows what
      # depends on it — and polkit's asks whether you may touch the machine at
      # all. And `protect:` refuses some units outright rather than asking,
      # which no password can override.
      - { name: start, key: "a s", id: start }
      - { name: stop, key: "a x", id: stop }
      - { name: restart, key: "a r", id: restart }
      # `reload` asks the unit to re-read its config without dropping what it
      # is doing; `reload-or-restart` falls back to a restart when it cannot.
      - { name: reload, key: "a l", id: reload }
      - { name: reload or restart, key: "a L", id: reload-or-restart }
      # Clears the failed state so the unit can be started again — and so it
      # stops showing up in the Failed subtab.
      - { name: reset failed, key: "a f", id: reset-failed }
      # `a k` opens a menu rather than sending anything: picking SIGTERM or
      # SIGKILL out of a list is what takes the place of a y/n here.
      - { name: kill, key: "a k", id: kill }
      # Freeze suspends every process in the unit's cgroup without killing it;
      # pressing it again thaws.
      - { name: freeze or thaw, key: "a z", id: freeze }
      # The unit-file verbs. Each asks its own question first — a sharper one
      # than on the user tab, because here the answer holds for the next boot
      # and for everyone — and then polkit asks twice on a cold session: once
      # for the symlinks, once for the reload that makes them count.
      - { name: enable, key: "a e", id: enable }
      - { name: enable and start, key: "a E", id: enable-now }
      - { name: disable, key: "a d", id: disable }
      - { name: disable and stop, key: "a D", id: disable-now }
      # `a p` hands the decision to the distribution's preset policy; the
      # Preset column already says which way it will go.
      - { name: apply preset, key: "a p", id: preset }
      #
      # No `a m` / `a u`: masking is not offered on this manager — see the
      # header. No `e`-keys either; a system unit file is not this tab's to
      # write.
    children:
      - &properties
        name: Properties
        node_type: "systemd:property"
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the properties. Columns: name, value, interface.
            #
            #   query:
            #     [name, like, Timeout]        # every timeout at once
            #     [interface, =, Service]      # drop the generic Unit half
            #     [value, like, /etc]          # what points into the system config
            query:
              [name, has, ""]
        columns:
          - key: name
            label: Property
            source: label
            style: text_high
            sizing: "flex(2)"
          - key: value
            label: Value
            sizing: "flex(5)"
          - key: interface
            label: Interface
            style: tertiary
            sizing: "fixed(10)"
        actions:
          - { name: refresh, key: r, type: reload }
      - &journal
        name: Journal
        node_type: "systemd:log"
        pagination: { mode: server, page_size: 200 }
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the journal. Columns: time, level, prio, pid, message.
            #
            #   query:
            #     [prio, lte, 3]                 # errors and worse
            #     [message, has, timeout]        # what mentions a timeout
            #     [time, gte, "today"]           # since midnight
            #
            # This is the system journal, so it is also where the boot lives:
            # [time, gte, "today"] with [prio, lte, 3] is the short version of
            # "what went wrong since this machine came up".
            #
            # The line below matches everything — replace it with your filter:
            query:
              [message, has, ""]
        columns:
          - key: time
            label: Time
            kind: datetime
            sizing: "fixed(20)"
          - key: level
            label: Level
            sizing: "fixed(9)"
          - key: message
            label: Message
            source: label
            sizing: "flex(6)"
          - key: pid
            label: PID
            kind: number
            style: tertiary
            sizing: "fixed(8)"
            hidden: true
        highlights:
          - when: { field: prio, matches: '^[0-3]$' }
            style: warning
        actions:
          - { name: refresh, key: r, type: reload }
      - &security
        name: Security
        node_type: "systemd:security"
        # Readable here, and more interesting here: a system service runs as root
        # unless something stops it, so the checks that are academic for a user
        # unit are the whole question for this one. `e h` is absent — the drop-in
        # it writes would go under /etc, which is the privilege question again.
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the checks. Columns: check, status, exposure, description,
            # fix, id.
            #
            #   query:
            #     [status, =, exposed]           # what is still open
            #     [exposure, gte, 0.3]           # only the ones that cost most
            #     [check, has, Capability]       # one family of checks
            #
            # The line below matches everything — replace it with your filter:
            query:
              [check, has, ""]
        columns:
          - key: check
            label: Check
            source: label
            style: text_high
            sizing: "flex(2)"
          - key: status
            label: Status
            sizing: "fixed(10)"
          - key: exposure
            label: Exposure
            kind: number
            sizing: "fixed(9)"
          - key: description
            label: What it means
            style: secondary
            sizing: "flex(3)"
          - key: fix
            label: Fix
            sizing: "flex(3)"
          - key: id
            label: Id
            style: tertiary
            sizing: "flex(2)"
            hidden: true
        highlights:
          - when: { field: status, matches: '^exposed$' }
            style: warning
          - when: { field: status, matches: '^ok$' }
            style: success
          - when: { field: status, matches: '^no-effect$' }
            style: text_dim
        actions:
          - { name: refresh, key: r, type: reload }
      - &ordering
        name: Ordering
        node_type: "systemd:order"
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the ordering relations. Columns: name, relation.
            #
            #   query:
            #     [relation, =, After]
            #
            # The line below matches everything — replace it with your filter:
            query:
              [name, has, ""]
        columns:
          - key: name
            label: Unit
            source: label
            style: text_high
            sizing: "flex(3)"
          - key: relation
            label: Relation
            sizing: "fixed(10)"
        actions:
          - { name: refresh, key: r, type: reload }

  # ------------------------------------------------------------------ failed
  - name: Failed
    key: "t f"
    node_type: "systemd:service"
    tree_label: name
    query:
      editable: true
      menu_key: q
      template: |
        # The same level as Services, with a query on it. Nothing here is a
        # separate node type.
        query:
          [active, =, failed]
    columns:
      - key: name
        label: Unit
        source: label
        style: text_high
        sizing: "flex(2)"
      - key: sub
        label: Sub
        style: secondary
        sizing: "fixed(10)"
      - key: since
        label: Since
        kind: datetime
        style: secondary
        sizing: "fixed(20)"
      - key: description
        label: Description
        style: secondary
        sizing: "flex(3)"
      - key: fragment
        label: Fragment
        kind: path
        sizing: "flex(2)"
    actions:
      - { name: refresh, key: r, type: reload }
      - { name: journal, key: J, type: navigate, navigate_to: "systemd:log" }
      - { name: properties, key: P, type: navigate, navigate_to: "systemd:property" }
      # The runtime verbs, as on the Services subtab — see there for what the
      # two prompts are. `a f` is the one that matters most here: it clears the
      # failed state, which is what takes the row off this list.
      - { name: start, key: "a s", id: start }
      - { name: stop, key: "a x", id: stop }
      - { name: restart, key: "a r", id: restart }
      - { name: reset failed, key: "a f", id: reset-failed }
      - { name: kill, key: "a k", id: kill }
      - { name: freeze or thaw, key: "a z", id: freeze }
      # The unit-file verbs. Each asks its own question first — a sharper one
      # than on the user tab, because here the answer holds for the next boot
      # and for everyone — and then polkit asks twice on a cold session: once
      # for the symlinks, once for the reload that makes them count.
      - { name: enable, key: "a e", id: enable }
      - { name: enable and start, key: "a E", id: enable-now }
      - { name: disable, key: "a d", id: disable }
      - { name: disable and stop, key: "a D", id: disable-now }
      # `a p` hands the decision to the distribution's preset policy; the
      # Preset column already says which way it will go.
      - { name: apply preset, key: "a p", id: preset }
      #
      # No `a m` / `a u`: masking is not offered on this manager — see the
      # header. No `e`-keys either; a system unit file is not this tab's to
      # write.
    children:
      - *properties
      - *journal

  # ------------------------------------------------------------------ timers
  - name: Timers
    key: "t t"
    node_type: "systemd:timer"
    tree_label: name
    query:
      editable: true
      menu_key: q
      template: |
        # Filter the timers. Columns: name, description, load, active, sub,
        # enabled, next, left, last, triggers, fragment.
        #
        #   query:
        #     [left, lte, 3600]              # what fires within the hour
        #     [triggers, has, backup]        # what drives a given service
        #
        # The line below matches everything — replace it with your filter:
        query:
          [name, has, ""]
    columns:
      - key: name
        label: Unit
        source: label
        style: text_high
        sizing: "flex(2)"
      - key: active
        label: Active
        sizing: "fixed(10)"
      - key: enabled
        label: Enabled
        style: tertiary
        sizing: "fixed(9)"
      - key: next
        label: Next
        kind: datetime
        sizing: "fixed(20)"
      # Counts down on its own — see the note on `kind: countdown` in
      # systemd.yaml.
      - key: left
        label: Left
        kind: countdown
        sizing: "fixed(10)"
      - key: last
        label: Last
        kind: datetime
        style: secondary
        sizing: "fixed(20)"
      - key: triggers
        label: Triggers
        style: secondary
        sizing: "flex(2)"
      - key: description
        label: Description
        style: secondary
        sizing: "flex(3)"
      - key: fragment
        label: Fragment
        kind: path
        sizing: "flex(2)"
        hidden: true
    actions:
      - { name: refresh, key: r, type: reload }
      - { name: properties, key: P, type: navigate, navigate_to: "systemd:property" }
      - { name: journal, key: J, type: navigate, navigate_to: "systemd:log" }
      - { name: follow in a terminal, key: "a j", id: follow }
      # A timer has no processes, so no `reload`, `kill` or `freeze` — the
      # verbs it does carry work the same way as on the Services subtab.
      - { name: start, key: "a s", id: start }
      - { name: stop, key: "a x", id: stop }
      - { name: restart, key: "a r", id: restart }
      - { name: reset failed, key: "a f", id: reset-failed }
      # The unit-file verbs, as on the Services subtab. On a timer they are the
      # ones that matter: a timer that is enabled fires at the next boot
      # whether or not anyone is looking, which is exactly the decision the
      # sharper prompt here is about.
      - { name: enable, key: "a e", id: enable }
      - { name: enable and start, key: "a E", id: enable-now }
      - { name: disable, key: "a d", id: disable }
      - { name: disable and stop, key: "a D", id: disable-now }
      - { name: apply preset, key: "a p", id: preset }
    children:
      - *properties
      - *journal
      - *ordering

  # -------------------------------------------------------------- unit files
  - name: Unit files
    key: "t u"
    node_type: "systemd:unitfile"
    query:
      editable: true
      menu_key: q
      template: |
        # Filter the unit files on disk. Columns: name, state, preset, drift,
        # origin, shadows, path.
        #
        #   query:
        #     [drift, =, should-enable]      # what the preset wants switched on
        #     [shadows, has, /usr]           # what /etc hides from /usr/lib
        #     [origin, =, system]            # what this machine was given
        #
        # The line below matches everything — replace it with your filter:
        query:
          [name, has, ""]
    columns:
      - key: name
        label: Unit file
        source: label
        style: text_high
        sizing: "flex(2)"
      - key: state
        label: State
        sizing: "fixed(12)"
      - key: preset
        label: Preset
        style: tertiary
        sizing: "fixed(9)"
      - key: drift
        label: Drift
        sizing: "fixed(14)"
      - key: origin
        label: Origin
        style: tertiary
        sizing: "fixed(9)"
      - key: shadows
        label: Shadows
        kind: path
        sizing: "flex(2)"
        hidden: true
      - key: path
        label: Path
        kind: path
        sizing: "flex(3)"
    highlights:
      - when: { field: drift, matches: '^should-' }
        style: warning
    actions:
      - { name: refresh, key: r, type: reload }
      # No Properties here: a unit file the manager has never loaded has no
      # D-Bus object to read. The journal is reachable, because a journal is
      # read by unit name.
      - { name: journal, key: J, type: navigate, navigate_to: "systemd:log" }
      - { name: security, key: H, type: navigate, navigate_to: "systemd:security" }
      - { name: follow in a terminal, key: "a j", id: follow }
      # A unit file can be started by name whether or not the manager has it
      # loaded, so the three jobs are here.
      - { name: start, key: "a s", id: start }
      - { name: stop, key: "a x", id: stop }
      - { name: restart, key: "a r", id: restart }
      # And this is the level the file verbs exist for: a disabled unit has no
      # runtime state, so it appears on no other subtab. `a p` reads best next
      # to the Preset and Drift columns — they say what the policy wants and
      # how far this file is from it, and `a p` is the key that closes the gap.
      - { name: enable, key: "a e", id: enable }
      - { name: enable and start, key: "a E", id: enable-now }
      - { name: disable, key: "a d", id: disable }
      - { name: disable and stop, key: "a D", id: disable-now }
      - { name: apply preset, key: "a p", id: preset }
      # Still no `a m` / `a u`: the Shadows column would show you a mask, but
      # the subtab you would look at next would not — see the header.
    children:
      - *journal
      - *security
