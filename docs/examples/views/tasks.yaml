# Example: Tasks view configuration (adapterized Tasks tab — plan phase A1)
#
# Place in: ~/.config/not_yet_done/views/tasks.yaml
#
# Unlike every other adapter, the `tasks` adapter is *in-process*: it wraps
# the host application's own TaskService (no network, no adapter-config
# file). The `adapter.type: tasks` key resolves to the in-process
# TaskAdapterFactory the App registers at startup with a live handle to the
# core services.
#
# ## A1a scope (read path)
#
# The whole non-deleted forest loads once into an eager snapshot and drills
# lazily through a single recursive `task:item` branch. Columns are typed
# (M2): `priority` is a right-aligned number, `created` a localized
# datetime. Tree-aware search (`/`) walks the entire forest adapter-side
# and steps through hits with n/N.
#
# Mutations go through the generic action vocabulary:
#   * `e` edit / `a` add — open a markdown buffer (`---` frontmatter +
#     `## Description:` / `## Notes:`). `add` is a `type: create` on the
#     current container (root → top-level task; drilled-into task → child);
#     `edit` a `type: edit` on the selected task. The buffer's `tracking:`
#     flag starts/stops time tracking.
#   * `d` delete (recursive, with confirm) / `u` undelete (restores the
#     last deletion) — generic `shortcuts:` dispatched via `invoke_action`.
#   * `m` mark-move / `p` paste-move — reparent: mark a task, move onto the
#     target task (which becomes its new parent). Cycles are rejected.
#
# Still A1c: the tracking *marker column* and a dedicated start/stop key,
# saved queries (`task` scope), `FilterExpr` filtering, and scripts. Until
# the C1 cutover this file is illustrative: the bespoke native Tasks tab
# still ships; copying this file in stands up the adapter path *alongside*
# it for comparison.

tab:
  name: Tasks
  order: 1
  icon: "󰄬"

adapter:
  type: tasks

views:
  # The root view lists the forest's top-level tasks (`parent_id == None`).
  # `tree_label: description` turns it into a tree; the recursive `subtasks`
  # branch below expands each task's children inline at any depth. Every
  # level in the chain reuses the same tree_label key (`description`) — the
  # renderer pulls the active depth's column set for the indent+glyph+label
  # cell, so a mismatched key would blank rows at non-active depths.
  - name: tasks
    node_type: "task:item"
    default: true
    tree_label: description

    # Tree-label column first (carries the indent + glyph), typed columns
    # trail behind. `priority` (number) right-aligns; `created` (datetime)
    # renders localized — the adapter emits canonical strings (integer,
    # RFC 3339) and the engine formats per `kind`.
    columns:
      - key: description
        label: Task
        source: label
        style: text_high
        sizing: "flex(1)"
      - key: status
        label: Status
        sizing: max
      - key: priority
        label: Prio
        kind: number
        sizing: max
      - key: tags
        label: Tags
        style: accent
        sizing: max
      - key: created
        label: Created
        kind: datetime
        sizing: max

    actions:
      # Edit the selected task in a markdown buffer (adapter action `edit`).
      - name: edit
        key: e
        type: edit
        id: edit
      # Create a task under the current container — at the root that's a
      # top-level task; the buffer's `parent:` field can override.
      - name: add task
        key: a
        type: create
        id: add
      # Local filter-while-typing over the loaded rows.
      - name: fuzzy filter
        key: f
        type: fuzzy_filter
        fuzzy_filter:
          fields: [description, tags]
      # Tree-aware search: `/` opens a free-text input, the adapter matches
      # task descriptions across the whole forest, the tree expands to the
      # first hit, and n/N cycle the rest in tree-render order. Declared
      # once here at the tree root (the validator rejects re-declaring
      # search/fuzzy_filter on the recursive branch below).
      - name: tree find
        key: /
        type: tree_find
        tree_find:
          prompt: Search tasks
      - name: refresh
        key: r
        type: reload

    # Fire-and-forget actions dispatched through the adapter's
    # `invoke_action`. `delete` routes through the confirm-then-delete flow;
    # `undelete` restores the last deletion; `mark-move`/`paste-move`
    # reparent a task. Keys must not collide with any `actions:` key above.
    shortcuts:
      d: delete
      u: undelete
      m: mark-move
      p: paste-move

    children:
      # Recursive subtask branch — the same ChildDef serves every depth.
      # `recursive: true` makes it an implicit member of its own children,
      # so drilling a task expands its subtasks, theirs, and so on.
      - name: subtasks
        node_type: "task:item"
        tree_label: description
        recursive: true

        columns:
          - key: description
            label: Task
            source: label
            style: text_high
            sizing: "flex(1)"
          - key: status
            label: Status
            sizing: max
          - key: priority
            label: Prio
            kind: number
            sizing: max
          - key: tags
            label: Tags
            style: accent
            sizing: max
          - key: created
            label: Created
            kind: datetime
            sizing: max

        # Edit/add/delete/reparent work at every depth, so the recursive
        # branch repeats them. fuzzy_filter / tree_find are NOT repeated —
        # they're declared once at the tree root (validator rule).
        actions:
          - name: edit
            key: e
            type: edit
            id: edit
          - name: add subtask
            key: a
            type: create
            id: add
          - name: refresh
            key: r
            type: reload

        shortcuts:
          d: delete
          u: undelete
          m: mark-move
          p: paste-move
