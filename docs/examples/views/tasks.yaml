# Example: Tasks view configuration (adapterized Tasks tab — plan phase A1)
#
# Place in: ~/.config/not_yet_done/views/tasks.yaml
#
# Unlike every other adapter, the `tasks` adapter is *in-process*: it wraps
# the host application's own TaskService (no network, no adapter-config
# file). The `adapter.type: tasks` key resolves to the in-process
# TaskAdapterFactory the App registers at startup with a live handle to the
# core services.
#
# ## A1a scope (read path)
#
# The whole non-deleted forest loads once into an eager snapshot and drills
# lazily through a single recursive `task:item` branch. Columns are typed
# (M2): `priority` is a right-aligned number, the date columns render
# date-only (`format: "%Y-%m-%d"`). Tree-aware search (`/`) walks the entire
# forest adapter-side and steps through hits with n/N.
#
# ## Column parity with the native tab
#
# The columns below reproduce the native Tasks tab's default visible set and
# order 1:1 — St / Pri / Tr / T / Task / Created / Updated / Tracked / N.
# Each column's `style` maps onto the same theme color key the native table
# uses (`tabs/columns.rs`): `tertiary`/`accent`/`secondary`/`text_med`.
# `status` is emitted as the nerd-font glyph (not a text label); the tag
# split is `tag_symbols` (icons) + `tag_names` (text — hidden by default in
# native, so omitted here too); `notes` is the `📝` marker.
#
# The native `🔗` links column is intentionally absent: links live in the
# host's app-level link store, which the in-process CoreHandle does not yet
# expose to the adapter. (A generic `source: has_links` engine mechanism is
# the intended way to surface it; until then the column would render
# always-blank, so it is left out.)
#
# Mutations go through the generic action vocabulary:
#   * `e` edit — open the selected task in a markdown buffer (`---`
#     frontmatter + `## Description:` / `## Notes:`); a `type: edit`. The
#     buffer's `tracking:` flag starts/stops time tracking.
#   * `a` add / `A` add-sibling — both open the same markdown buffer; they
#     differ only in where the new task lands (native-tab parity):
#       - In the **tree** view `a` adds a *child* of the selected task
#         (`under_selection` → the adapter's `add` re-parents onto the
#         highlighted row). In the **flat list** `a` adds a *top-level*
#         task (the list has no hierarchy, so the container is the root).
#       - `A` adds a *sibling* of the selected task in both views: the
#         adapter's `add-sibling` resolves the parent to the selected
#         task's own (re-rooted) parent, so a top-level task gets another
#         top-level task and a child gets another child of the same parent.
#       - With **no selection** (empty tree) both fall back to a top-level
#         task: the engine resolves the absent parent to the adapter root,
#         which maps `add`/`add-sibling` to a top-level create.
#   * `d` delete (recursive, with confirm) / `u` undelete (restores the
#     last deletion) — generic `shortcuts:` dispatched via `invoke_action`.
#   * `s` toggle-tracking — start/stop time tracking for the selected task
#     in one key. The `tracking` column shows a `⏱` glyph on running rows.
#     Respects the host's exclusivity policy (`tracking.allow_parallel`).
#   * `m` mark-move / `p` paste-move — reparent: mark a task, move onto the
#     target task (which becomes its new parent). Cycles are rejected.
#   * `U` un-nest — move the selected task back to the top level. The
#     target-free inverse of mark/paste-move.
#
# ## Action / shortcut inheritance down the tree
#
# The recursive `subtasks` branch ships **no** `actions:` or `shortcuts:`
# of its own. Every entry the root view marks `inherit: true` (the action
# `inherit` flag; the `{ action: …, inherit: true }` shortcut form)
# cascades down each tree-continuation level — analogous to column
# inheritance — unless the child re-declares the same key (then the
# child's wins, per field). The single-level search family
# (`fuzzy_filter` / `tree_find`) is deliberately *not* marked inheritable:
# the validator restricts it to the tree root.
#
# ## A1c scope (saved queries + filtering)
#
# The `query:` block below turns the forest into a *filtered tree*: a saved
# query is a small YAML document (`name` + a `FilterExpr` `query` + optional
# `options`) that the adapter runs against the task service, then thins the
# forest to the matches **plus their ancestors** so deep hits stay reachable.
# The filter applies at every depth (capability `propagates_query_to_subtree`),
# so expanding a node only reveals children that match. Bodies live in the
# adapter's per-instance data dir (scope `tasks/<id>/<view>`); manage them
# with `:query new|edit|delete <name>` and the `q` menu.
#
# Scripts (`x` / `:script`) run against the selected task through the generic
# script menu — the task is handed over as the uniform `{"node": …}` JSON
# (see the `run script` action below). The node's `label` carries the task
# description; `fields.ancestors` is a JSON-array string of
# `{"id", "description"}` objects walking root→parent (exclusive of the task
# itself), so path-convention scripts (e.g. a jump-to-ticket script keyed on
# a `<project>/tickets/#<num>` layout) can reconstruct the forest position
# without the legacy `{"task": …}` payload.
#
# Until the C1 cutover this file is illustrative: the bespoke native Tasks
# tab still ships; copying this file in stands up the adapter path
# *alongside* it for comparison.

tab:
  name: Tasks
  order: 1
  icon: "󰄬"

adapter:
  type: tasks
  # In-process adapter: TaskAdapterFactory ignores this string. The generic
  # loader still requires *some* config to be present (config_inline or a
  # readable config: path) before it calls the factory, so a trivial inline
  # blob keeps this file copy-paste loadable.
  config_inline: "{}"

views:
  # The root view lists the forest's top-level tasks (`parent_id == None`).
  # `tree_label: description` turns it into a tree; the recursive `subtasks`
  # branch below expands each task's children inline at any depth. Every
  # level in the chain reuses the same tree_label key (`description`) — the
  # renderer pulls the active depth's column set for the indent+glyph+label
  # cell, so a mismatched key would blank rows at non-active depths.
  - name: tasks
    node_type: "task:item"
    default: true
    # Subtab key: `t` switches back here from the flat `list` view (`v`,
    # bottom of this file) — the generic counterpart of the native vt/vl
    # view toggle.
    key: t
    tree_label: description

    # Initial expansion depth (native parity:
    # `tasks.tree.default_expand_depth`). `2` auto-expands depths 0 and 1
    # once after the root list loads, so three levels are visible right
    # away. One-shot: after the cascade finishes, manual expand/collapse
    # is never overridden; a new saved query re-runs it on the filtered
    # tree. Each level loads through the normal expand path — cheap here
    # (in-memory forest), so a deeper value costs little on this tab.
    expand_depth: 2

    # Color of this tree's connector glyphs — the `├──`/`└──`/`│` box prefix
    # and the `▶`/`▼` expand arrows — drawn in the `tree_label` column. A theme
    # color name (`text_dim`, `tree_connector`, `accent`, …, same vocabulary as
    # a column `style`). Omit it to use the global theme `tree_connector` color.
    # Set per *tree* (here, on the root view — it covers every depth): the
    # connectors should read as quiet scaffolding behind the labels, but how
    # quiet depends on the view's palette, so each tree tunes it independently.
    tree_connector_style: text_dim

    # Saved-query filter. No `default` body is set, so — like the native tab
    # — the whole (non-deleted) forest is shown, including done tasks. Add a
    # `default:` block (a `name` + a `query` FilterExpr whose leaves are
    # `[lhs, op, rhs]`, plus optional `options`) to filter to a subset; the
    # tree then keeps each match's ancestors so nested hits stay visible.
    # `editable` lets `:query edit` rewrite a body; `menu_key: q` opens the
    # menu listing every saved query for this view (bodies under scope
    # `tasks/<id>/<view>`, shortcuts in the `query_shortcut` table).
    query:
      editable: true
      menu_key: q

    # Native column parity (see header). `status` is the status glyph,
    # `priority` a right-aligned number, the date columns render date-only,
    # `tag_symbols`/`notes` are markers, `description` carries the indent +
    # tree glyph. The adapter emits canonical strings (integer, RFC 3339);
    # the engine formats per `kind` + `format`.
    columns:
      - key: status
        label: St
        style: tertiary
        sizing: max
      - key: priority
        label: Pri
        kind: number
        style: tertiary
        sizing: max
      # Tracking marker: a `⏱` glyph on rows with a running tracking, blank
      # otherwise. The adapter supplies the canonical glyph; `t` toggles it.
      - key: tracking
        label: Tr
        style: accent
        sizing: max
        # When this row is a *collapsed* tree node, render the adapter's
        # roll-up field instead: `tracking_rollup` is `⏱` when this task OR
        # any descendant is tracked, so a running tracking hidden under a
        # collapsed parent still surfaces. Inert on expanded nodes, leaves,
        # and the flat list (they show their own `tracking`).
        collapsed_source: tracking_rollup
      # Tag symbols (icons only); `tag_names` ships hidden in native, omitted.
      - key: tag_symbols
        label: T
        style: accent
        sizing: max
      - key: description
        label: Task
        source: label
        style: text_med
        sizing: fit # only as wide as the task title needs, never crowds out the date columns
      - key: created
        label: Created
        kind: datetime
        format: "%Y-%m-%d"
        style: secondary
        sizing: max
      - key: updated
        label: Updated
        kind: datetime
        format: "%Y-%m-%d"
        style: secondary
        sizing: max
      - key: last_tracked
        label: Tracked
        kind: datetime
        format: "%Y-%m-%d"
        style: accent
        sizing: max
      # Notes marker: `📝` when a notes file exists for the task, blank else.
      - key: notes
        label: N
        style: tertiary
        sizing: max

    actions:
      # Edit the selected task in a markdown buffer (adapter action `edit`).
      # `inherit: true` — available at every subtask depth without the
      # recursive branch re-declaring it.
      - name: edit
        key: e
        type: edit
        id: edit
        inherit: true
      # Edit the selected task AND its whole subtree as one indented
      # checkbox outline (adapter action `edit-tree`): reparent, re-status,
      # add or remove rows in a single buffer; `tree_edit` diffs the result
      # and applies every create/move/delete. `ctrl+n` mirrors the native
      # tab's "edit node" key.
      - name: edit node
        key: ctrl+n
        type: edit
        id: edit-tree
        inherit: true
      # Add a task. In the tree view `under_selection: true` makes `a` add a
      # *child* of the selected task (the adapter's `add` re-parents onto the
      # highlighted row); with no selection it falls back to a top-level
      # task. The buffer's `parent:` field can still override.
      - name: add task
        key: a
        type: create
        id: add
        under_selection: true
        inherit: true
      # Run a script against the selected task. Opens the generic `:script`
      # fuzzy menu (also reachable via the `:script` cmdline). Scripts live
      # under `<data>/not_yet_done/scripts/tasks/task_item/` — one dir per
      # view path, shared across depths. The selected task is handed to the
      # script as JSON
      # (`{"node": {"id", "label", "node_type", "tab", "fields": {…}}}`,
      # where `label` is the task description and `fields` carries
      # status/priority/tracking/tag_symbols/tag_names/notes/created/
      # updated/last_tracked/id/ancestors — `ancestors` being a JSON-array
      # string of `{"id", "description"}` root→parent); the adapter path
      # uses the uniform node shape, not the bespoke
      # `{"task": …}` payload of the legacy native tab.
      - name: script
        key: x
        type: script
        inherit: true
      # Add a *sibling* of the selected task (adapter action `add-sibling`):
      # the new task's parent is the selected task's own (re-rooted) parent,
      # so a top-level task gets another top-level task. `under_selection`
      # targets the highlighted row; no selection falls back to a top-level
      # task. The editor buffer's `parent:` field still wins if edited.
      - name: add sibling
        key: A
        type: create
        id: add-sibling
        under_selection: true
        inherit: true
      # Local filter-while-typing over the loaded rows. NOT inheritable —
      # the validator restricts fuzzy_filter to the tree root.
      - name: fuzzy filter
        key: f
        type: fuzzy_filter
        fuzzy_filter:
          fields: [description, tag_names]
      # Tree-aware search: `/` opens a free-text input, the adapter matches
      # task descriptions across the whole forest, the tree expands to the
      # first hit, and n/N cycle the rest in tree-render order. Declared
      # once here at the tree root (the validator rejects re-declaring
      # search/fuzzy_filter on the recursive branch below).
      # NOT inheritable — the validator restricts tree_find to the tree root.
      - name: tree find
        key: /
        type: tree_find
        tree_find:
          prompt: Search tasks
      - name: refresh
        key: r
        type: reload
        inherit: true

    # Fire-and-forget actions dispatched through the adapter's
    # `invoke_action`. `delete` routes through the confirm-then-delete flow;
    # `undelete` restores the last deletion; `mark-move`/`paste-move`
    # reparent a task. Keys must not collide with any `actions:` key above.
    #
    # Each entry uses the `{ action: …, inherit: true }` form so it cascades
    # down the recursive subtask branch (which declares no shortcuts of its
    # own). A bare `key: action` would NOT be inherited.
    shortcuts:
      d: { action: delete, inherit: true }
      u: { action: undelete, inherit: true }
      s: { action: toggle-tracking, inherit: true }
      m: { action: mark-move, inherit: true }
      p: { action: paste-move, inherit: true }
      # Un-nest: move the selected task back to the top level (parent_id =
      # None). The comfort inverse of mark/paste-move — no target needed.
      # No-op (notification) when the task is already top-level.
      U: { action: unnest, inherit: true }

    children:
      # Recursive subtask branch — the same ChildDef serves every depth.
      # `recursive: true` makes it an implicit member of its own children,
      # so drilling a task expands its subtasks, theirs, and so on.
      - name: subtasks
        node_type: "task:item"
        tree_label: description
        recursive: true

        # No `columns:` here: a tree-continuation level (`tree_label` set)
        # that omits its columns inherits the tree root's set. All depths of
        # a tree render into one shared column grid, so re-declaring the
        # identical columns at every level only invites drift. Declare
        # `columns:` here only to deliberately diverge from the root.

        # No `actions:` or `shortcuts:` here either. Every entry the root
        # view marks `inherit: true` (edit / edit node / add / script /
        # add-sibling / refresh; d/u/s/m/p/U) cascades down to this branch
        # at load time. Re-declare a key here only to override it at depth.
        # fuzzy_filter / tree_find are intentionally absent — they're not
        # inheritable and the validator restricts them to the tree root.

  # Flat list view (native `vl` parity): every task in the forest as one
  # flat table, depth-first order — no hierarchy, no expand glyphs. `v`
  # switches here, `t` back to the tree. The adapter routes the synthetic
  # `task:flat` node_type to the flat projection; the rows themselves are
  # ordinary tasks, so edit/add/delete/track/move behave exactly like in
  # the tree view. A query filter shows only the matching tasks (no
  # ancestor fill-in like the tree view) — matching the native flat list's
  # filter semantics.
  - name: list
    node_type: "task:flat"
    key: v

    query:
      editable: true
      menu_key: q

    columns:
      - key: status
        label: St
        style: tertiary
        sizing: max
      - key: priority
        label: Pri
        kind: number
        style: tertiary
        sizing: max
      - key: tracking
        label: Tr
        style: accent
        sizing: max
        # Inert in the flat list (no collapse state); kept for parity with
        # the tree views so all three columns read identically.
        collapsed_source: tracking_rollup
      - key: tag_symbols
        label: T
        style: accent
        sizing: max
      - key: description
        label: Task
        source: label
        style: text_med
        sizing: fit
      - key: created
        label: Created
        kind: datetime
        format: "%Y-%m-%d"
        style: secondary
        sizing: max
      - key: updated
        label: Updated
        kind: datetime
        format: "%Y-%m-%d"
        style: secondary
        sizing: max
      - key: last_tracked
        label: Tracked
        kind: datetime
        format: "%Y-%m-%d"
        style: accent
        sizing: max
      - key: notes
        label: N
        style: tertiary
        sizing: max

    actions:
      - name: edit
        key: e
        type: edit
        id: edit
      # Subtree-restructure outline editor (see the tree view's `edit
      # node`). In the flat list it still edits the selected task and its
      # descendants as one outline — the rows are ordinary tasks.
      - name: edit node
        key: ctrl+n
        type: edit
        id: edit-tree
      # Flat list: no hierarchy, so `a` adds a *top-level* task (the
      # container is the root — no `under_selection`).
      - name: add task
        key: a
        type: create
        id: add
      # `A` adds a *sibling* of the selected task (same parent), exactly as
      # in the tree view — the rows are ordinary tasks with real parents.
      - name: add sibling
        key: A
        type: create
        id: add-sibling
        under_selection: true
      - name: script
        key: x
        type: script
      - name: fuzzy filter
        key: f
        type: fuzzy_filter
        fuzzy_filter:
          fields: [description, tag_names]
      # Flat view: plain field search (the tree-aware `tree_find` needs a
      # tree to expand into).
      - name: search
        key: /
        type: search
        search:
          fields: [description, tag_names]
      - name: refresh
        key: r
        type: reload

    shortcuts:
      d: delete
      u: undelete
      s: toggle-tracking
      m: mark-move
      p: paste-move
      U: unnest
