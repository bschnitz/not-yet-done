# Example: Mail (IMAP) view — one subtab per account
#
# Place in: ~/.config/not_yet_done/views/mail.yaml
# Adapter config: ~/.config/not_yet_done/views/mail-adapter.yaml (same folder)
#
# ONE mail instance holds MANY accounts (see mail-adapter.yaml), so all of
# them live in ONE tab and each account gets its own SUBTAB. What pins a
# subtab to an account is its level query:
#
#     node_type: "mail:folder"
#     query: { default: "account:work" }
#
# `account:<id>` names an `id:` from the adapter config; `folder:<path>` may
# additionally pin the subtab to one subtree. An instance holding a single
# account may omit the query — with several accounts the level refuses to
# guess and says which syntax it wants, because a swallowed scope looks
# exactly like a scope that matches everything.
#
# Alternative shape (not spelled out here): ONE subtab with
# `node_type: "mail:account"`, listing every account as a row and drilling
# into its folders. Same file, no query. Use it when the accounts should sit
# side by side rather than behind separate keys.
#
# Connecting is per account, not per instance: opening the Work subtab logs
# in Work and nothing else, and an account nobody looks at is never contacted.
# That is why `auto_connect:` below is a single decision for the whole tab
# without dragging every mailbox onto the network at once.
#
# Folder counts (`unread_count` / `total`) come from an IMAP `STATUS` call —
# one round trip PER FOLDER. They are therefore fetched for the folders of the
# level being shown, not for the whole tree; a `\Noselect` folder (a pure
# container, e.g. `Archive` above `Archive/2019`) has no counts at all and
# leaves the cells EMPTY rather than showing `0` — "cannot be counted" and
# "counted zero" are different answers.
#
# The count is `unread_count`, not `unread`, and that is not cosmetic: rows
# carry a separate `unread` field holding `"true"`, and THAT is the key the
# frontend paints `unread_style` / `unread_marker` from — here, in the tree
# and in the tab bar. A count column sitting on the same name would take it
# over and leave the highlight permanently dark.
#
# SCOPE: this file covers what the adapter implements today — the folder tree,
# the messages under a folder, reading a message and its attachments. Writing
# (marking read, flagging, moving, sending) is phase 5 and is not here.

tab:
  name: Mail
  order: 8
  icon: "󰇮"
  # While any folder in this view holds unread mail, the tab bar prefixes the
  # label with this marker and emphasises it — the only cue a *background*
  # mail tab can give. Both keys are optional (marker falls back to the view's
  # own `unread_marker` below, style to bold).
  unread_marker: "✉"

adapter:
  type: mail
  id: mail
  config: mail-adapter.yaml
  # `never` (the default) connects on your first `r`; `on_open` connects the
  # account of the subtab you switch to; `startup` connects before you ask —
  # note that an account whose password needs answering then raises its dialog
  # right away, over whatever tab you happen to be on. Which account the dialog
  # means is written into its header, because with several mailboxes behind one
  # instance "Password:" alone is not an answerable question.
  auto_connect: on_open

views:
  # ── One subtab per account ────────────────────────────────────────────────
  # The three ids below (`work`, `bridged`, `club`) are the ones the shipped
  # mail-adapter.yaml defines. Copy both files and the pair works as-is;
  # change an id in one and change it here too — a query naming an unknown
  # account is refused with the list of ids the instance actually holds.
  - name: Work
    # Every subtab key here is a `t` chord, and with `window_ops: true`
    # below that is no longer just tidiness: `w` is a leader in this tab
    # now, so a subtab on a bare `w` would swallow `w q` and its
    # siblings — and the validator says so rather than picking a winner.
    key: "t w"
    default: true
    node_type: "mail:folder"
    query: { default: "account:work" }
    # The folder hierarchy is a tree: `Archive` expands into `Archive/2019`
    # and so on, through the recursive `subfolders` branch below. Expanding
    # is FREE of round trips — the whole mailbox list arrives in one `LIST`
    # when the top level loads, and expansion reads that snapshot. `r`
    # re-lists.
    tree_label: name
    unread_style: unread
    unread_marker: "●"
    # The messages list opens as a pane beside the tree (see the
    # `split:` below), so the `w` leader has something to operate on:
    # `w q` closes the list, `w h` / `w l` move focus between the two.
    # Without this opt-in `w` stays an ordinary letter.
    window_ops: true
    columns:
      - { key: name, label: Folder, source: label, sizing: "flex(1)" }
      - { key: unread_count, label: Unread, kind: number, sizing: "fixed(7)" }
      - { key: total, label: Total, kind: number, sizing: "fixed(7)" }
      # The server-side path (`Archive/2019`, IMAP's own spelling) — what
      # `SELECT` uses and what `exclude_folders:` matches against. Off by
      # default because the name says it in nine cases out of ten; switch it
      # on via the column popup (`c c`) when two folders in different
      # subtrees share a name, or when an exclude pattern is not biting.
      - { key: path, label: Path, sizing: "flex(1)", hidden: true }
    actions:
      - { name: refresh, key: r, type: reload }
      # Enter on a folder that HAS subfolders expands it — that is what the
      # arrow in front of it promises — so the messages of such a folder need
      # a key of their own. On a folder with nothing below it Enter opens the
      # messages directly, and `m` does the same; one key that always works
      # beats a key that works most of the time.
      - { name: messages, key: m, type: navigate, navigate_to: "mail:message" }
      # Filters the folders already on screen by name. A plain local filter,
      # not an IMAP search: it needs no round trip and, in a lazily expanded
      # tree, it can only match what is expanded.
      - name: fuzzy filter
        key: f
        type: fuzzy_filter
        fuzzy_filter:
          fields: [name]
    # Auto-expanding costs one `STATUS` per folder brought on screen, so the
    # tree opens collapsed. Uncomment on a small mailbox where seeing every
    # subfolder at once is worth the extra round trips:
    #   expand_depth: 1
    children:
      # ── Messages under a folder ──────────────────────────────────────────
      # Listed before `subfolders` only so the YAML anchor is defined before
      # the aliases reuse it; the order of sibling children means nothing on
      # its own.
      #
      # One page costs a `UID SEARCH` for the matching set plus a `UID FETCH`
      # of exactly the window on screen — so a mailbox holding 40 000 mails
      # opens as fast as one holding 40. No body is read here: a row is the
      # envelope, and reading the mail itself is a separate fetch, made only
      # for the message the cursor is actually on.
      #
      # This level's QUERY is handed to the server verbatim as IMAP SEARCH
      # (`UNSEEN`, `FROM boss`, `SINCE 1-Sep-2026`, `TEXT invoice`) — unlike
      # the folder level, nothing is parsed out of it first. It does not need
      # to be: the account and the mailbox are already fixed by the folder
      # this level hangs under.
      - &messages
        name: messages
        node_type: "mail:message"
        # The folder tree stays on the left and the list opens beside it.
        # `coupled: true` makes that pane the tree's own: opening another
        # folder REPLACES the list instead of stacking a third pane, and
        # closing the tree takes the list with it.
        split: { direction: right, ratio: 0.65, coupled: true }
        # Backing out of the list CLOSES its pane instead of walking the
        # pane one level up the folder tree. Walking up is what a
        # standalone pane should do, but this pane is the tree's own list:
        # one level up turns it into a second folder list beside the tree,
        # and the next back descends from there. Closing gives the width
        # back to the tree, which is where "back" means something here.
        # `back: null` first: leaving it bound would mean two handlers on
        # one key, with the chain quietly winning. Dropped here, the
        # chain below is the only claim, and the validator agrees.
        keybindings:
          back: null
        action_chains:
          backspace: [window.close]
          h: [window.close]
        # `>` / `<` page through the mailbox ON THE SERVER — the next page is
        # another window of the same search, not a slice of something already
        # downloaded. Drop `page_size` to take the account's own `page_size:`
        # from mail-adapter.yaml.
        pagination: { mode: server, page_size: 50 }
        # Open on the first mail not yet read, anchored at the top so the
        # unread run reads downward from the cursor; with nothing unread it
        # falls back to the newest. Only *opening* applies it — a reload never
        # yanks the cursor away from where you scrolled.
        cursor_on_open: first_unread
        columns:
          # The flag glyphs, in a fixed order so the column does not jitter
          # from row to row: ● unread, ↩ answered, ★ flagged, ✎ draft,
          # 📎 carries an attachment.
          - { key: flags, label: "", sizing: "fixed(6)" }
          - { key: from, label: From, sizing: "flex(1)" }
          # `source: label` rather than the raw subject: a mail whose
          # `Subject:` header is empty would otherwise be a row you cannot
          # aim at, and the label carries the `(no subject)` stand-in.
          - { key: subject, label: Subject, source: label, sizing: "flex(2)" }
          # From the `Date:` header, falling back to the server's own
          # INTERNALDATE when the sender wrote something unparseable.
          - { key: date, label: Date, kind: datetime, sizing: "fixed(16)" }
          - {
              key: size,
              label: Size,
              kind: number,
              sizing: "fixed(9)",
              hidden: true,
            }
          - {
              key: attachments,
              label: Att,
              kind: number,
              sizing: "fixed(5)",
              hidden: true,
            }
          - { key: to, label: To, sizing: "flex(1)", hidden: true }
          - { key: account, label: Account, sizing: "fixed(10)", hidden: true }
        actions:
          - { name: refresh, key: r, type: reload }
        # Reading the mail. The pane shows a short header block (From / To /
        # Subject / Date, plus an `Attachments:` line when there are any) over
        # the text — `text/plain` when the mail has one, otherwise the HTML
        # part rendered down to text.
        #
        # `markdown: false` (the default, spelled out because it is a
        # decision): a mail is not markdown. Turning it on would reflow the
        # header block, eat `*asterisks*` out of ordinary prose and mangle the
        # `>` quoting that every reply is built from.
        #
        # The body is fetched with `BODY.PEEK[]`, so moving the cursor over a
        # mail does NOT mark it read — that stays a thing you do on purpose
        # (phase 5). The last few bodies are cached, so walking a thread and
        # coming back costs one fetch, not one per keystroke.
        preview:
          enabled: true
          source: content
          markdown: false
          keybinding: p
        # Sorting with `c s` reaches the PAGE, not the mailbox — the rows a
        # sort can compare are the ones already fetched, and the status line
        # says so. Unsorted, the newest mail is first: IMAP gives that away
        # for free, since UIDs rise with arrival.
        children:
          # ── Attachments of a message ────────────────────────────────────
          # This level is FREE. The `BODYSTRUCTURE` describing every part
          # arrives with the envelope the page already fetched, so drilling
          # into a mail costs no round trip at all — and the message row
          # reports `has_children` only when it really carries files, so
          # Enter drills in on those and does nothing on the rest.
          #
          # Only OPENING a file costs a fetch, and then only that part: a
          # 30 kB PDF out of a 20 MB mail is 30 kB over the wire.
          - name: attachments
            node_type: "mail:attachment"
            columns:
              - {
                  key: filename,
                  label: File,
                  source: label,
                  style: text_high,
                  sizing: "flex(1)",
                }
              - { key: content_type, label: Type, sizing: max }
              - { key: size, label: Size, kind: number, sizing: "fixed(10)" }
              # The IMAP section path (`2`, `3.1`). Rarely interesting, but
              # it is the whole address of the part — worth switching on with
              # `c c` when a file refuses to open.
              - { key: part, label: Part, sizing: "fixed(6)", hidden: true }
            actions:
              # Fetches the part once into a per-message temp dir and hands
              # the path to the frontend (xdg-open). All files of one mail
              # land in the same dir, so the viewer can page through them;
              # re-opening reuses the bytes already there.
              # On the `o` leader, not a bare `o`: a single letter here
              # swallows every global chord that starts with it, and `o`
              # is where the shortcut overview and menu commonly sit.
              - { name: open, key: "o o", type: custom, id: open }
              # Saves EVERY file of the mail into a directory the form asks
              # for (`~` is expanded, missing parents are created). A part
              # that fails is reported, not fatal — nine files out of ten
              # beats none.
              - { name: download all, key: D, type: custom, id: download_all }

      # The same ChildDef serves every depth (`recursive: true` makes it an
      # implicit member of its own `children:`), so a folder expands into its
      # subfolders, theirs, and so on. No `columns:` here — a tree
      # continuation inherits the root level's set, and all depths render into
      # one shared column grid anyway.
      - name: subfolders
        node_type: "mail:folder"
        tree_label: name
        recursive: true
        # A folder the server reports as having nothing below it. The adapter
        # fills `has_children` from the mailbox list, so leaves are known
        # rather than guessed.
        leaf_glyph: "📁"
        # A nested folder opens its messages exactly as a top-level one does
        # — the same level, aliased rather than copied.
        children:
          - *messages

  - name: Bridged
    key: "t b"
    node_type: "mail:folder"
    query: { default: "account:bridged" }
    tree_label: name
    unread_style: unread
    unread_marker: "●"
    window_ops: true
    columns:
      - { key: name, label: Folder, source: label, sizing: "flex(1)" }
      - { key: unread_count, label: Unread, kind: number, sizing: "fixed(7)" }
      - { key: total, label: Total, kind: number, sizing: "fixed(7)" }
      - { key: path, label: Path, sizing: "flex(1)", hidden: true }
    actions:
      - { name: refresh, key: r, type: reload }
      - { name: messages, key: m, type: navigate, navigate_to: "mail:message" }
    children:
      - *messages
      - name: subfolders
        node_type: "mail:folder"
        tree_label: name
        recursive: true
        leaf_glyph: "📁"
        children:
          - *messages

  # A subtab may pin a SUBTREE as well as an account: `folder:` takes the
  # server-side path, spaces and all, and only that folder and its children
  # are listed. Useful for a shared mailbox that lives below one account, or
  # for keeping a noisy archive out of the way of the everyday view.
  - name: Club archive
    # On the `t` leader like the others: a bare subtab key has to dodge
    # every leader chord of its own tab — `c` would collide with `c c`
    # (column config) and `c s` (sort menu) — and the validator refuses
    # the file rather than letting one of them win.
    key: "t a"
    node_type: "mail:folder"
    query: { default: "account:club folder:Archive" }
    tree_label: name
    columns:
      - { key: name, label: Folder, source: label, sizing: "flex(1)" }
      - { key: unread_count, label: Unread, kind: number, sizing: "fixed(7)" }
      - { key: total, label: Total, kind: number, sizing: "fixed(7)" }
    actions:
      - { name: refresh, key: r, type: reload }
      - { name: messages, key: m, type: navigate, navigate_to: "mail:message" }
    children:
      - *messages
      - name: subfolders
        node_type: "mail:folder"
        tree_label: name
        recursive: true
        leaf_glyph: "📁"
        children:
          - *messages
