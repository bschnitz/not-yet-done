# Example: Jira adapter credentials
#
# Place in: ~/.config/not_yet_done/views/jira-adapter.yaml
# Referenced by jira.yaml via: adapter.config: jira-adapter.yaml
#
# Authentication: use EITHER email+token (cloud) OR session_id (server).

url: https://jira.example.com

# Jira Cloud: API token auth
# email: you@example.com
# token: your-api-token

# Jira Server: session cookie auth (JSESSIONID + crowd tokens)
# session_id: "JSESSIONID=abc123; crowd.token_key=xyz"

# Glyph shown in the `bookmarked` marker column on the tickets list for a
# bookmarked issue (blank otherwise). Default ★. Any string works — a star,
# a Nerd-Font glyph, or an emoji. Note: emoji (e.g. ⭐) render two cells
# wide, which can shift column alignment; a single-cell glyph keeps the
# column width stable.
# bookmark_marker: "★"
