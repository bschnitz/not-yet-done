# Example: Jira adapter connection
#
# Place in: ~/.config/not_yet_done/views/jira-adapter.yaml
# Referenced by jira.yaml via: adapter.config: jira-adapter.yaml
#
# `nyd config auth jira` lists the mechanisms below with their fields and
# every provider; `nyd config build jira` asks and writes the block.

url: https://jira.example.com

# Optional display name for this instance (tab title, status line).
# name: Jira

auth:
  # Jira Server / Data Center behind SSO: send a ready-made `Cookie:`
  # header. The adapter never talks to a browser itself — a script hands
  # it the finished header line (see the `command` provider below).
  mechanism: cookie
  bindings:
    - field: cookie
      provider:
        # `command` runs a script and takes its trimmed stdout. The script
        # must write a single line in `Cookie:`-header form, e.g.
        # `JSESSIONID=...; crowd.token_key=...; atlassian.xsrf.token=...`.
        type: command
        script: /usr/local/bin/get-jira-cookie.sh
        timeout_secs: 60
        retries: 5

        # If the login needs input the script cannot get on its own — an
        # account to pick, a password, a one-time code — move the script up
        # to `auth.script` and bind the field with `script-result`. The
        # script is then run once per round: it answers with the values, or
        # with a form it wants asked first, and the answers come back to it
        # on stdin. The mechanism still declares just `cookie`; the
        # questions are the script's own. See the README ("Script-driven
        # credentials") for a full script.
        #
        # auth:
        #   mechanism: cookie
        #   script: /usr/local/bin/jira-sso-login.sh
        #   bindings:
        #     - field: cookie
        #       provider: { type: script-result }

# Jira Cloud, or a Server instance without SSO: HTTP Basic with an API
# token. Swap the block above for this one.
#
# auth:
#   mechanism: basic-auth
#   bindings:
#     - field: username
#       provider: { type: literal, value: you@example.com }
#     - field: token
#       provider:
#         type: command
#         script: pass show services/jira/api-token

# Self-signed / internal CAs: flip to true. Defaults to strict
# verification.
# accept_invalid_certs: false

# Optional override for the cache backing store. Sea-orm-compatible URL
# (sqlite:///path?mode=rwc, postgres://user:pw@host/db, ...). Falls back
# to a private SQLite file under the user's local data directory when
# omitted.
# db:
#   url: "sqlite:///home/me/.local/share/not_yet_done/jira-cache.sqlite?mode=rwc"

# Glyph shown in the `bookmarked` marker column on the tickets list for a
# bookmarked issue (blank otherwise). Default ★. Any string works — a star,
# a Nerd-Font glyph, or an emoji. Note: emoji (e.g. ⭐) render two cells
# wide, which can shift column alignment; a single-cell glyph keeps the
# column width stable.
# bookmark_marker: "★"

# Base directory for the persistent per-ticket workspace used by the
# `edit (markdown)` action (E) and the `export workspace` action. Each ticket
# gets its own folder `<base>/<KEY>-<slug>/` containing `ticket.md` plus an
# `attachments/` subfolder that is populated on demand (only missing files are
# fetched; a `.attachments.json` sidecar tracks what was downloaded). Image
# embeds in the Markdown resolve to these local files. A leading `~` is
# expanded. When unset, defaults to
# <data-local>/not_yet_done/jira/<instance>/tickets.
# ticket_workspace: "~/jira-tickets"

# Custom-field id backing the `story_points` column. Story Points is not a
# built-in Jira field: every instance carries it as a custom field with its
# own id, so the adapter looks it up by name in the instance's field
# catalogue (`Story Points` on Server/Data Center, `Story point estimate` on
# Cloud) and needs no configuration. Set this only when that lookup misses —
# on a localised instance, or where several fields share the name. Both
# spellings are accepted: `customfield_10006` or the bare `10006`.
# story_points_field: customfield_10006

# How a request that produced no answer at all is sent again — the connection
# refused, the handshake lost, the answer never arriving. Such a failure says
# nothing about the server a moment later, so the adapter repeats the call
# instead of handing the error straight to the user.
#
# `attempts` counts the first try; `1` switches repeating off. `backoff_ms` is
# the wait before the second attempt and doubles before each further one.
# Defaults: 2 attempts, 250 ms.
#
# Only calls without side effects are repeated after a *timeout*, because a
# timed-out request may well have arrived and run — repeating a transition or
# a comment there would do it twice. When the connection never came up, every
# call is repeated: nothing reached the server, so nothing can be doubled.
# retry:
#   attempts: 2
#   backoff_ms: 250
