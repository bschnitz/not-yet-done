      - { name: enable, key: "a e", id: enable }
      - { name: enable and start, key: "a E", id: enable-now }
      - { name: disable, key: "a d", id: disable }
      - { name: disable and stop, key: "a D", id: disable-now }
      # Masking points the unit at /dev/null, so nothing can start it —
      # not a dependency, not systemctl, not this tab. It is the one verb
      # whose effect outlives a reboot and is invisible in the running state,
      # which is why `unmask` sits right next to it.
      - { name: mask, key: "a m", id: mask }
      - { name: unmask, key: "a u", id: unmask }
