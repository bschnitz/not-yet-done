# Example: systemd view configuration
#
# Place in: ~/.config/not_yet_done/views/systemd.yaml
#
# One tab, one systemd manager, three levels side by side:
#
#   * Services   — the `.service` units the manager has loaded, with their
#                  runtime state (active/sub, main PID, memory, CPU, restarts).
#   * Timers     — the `.timer` units, with next/last elapse and the unit each
#                  one triggers.
#   * Unit files — the unit files on disk, loaded or not. This is the only
#                  level that can show a unit the manager has never touched.
#
# Which units a level shows is a *query*, not configuration: "what is failing"
# and "what did I write myself" change by the minute, and a setting you edit
# and restart is the wrong shape for a question that changes that often. The
# Failed subtab below is exactly that — the Services level with a default
# query, not a separate node type. See docs/plan-systemd-adapter.md (D2).
#
# Under a service and a timer sit two further levels:
#
#   * Properties — everything `systemctl show` prints, as a table that can be
#                  sorted and filtered. Not under a unit file: one the manager
#                  has never loaded has no D-Bus object behind it, so there is
#                  nothing to read.
#   * Journal    — the unit's own log lines, newest first. This one *is* under
#                  a unit file too: reading a journal needs a unit name, not a
#                  D-Bus object, and "this thing never starts" is a question
#                  asked about exactly the units the manager has not loaded.
#
# Acting on a unit lives on the `a` leader, editing its configuration on `e`,
# and writing a new one on `n` (see the Services subtab below).

tab:
  name: systemd
  order: 13
  icon: "󰒓"

adapter:
  type: systemd
  config_inline: |
    # `user` = the per-user manager on the session bus (systemctl --user),
    # `system` = the system manager. The two hold different units; there is
    # no view that shows both.
    manager: user
    # Deadline for a single D-Bus call, in seconds. 0 = no deadline. It
    # bounds the round trip, not the job: a start that takes a minute is a
    # job the adapter waits for separately (and reports as "still running"
    # rather than failed if it outlasts two minutes).
    timeout_secs: 10
    # Deadline for a write polkit may be asking a human about, in seconds.
    # 0 = no deadline. A separate budget from `timeout_secs`, and two orders
    # of magnitude larger, because it bounds something else: ten seconds of
    # silence on a local bus is evidence of a fault, but a call waiting on a
    # password dialog is silent on purpose. Only writes on the *system*
    # manager are ever authorised this way, so on `manager: user` this value
    # is never reached.
    auth_timeout_secs: 300
    # Units the disruptive verbs refuse to touch. There are two built-in
    # lists and `manager:` picks one — this is the `user` one; the `system`
    # one protects what holds up the machine instead (see
    # systemd-system.yaml). This list already covers the session plumbing —
    # *.slice, *.scope, dbus.socket,
    # dbus.service, dbus-broker.service, default.target, basic.target,
    # sockets.target,
    # timers.target, paths.target, graphical-session.target,
    # graphical-session-pre.target — so both keys below are for adjusting it.
    #
    # It exists because a confirmation prompt is no guard here: `y` is the
    # same muscle memory as the key that opened the prompt, and the mistake
    # it would catch is the one that takes the desktop down with it. A
    # protected unit still accepts start, enable and the other additive
    # verbs; only stop, restart, mask and their like are refused.
    #
    # `protect:` adds your own. Anything you would not want to lose mid-work:
    #   protect:
    #     - ssh-agent.service
    #     - "*.socket"
    #
    # `unprotect:` lifts one entry, spelled exactly as it appears on the list
    # above. An entry that matches nothing is refused when this file loads —
    # otherwise a typo would look like it worked while the protection quietly
    # stayed in place.
    #   unprotect:
    #     - "*.slice"
  # Local and never logs in, so it loads at startup like the other local tabs.
  manual_connect: false

# What is broken, said once, without anyone going to look.
#
# `connected` fires right after the adapter is built — for the TUI that is
# every launch — and `report-failed` answers the one question about the machine
# rather than about a row: which loaded units, of any type, are in a failed
# state. The answer lands in the notification centre (f10), so a failed mount
# or a service that died overnight is on screen before the tab is ever opened.
#
# It is silent when nothing has failed, which is why it carries no throttle: a
# report that only exists when there is something to report is not noise, and a
# throttle would make the launch *after* a failure the quiet one.
#
# The cost is one `ListUnits` round trip per launch — the manager already
# carries every unit's active state in that one reply, so nothing is polled per
# unit. That does mean the bus is touched at startup even if the tab is never
# opened; drop this block if that is not the trade you want.
hooks:
  connected:
    - run: report-failed

views:
  # ---------------------------------------------------------------- services
  - name: Services
    key: "t s"
    default: true
    node_type: "systemd:service"
    # Every row can unfold into what it needs — see the `dependencies`
    # child below. A tree continuation only continues from a tree-active
    # parent, so this level has to be a tree level itself; `name` is the
    # column the indent and the expand marker are drawn into.
    tree_label: name

    # Saved-query filter — the same mechanism the trackings and calendar tabs
    # use. The body is a `FilterExpr` evaluated against each loaded row.
    # Columns on this level: name, description, load, active, sub, enabled,
    # since, pid, mem, mem_peak, tasks, cpu, startup, restarts, needs_reload,
    # dropins, fragment, exposure.
    query:
      editable: true
      menu_key: q
      template: |
        # Filter the loaded services. Columns: name, description, load, active,
        # sub, enabled, since, pid, mem, mem_peak, tasks, cpu, startup,
        # restarts, needs_reload, dropins, fragment, exposure.
        #
        #   query:
        #     [active, =, failed]              # what is broken right now
        #
        #   query:
        #     [restarts, gt, 0]                # crash loops (Restart=always)
        #
        #   query:
        #     [fragment, like, '%/.config/systemd/%']   # units I wrote myself
        #
        #   query:
        #     [needs_reload, =, true]          # the file on disk moved on
        #
        #   query:
        #     [dropins, gt, 0]                 # something amends these
        #
        #   query:
        #     and:
        #       - [active, =, active]
        #       - [mem, gt, 104857600]         # over 100 MiB — bytes, not text
        #
        #   query:
        #     [startup, gt, 1]                 # took over a second to start
        #
        #   query:
        #     [startup, gte, 0]                # only units that have run
        #
        # `startup` is in **seconds**, fractions included, so `0.1` is 100 ms.
        # The second query above is the one to pair with sorting by Startup:
        # a unit that never started has no span at all, and an absent value
        # sorts to the end ascending — which puts it first when the sort is
        # descending, ahead of the slow units the sort was for. `[startup,
        # gte, 0]` drops exactly those rows and leaves the ones that ran.
        #
        # `since` takes natural-language dates: [since, gte, "today"].
        #
        # The line below matches everything — replace it with your filter:
        query:
          [name, has, ""]

    columns:
      - key: name
        label: Unit
        source: label
        style: text_high
        sizing: "flex(2)"
      - key: active
        label: Active
        sizing: "fixed(10)"
      - key: sub
        label: Sub
        style: secondary
        sizing: "fixed(10)"
      - key: enabled
        label: Enabled
        style: tertiary
        sizing: "fixed(9)"
      # Whole seconds of CPU time. `kind: duration` is what makes it read as
      # 1h 12m rather than 4320.
      - key: cpu
        label: CPU
        kind: duration
        sizing: "fixed(9)"
      # The adapter sends the raw byte count — a pre-formatted "95.4 MiB"
      # sorts as text and cannot be compared in a query — and `kind: bytes`
      # renders it on the binary scale. `[mem, gt, 104857600]` still means
      # what it says.
      - key: mem
        label: Mem
        kind: bytes
        sizing: "fixed(11)"
      # The high-water mark of the column above — what the service cost when
      # it cost the most. The number that explains an OOM kill, or that tells
      # you what to set MemoryMax= to. Hidden by default and switched on with
      # `c c`: it is the same question as Mem asked about the past, and this
      # row has enough columns already.
      #
      # Blank where the unit has no memory accounting; systemd turns that on
      # per unit, and a blank cell says so rather than claiming zero.
      - key: mem_peak
        label: Peak
        kind: bytes
        sizing: "fixed(11)"
        hidden: true
      - key: tasks
        label: Tasks
        kind: number
        sizing: "fixed(6)"
      - key: restarts
        label: Restarts
        kind: number
        sizing: "fixed(8)"
      # How long the unit's last activation took — the number
      # `systemd-analyze blame` prints, without the detour through it. The
      # adapter reads it off the unit's own timestamps, which arrive with the
      # rest of the row, so the column costs no extra call; sorting the list
      # by it *is* the blame report, and it stays a live list with every
      # other column still on it.
      #
      # `format: precise` is what makes it legible. The default rendering of
      # a duration is a clock face (`1:30:00`), which is right for a tracked
      # time and useless here: these spans live below the second, and every
      # row would read `00`. Precise names the unit the value actually has —
      # `5.24s`, `103ms`, `31us` — and still sorts and filters as seconds.
      #
      # Blank means the unit never started. `0` means it started instantly,
      # which is not the same thing and is the honest answer for a
      # `Type=simple` unit: systemd counts it active the moment it execs.
      - key: startup
        label: Startup
        kind: duration
        format: precise
        sizing: "fixed(9)"
      - key: since
        label: Since
        kind: datetime
        style: secondary
        sizing: max
      - key: description
        label: Description
        style: secondary
        sizing: "flex(3)"
      - key: load
        label: Load
        sizing: "fixed(9)"
        hidden: true
      - key: pid
        label: PID
        kind: number
        sizing: "fixed(8)"
        hidden: true
      - key: needs_reload
        label: Reload?
        sizing: "fixed(8)"
        hidden: true
      # How many drop-ins amend this unit. Blank rather than `0` where
      # nothing does, which is most units — so it is off by default and
      # switched on with `c c` when the question comes up. The count is
      # what sorts and filters (`[dropins, gt, 0]`); the paths themselves
      # are on the Properties level as `DropInPaths`.
      - key: dropins
        label: Drop-ins
        kind: number
        sizing: "fixed(9)"
        hidden: true
      # What `systemd-analyze security` makes of the unit as a whole: 0 is a
      # unit that can reach nothing, 10 one that can reach everything. Hidden
      # by default and switched on with `c c`, because it answers a question
      # about the *list* ("which of my own units are wide open?") rather than
      # one about the row — on a stock system almost every row says 9.4.
      #
      # It costs one call for the whole listing rather than one per row:
      # `systemd-analyze --user security` scores every loaded service in a
      # single run. That is also its limit — only *loaded* services have a
      # score — which is why the Unit files subtab carries no such column, and
      # why the Security level below is the way to score a unit the manager
      # has never touched.
      - key: exposure
        label: Exposure
        kind: number
        sizing: "fixed(9)"
        hidden: true
      - key: fragment
        label: Fragment
        kind: path
        sizing: "flex(2)"
        hidden: true

    actions:
      - { name: refresh, key: r, type: reload }
    # Acting on the unit under the cursor. `a` is the project-wide action
    # leader; nothing else in this tab claims it, so the whole verb set fits
    # on one level of chord. Related letters sit together: the running verbs
    # (start/stop/restart/reload) on `s x r l`, the boot-time ones
    # (enable/disable/mask/unmask) on `e d m u`, and a capital means "and
    # now" — `a E` enables *and* starts, `a D` disables *and* stops.
    #
    # Which of these a level actually offers is the adapter's decision, not
    # this file's: a verb declares the scope it works in, and a binding for a
    # verb the level does not serve is simply inert. Timers have no processes
    # and so have no `reload`, `kill` or `freeze`; a unit file is not loaded
    # and so has no `reset-failed`.
    #
    # The disruptive ones ask before they act, and the adapter writes the
    # question — only it knows that stopping a unit stops whatever depends on
    # it. Protected units (see `protect:` in the adapter config) refuse the
    # disruptive verbs outright rather than asking: a prompt answers "did you
    # mean it", which is no answer to "this would take the session down".
      - { name: start, key: "a s", id: start }
      - { name: stop, key: "a x", id: stop }
      - { name: restart, key: "a r", id: restart }
      # `reload` asks the unit to re-read its config without dropping what it
      # is doing; `reload-or-restart` falls back to a restart when the unit
      # cannot. Only services — a timer has nothing to re-read.
      - { name: reload, key: "a l", id: reload }
      - { name: reload or restart, key: "a L", id: reload-or-restart }
      # The [Install] side: what happens at the next login, not now.
      - { name: enable, key: "a e", id: enable }
      - { name: enable and start, key: "a E", id: enable-now }
      - { name: disable, key: "a d", id: disable }
      - { name: disable and stop, key: "a D", id: disable-now }
      # Masking points the unit at /dev/null, so nothing can start it —
      # not a dependency, not systemctl, not this tab. It is the one verb
      # whose effect outlives a reboot and is invisible in the running state,
      # which is why `unmask` sits right next to it.
      - { name: mask, key: "a m", id: mask }
      - { name: unmask, key: "a u", id: unmask }
      # What the distribution meant this unit to be. `a p` enables or
      # disables it to match the preset policy — the Preset column on the
      # Unit files subtab is where you can see which way it will go.
      - { name: apply preset, key: "a p", id: preset }
      # Editing the unit's configuration. `e` is the editor leader everywhere
      # else in the app and it means the same here: a buffer opens, you save
      # it, the adapter writes the file.
      #
      # `e e` is what `systemctl edit` does — a *drop-in* at
      # ~/.config/systemd/user/<unit>.d/override.conf, layered on top of the
      # file the distribution ships. The vendor unit keeps receiving package
      # updates, and `systemctl --user revert <unit>` takes the change back
      # out in one word.
      #
      # A drop-in is read *in addition to* the unit file, so a directive that
      # takes a list — ExecStart=, ExecStartPre=, Environment=, After= — ADDS
      # an entry rather than replacing one. Replacing means clearing the list
      # first: `ExecStart=` on a line of its own, then the new value. The
      # buffer says so at the top, every time, because a second ExecStart= is
      # refused by systemd and the message does not mention drop-ins.
      #
      # `e f` edits the whole file instead, copying the vendor one into
      # ~/.config/systemd/user on first use. It shadows the vendor unit
      # completely — which also means it stops following its updates. If the
      # unit already loads from a file in that tree, `e e` edits that same
      # file: there is nothing underneath left to preserve, and a drop-in
      # would only split one unit across two files.
      #
      # Nothing is written before `systemd-analyze verify` has seen the text
      # in a staging directory. A unit systemd would refuse never reaches
      # ~/.config at all; one it merely complains about is written, and the
      # complaint is in the notification — a directive that silently never
      # took effect is how an edit goes unnoticed for weeks. The previous
      # version is kept under
      # ~/.local/share/not_yet_done/systemd-backups/<unit>/ (the last ten),
      # outside the systemd tree on purpose: every *.conf next to a drop-in is
      # configuration systemd would read, so a backup filed beside the file
      # would be safe by naming convention only.
      #
      # After the write the manager re-reads the file, which changes nothing
      # about what is already running. If the unit is up, a picker asks what
      # to do about that — restart, reload-or-restart, or nothing for now; if
      # it is not, there is no question to ask and none is asked. Protected
      # units (see `protect:` above) refuse the editor too: the unit file
      # decides what the unit comes back as.
      - { name: edit drop-in, key: "e e", type: edit, id: edit }
      - { name: edit whole unit file, key: "e f", type: edit, id: edit-full }
      # Clears the failed state so the unit can be started again — and so it
      # stops showing up in the Failed subtab. Changes nothing about what is
      # running.
      - { name: reset failed, key: "a f", id: reset-failed }
      # Signals. `a k` opens a menu rather than sending anything: the
      # deliberate act of picking SIGTERM or SIGKILL out of a list is what
      # takes the place of a y/n here.
      - { name: kill, key: "a k", id: kill }
      # Freeze suspends every process in the unit's cgroup without killing
      # it; pressing it again thaws. One key for both directions, because the
      # adapter can see which state the unit is in and you cannot mis-aim it.
      - { name: freeze or thaw, key: "a z", id: freeze }
      # Everything the manager knows about this unit, as a table — what
      # `systemctl show` prints, only sortable and filterable.
      - { name: properties, key: p, type: navigate, navigate_to: "systemd:property" }
      # The unit's own journal, as a level: `journalctl --unit=<unit>` in a
      # table that sorts and filters like every other level here. `J` and not
      # `j` because `j` is the cursor moving down — a level key has to be one
      # nothing else has already claimed.
      #
      # `a j` opens the same journal *following* in a terminal of its own.
      # That is the one thing a table cannot do: a level shows what the
      # journal held when it was read, and watching a unit start means
      # watching lines arrive. Which terminal is the adapter's `terminal:`
      # setting (see the config block at the top of this file) — emulators
      # disagree about whether the command comes after `-e`, after `--`, or
      # bare, so it is a command line and not a program name.
      - { name: journal, key: J, type: navigate, navigate_to: "systemd:log" }
      # `After=` / `Before=` for this unit, as their own level. `enter`
      # is taken: on a unit row it unfolds the dependency TREE (see
      # `children:` below), which answers what this unit needs rather than
      # what it is sequenced against.
      - { name: ordering, key: D, type: navigate, navigate_to: "systemd:order" }
      # What `systemd-analyze security` finds in this unit, one check per row
      # — see the `Security` child below. `H` for hardening, and not the `S`
      # the name asks for: capital S is the app-wide sort-mode key, and a
      # level key has to be one nothing else has claimed. Which is not a
      # thing to find out by pressing it — a colliding binding fails the
      # config with both claimants named.
      - { name: security, key: H, type: navigate, navigate_to: "systemd:security" }
      # What the start of the unit under the cursor actually waited for,
      # one hop per row — see the `Chain` child below. `C` for chain; the
      # lowercase `c` is the column leader and not available.
      - { name: chain, key: C, type: navigate, navigate_to: "systemd:chain" }
      - { name: follow in a terminal, key: "a j", id: follow }
      # Creating a unit. `n` is the leader for making something that is not
      # there yet. It acts on the manager, not on the row under the cursor, so
      # the same three keys work from whichever of these levels you happen to
      # be standing on.
      #
      # `n s` writes one `.service` from a short form: a name, the command,
      # the service type, optionally a working directory and a restart policy.
      # `n t` writes a *pair* — a `.timer` and the `.service` it triggers —
      # because a timer on its own triggers nothing; one name covers both
      # files. Leave the command empty and only the `.timer` is written, for
      # the case where the service already exists.
      #
      # The schedule field takes what you would say out loud. "every day at
      # 9", "weekdays 9:00", "*:0/15" are stripped of their filler words and
      # handed to `systemd-analyze calendar`, and systemd's own normalised
      # form is what lands in the file. This tab does not invent a second
      # calendar grammar; it only clears the way to systemd's, which is why a
      # phrase it cannot make sense of is systemd's "Failed to parse" and not
      # a message of our own. Such a form stays open with what you typed and
      # the reason underneath, so a typo costs one correction instead of the
      # whole form. An accepted one reports the next three times it will fire
      # — the only way to notice that `*-*-01 9:00` is monthly and not daily.
      #
      # Tick `once` and the same field is read as a point in time instead —
      # "tomorrow 9:00", "next monday 14:00" — and written as that one date.
      #
      # `n f` skips the forms: an empty unit file opens in `$EDITOR` with the
      # three usual sections. It has no name yet, so the buffer names itself —
      # the `# unit:` line in the header above the cut line is the filename,
      # and a buffer that still says `name-me.service` comes back unwritten
      # rather than landing under a guessed name.
      #
      # Nothing is written before `systemd-analyze verify` has seen it, and
      # never over a file that already exists — an existing unit is something
      # to edit (`e e` / `e f`), not to overwrite. A pair is written only if
      # both halves verify, so a rejected timer leaves no orphaned service
      # behind. Afterwards the manager re-reads its files once, and the
      # `enable` field decides whether the new unit also starts now.
      #
      # One caveat about the leader: while a search is live with hits, `n`
      # belongs to "next match" — press Esc first.
      - { name: new service, key: "n s", type: custom, id: new-service, on_container: true }
      - { name: new timer, key: "n t", type: custom, id: new-timer, on_container: true }
      - { name: new unit file, key: "n f", type: create, id: new-file }

    children:
      # `systemctl show` is two hundred `Key=value` lines and a terminal can
      # only scroll them. The same content as a level is sortable and
      # filterable with everything the tab already has: `[name, has, Timeout]`
      # answers in one keystroke what grepping a wall of text answers in three.
      #
      # Both interfaces at once: the generic `Unit` one (ActiveState,
      # LoadState, the dependency lists) and the unit's own. The `interface`
      # column says which a row came from.
      #
      # Only under a *loaded* unit. A unit file the manager has never touched
      # has no D-Bus object behind it, so there is nothing to read — which is
      # why the Unit files level below has no such child.
      - name: Properties
        node_type: "systemd:property"
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the properties. Columns: name, value, interface.
            #
            #   query:
            #     [name, has, Timeout]         # every timeout at once
            #     [interface, =, Service]      # drop the generic Unit half
            #     [value, has, /home]          # what points into my home
            query:
              [name, has, ""]
        columns:
          - key: name
            label: Property
            source: label
            style: text_high
            sizing: "flex(2)"
          - key: value
            label: Value
            sizing: "flex(5)"
          - key: interface
            label: Interface
            style: tertiary
            sizing: "fixed(10)"
        actions:
          - { name: refresh, key: r, type: reload }
      # `journalctl --unit=<unit>`, as rows. A pager can scroll a journal and
      # nothing else; a level can sort it, filter it by severity or by time,
      # and sit beside the unit it belongs to.
      #
      # journalctl is the only way in: the journal has no D-Bus interface, so
      # this level shells out to `journalctl --output=json` and decodes what
      # comes back. Which also means the entries are the raw ones — a
      # `MESSAGE` that is not plain text arrives as an array of bytes, and
      # every line a Rust program colours arrives full of escape sequences.
      # Both are decoded on the way in, so what a cell holds is text.
      #
      # Under a unit file too, unlike Properties: a journal is read by unit
      # *name*, and a unit the manager never loaded is precisely the one whose
      # log you want.
      - name: Journal
        node_type: "systemd:log"
        # Newest first, and `>` / `<` walk older / newer in windows of this
        # size. A journal has no end to load towards, so "all rows" is not an
        # option the way it is for a list of units.
        pagination: { mode: server, page_size: 200 }
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the journal. Columns: time, level, prio, pid, message.
            #
            #   query:
            #     [prio, lte, 3]                 # errors and worse
            #     [message, has, timeout]        # what mentions a timeout
            #     [time, gte, "today"]           # since midnight
            #
            #   query:
            #     and:
            #       - [prio, lte, 4]
            #       - [time, gte, "yesterday"]
            #
            # `[level, =, err]` and `[prio, =, 3]` select the same rows —
            # `prio` is the number, `level` the word for it. What journalctl
            # can answer itself the adapter hands to it: a severity bound and
            # a time bound narrow what is *read*. Everything else is matched
            # here, on the decoded line, which is why `message` is never
            # pushed down — the bytes on disk still carry the colour escapes
            # that the cell no longer does.
            #
            # The line below matches everything — replace it with your filter:
            query:
              [message, has, ""]
        columns:
          - key: time
            label: Time
            kind: datetime
            style: secondary
            sizing: max
          - key: level
            label: Level
            sizing: "fixed(8)"
          - key: pid
            label: PID
            kind: number
            style: tertiary
            sizing: "fixed(8)"
          # The first line of the entry. `v` unfolds the rest: a message that
          # spans lines — a backtrace, a config dump — wraps into the column
          # instead of being cut off. A query on `message` sees the whole
          # entry either way.
          - key: message
            label: Message
            source: label
            long_source: message
            sizing: "flex(6)"
          # The number behind `level`, for `[prio, lte, 3]` and for sorting by
          # severity. Hidden because the word beside it says the same thing
          # legibly — a column of bare digits is not something anyone reads.
          - key: prio
            label: Prio
            kind: number
            sizing: "fixed(5)"
            hidden: true
        # Severity as colour, so a wall of log lines has a shape before it is
        # read. In file order, later rules layering over earlier ones.
        highlights:
          - when: { field: level, matches: '^(emerg|alert|crit|err)$' }
            style: error
          - when: { field: level, matches: '^warning$' }
            style: warning
          - when: { field: level, matches: '^debug$' }
            style: text_dim
        actions:
          - { name: refresh, key: r, type: reload }

      # `systemd-analyze security <unit>`, one check per row.
      #
      # systemd prints this as a table with a score under it, and the score is
      # the part everyone quotes. It is also the least useful part: 9.4 UNSAFE
      # is what nearly every user service on a stock system scores, so it
      # neither sorts anything nor says what to do about it. The checks behind
      # it do — which one is open, what it costs, and which directive closes it
      # — so here the checks are the rows, and the score is the (hidden)
      # `exposure` column on the list above.
      #
      # `status` is a word and not a boolean because systemd answers three
      # things, not two: `ok` (the unit already does this), `exposed` (it does
      # not) and `no-effect` (the check cannot apply to a user service at all —
      # `RemoveIPC=` is the only one). A boolean would have to file the third
      # under one of the other two, and either way it would read as a lie.
      #
      # `exposure` is empty rather than `0` where a check passes, which is what
      # makes `[exposure, gte, 0.3]` mean "what is still open, worst first"
      # without a second clause about the status.
      #
      # `fix` is the directive that settles the check — and it is deliberately
      # not the same text as `check`. What systemd prints as the name of a
      # check is a *label*: `CapabilityBoundingSet=~CAP_SET(UID|GID|PCAP)`
      # names a group of capabilities and is not valid configuration. Written
      # into a unit file it is ignored without a word of complaint, and the
      # check stays exposed. So the fix column is a curated table with the
      # groups expanded into the real capability names, and `e h` writes it.
      #
      # Under a unit file too, unlike Properties: an unloaded unit has no
      # D-Bus object, but it has a file, and systemd-analyze reads the file.
      # Units that are not services refuse — a socket has no sandbox to
      # describe — and the refusal is in systemd's own words.
      - &security
        name: Security
        node_type: "systemd:security"
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the checks. Columns: check, status, exposure, description,
            # fix, id.
            #
            #   query:
            #     [status, =, exposed]           # what is still open
            #     [exposure, gte, 0.3]           # only the ones that cost most
            #     [check, has, Capability]       # one family of checks
            #     [fix, has, Protect]            # what a Protect* line settles
            #
            #   query:
            #     and:
            #       - [status, =, exposed]
            #       - [exposure, gte, 0.3]
            #
            # A check that passes carries no exposure at all, so a bound on
            # `exposure` already excludes it: the two queries above select the
            # same rows.
            #
            # The line below matches everything — replace it with your filter:
            query:
              [check, has, ""]
        columns:
          - key: check
            label: Check
            source: label
            style: text_high
            sizing: "flex(2)"
          - key: status
            label: Status
            sizing: "fixed(10)"
          - key: exposure
            label: Exposure
            kind: number
            sizing: "fixed(9)"
          - key: description
            label: What it means
            style: secondary
            sizing: "flex(3)"
          # Blank where there is no line to write: `RootDirectory=` versus
          # `RootImage=` and `User=` versus `DynamicUser=` are a choice and
          # not a directive, and `RemoveIPC=` has no effect on a user service
          # at all. For those three `e h` writes a comment saying so rather
          # than pretending there is something to copy.
          - key: fix
            label: Fix
            sizing: "flex(3)"
          # systemd's stable name for the check — which the label above, for
          # the group checks, is not. Hidden because the label says the same
          # thing in the form you would actually write.
          - key: id
            label: Id
            style: tertiary
            sizing: "flex(2)"
            hidden: true
        # Three states, three colours, so the shape of the level is readable
        # before it is read: what is open, what is already covered, and what
        # does not apply here at all.
        highlights:
          - when: { field: status, matches: '^exposed$' }
            style: warning
          - when: { field: status, matches: '^ok$' }
            style: success
          - when: { field: status, matches: '^no-effect$' }
            style: text_dim
        actions:
          - { name: refresh, key: r, type: reload }
          # `e h` prefills the unit's drop-in with the fix for the check under
          # the cursor and opens it — the same buffer, the same
          # `systemd-analyze verify` pass and the same backup as `e e` on the
          # unit itself, which is why it sits under the editor leader and not
          # under `a`. Nothing is written until you save, so it is also how to
          # *read* what a fix would be.
          #
          # It appends rather than replaces: whatever drop-in the unit already
          # has comes up as it is, with the new stanza and a comment naming the
          # check at the bottom. Hardening a second check adds a second stanza
          # to the same file. A repeated `[Service]` heading is fine — systemd
          # merges the sections — so the stanza brings its own rather than
          # hunting for yours. And as with `e e`, a unit that already lives in
          # ~/.config/systemd/user has no vendor file left to layer over, so
          # the fix is written into that file directly.
          #
          # Three checks have no line to write (see the `fix` column above),
          # and one more cannot be closed at all while another is closed:
          # `ProtectClock=yes` implies `DeviceAllow=char-rtc r`, so the
          # `DeviceAllow=` check stays exposed whenever the clock is protected,
          # in either order. That is systemd's own arithmetic, not a gap in the
          # table.
          - { name: harden, key: "e h", type: edit, id: harden }

      # ------------------------------------ what the start waited for
      #
      # `systemd-analyze critical-chain <unit>` answers the question a slow
      # start raises. It walks backwards from the unit through what it is
      # ordered `After=`, one hop at a time, always to the dependency that
      # became active last before it, and draws the walk as a tree.
      #
      # The adapter computes the same walk instead of parsing that tree.
      # There is no `--json=` for critical-chain the way there is for
      # `security`, its only output is box drawing with systemd-escaped unit
      # names (`dev-disk-by\x2duuid-….device`), and a parser for it would
      # break on the first unit whose own name holds a `└`. Computing it
      # costs the properties the adapter already knows how to read, and it
      # buys cells with types rather than `+4.525s` in a string.
      #
      # A flat list rather than a tree, on purpose. The level exists to find
      # the biggest `+`, and finding it is a sort — while a tree stops being
      # the chain the moment it is sorted. So the indentation is a column
      # instead: `depth` 0 is the unit you asked about, `depth` 1 is what it
      # waited for. Sort by `took` and the culprit is the first row, with
      # `depth` still saying where in the chain it sat; sort by `depth` and
      # the chain is back.
      #
      # On this manager the chains are short, and that is the answer rather
      # than a defect. A user manager's whole startup is a fraction of the
      # system manager's — a couple of hundred milliseconds, a handful of
      # slices, sockets and targets, and not one service on the critical
      # path, because the services of a session are started by what happens
      # in the session, not by the manager coming up. A chain of half a
      # dozen rows ending at `-.slice` is the honest shape of that. Where
      # the system view answers "what made the boot take this long", this
      # one answers "what had to be in place before this unit could start",
      # and the usual answer is that almost nothing was in the way.
      - &chain
        name: Chain
        node_type: "systemd:chain"
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the chain. Columns: unit, depth, at, took, origin,
            # description.
            #
            #   query:
            #     [took, gt, 1]              # the hops that cost over a second
            #     [origin, =, after]         # what is not from this startup
            #     [unit, has, .mount]        # only the mounts on the way
            #
            # `at` and `took` compare in seconds, so `[took, gt, 1]` is "over
            # a second" — the rows themselves keep their microseconds.
            #
            # The line below matches everything — replace it with your filter:
            query:
              [depth, gte, 0]
        columns:
          - key: unit
            label: Unit
            style: text_high
            sizing: "flex(3)"
          # The indentation of systemd's tree, as a number. It is also the
          # level's default sort, which is what makes it open as a chain
          # rather than as an alphabetical list of units.
          - key: depth
            label: Depth
            kind: number
            sizing: "fixed(6)"
          # The number the tree prints after `@`: an offset from the
          # manager's own userspace timestamp, which is the same zero
          # `systemd-analyze time` counts from. `at + took` is the moment the
          # unit became active.
          #
          # `format: precise` for the same reason the Startup column has it —
          # a clock face would render every one of these as `00`.
          - key: at
            label: At
            kind: duration
            format: precise
            sizing: "fixed(9)"
          # The number after `+`, and the one to sort by: this is how long
          # the hop itself cost. Blank where the unit never started, `0`
          # where it started instantly — a `Type=simple` unit counts as
          # active the moment it execs, and that is a measurement, not a gap.
          - key: took
            label: Took
            kind: duration
            format: precise
            sizing: "fixed(9)"
          # Which startup the timestamps on this row belong to — the column
          # systemd's tree has no equivalent of, and the reason it is worth
          # having one here.
          #
          #   startup   the row is part of the manager's startup, as printed
          #   after     it became active after the manager had finished
          #   before    it was already up when userspace began (the initrd)
          #   (blank)   it never became active at all
          #
          # `systemd-analyze` says none of this. A unit restarted hours into
          # the uptime appears in a boot tree with a `+` like any other line,
          # and a chain that leaves the startup window is quietly rerouted
          # through whatever was still inside it. Here the row says which it
          # is, and it says so per row, so it survives sorting and can be
          # filtered on.
          - key: origin
            label: Origin
            sizing: "fixed(8)"
          - key: description
            label: Description
            style: secondary
            sizing: "flex(3)"
        # Dim rather than warn — see the note on `origin` above. On the user
        # manager `after` is the normal case, not an alarm: this manager
        # finishes its startup in under 200 ms, so a service you start from
        # the session, or one D-Bus activates on demand, is legitimately
        # outside the window. Colouring that yellow would cry wolf on nearly
        # every chain here. The system view uses `warning` for the same
        # value, where it means what it sounds like.
        highlights:
          - when: { field: origin, matches: '^(after|before)$' }
            style: text_dim
          - when: { field: origin, matches: '^$' }
            style: text_dim
        actions:
          - { name: refresh, key: r, type: reload }

      # ------------------------------------ what a unit needs, and when
      #
      # Two questions, and deliberately two levels.
      #
      # "What does this unit need in order to run?" is `Requires=`,
      # `Requisite=`, `BindsTo=`, `PartOf=`, `Upholds=` and `Wants=` — the
      # set `systemctl list-dependencies` walks. That one is a tree: what a
      # unit needs needs things of its own.
      #
      # "What does this unit run after?" is `After=` / `Before=`, and it is a
      # different question with a different shape. Ordering says nothing
      # about whether a unit is pulled in at all, only about the sequence of
      # two units that both happen to run. A tree that answers both at once
      # answers neither, so the ordering relations get their own flat level
      # below, exactly one hop deep — `After=basic.target` unfolded
      # recursively is the whole session start, which is not something
      # anyone reads.
      #
      # Neither level costs a round trip of its own: all of these are
      # ordinary properties on the generic `Unit` interface, so they arrive
      # in the same read the unit row already makes.
      - &dependencies
        name: dependencies
        node_type: "systemd:dep"
        # The tree hangs straight off the unit row: `enter` on a service
        # unfolds what it needs, `enter` again unfolds what *that* needs.
        # Which is why the level above carries `tree_label: name` as well —
        # a tree continuation only continues from a tree-active parent, so a
        # flat Services level could not grow this branch at all.
        tree_label: name
        # One ChildDef for every depth: a dependency is a unit, and a unit
        # has dependencies. The walk stops at ten levels, at a unit the
        # manager never loaded (there is nothing to ask), and at a unit that
        # is already somewhere above it in this branch — a cycle is shown
        # once, marked in the `relation` column, and not followed.
        recursive: true
        # No `query:` block here, and none is missing: a tree pane runs the
        # query of its ROOT level, so the editor on the Services level above
        # is the one that opens. That query narrows which units the tree
        # grows *from*; it does not reach into the branches, so what hangs
        # under a unit is everything that hangs under it.
        #
        # A row is addressed by its whole path rather than by its unit name
        # — `dep:foo.service>bar.target>baz.socket`. `systemctl
        # list-dependencies --all` on one ordinary service prints 120 rows
        # made of 27 distinct units: a name on its own would name four or
        # five tree positions at once, and both the tree cache and the live
        # row updates need an id that means exactly one row.
        columns:
          - key: name
            label: Unit
            source: label
            style: text_high
            sizing: "flex(2)"
          # Which of the six relations put this unit here. A unit named by
          # more than one shows the strongest — `Requires` over `Wants`, and
          # so on down the order the adapter declares — because that is the
          # one that decides what happens when it fails. A value ending in
          # `(cycle)` is a unit already present higher up this branch.
          - key: relation
            label: Relation
            style: secondary
            sizing: "fixed(16)"
          - key: active
            label: Active
            sizing: "fixed(10)"
          - key: sub
            label: Sub
            style: tertiary
            sizing: "fixed(12)"
          # `not-found` is what makes this column worth its width here: a
          # unit that is required but has no file is a broken dependency,
          # and nothing else on the row says so.
          - key: load
            label: Load
            style: tertiary
            sizing: "fixed(10)"
          - key: description
            label: Description
            sizing: "flex(3)"
        # The verbs reach these rows too. What they act on is whatever the
        # row happens to be — a `.target`, a `.slice`, a `.mount`, not just a
        # service — so only the verbs that work by name are bound here; the
        # ones that assume a process (`reload`, `kill`, `freeze`) or a loaded
        # unit (`reset-failed`) are not offered, and the adapter would refuse
        # them anyway.
        actions:
          - { name: refresh, key: r, type: reload }
          - { name: start, key: "a s", id: start }
          - { name: stop, key: "a x", id: stop }
          - { name: restart, key: "a r", id: restart }
          - { name: enable, key: "a e", id: enable }
          - { name: enable and start, key: "a E", id: enable-now }
          - { name: disable, key: "a d", id: disable }
          - { name: disable and stop, key: "a D", id: disable-now }
          - { name: mask, key: "a m", id: mask }
          - { name: unmask, key: "a u", id: unmask }
          # What the distribution meant this unit to be. `a p` enables or
          # disables it to match the preset policy — the Preset column on the
          # Unit files subtab is where you can see which way it will go.
          - { name: apply preset, key: "a p", id: preset }

      # `After=` and `Before=` for the unit under the cursor, as one flat
      # list. Reached with `D` and not with `enter`, because `enter` on a
      # unit row belongs to the dependency tree above.
      #
      # Read a row as a sentence: `after` is something this unit waits for,
      # `before` is something that waits for this unit. Being listed here
      # pulls nothing in — which is the whole reason this is not part of the
      # tree.
      - &ordering
        name: ordering
        node_type: "systemd:order"
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the ordering. Columns: name, relation, active, sub,
            # load, description.
            #
            #   query:
            #     [relation, =, after]         # only what this unit waits for
            #     [active, =, inactive]        # ordered against, never ran
            #     [load, =, not-found]         # ordered against nothing
            #
            # The line below matches everything — replace it with your filter:
            query:
              [name, has, ""]
        columns:
          - key: name
            label: Unit
            source: label
            style: text_high
            sizing: "flex(2)"
          - key: relation
            label: Relation
            style: secondary
            sizing: "fixed(10)"
          - key: active
            label: Active
            sizing: "fixed(10)"
          - key: sub
            label: Sub
            style: tertiary
            sizing: "fixed(12)"
          - key: load
            label: Load
            style: tertiary
            sizing: "fixed(10)"
          - key: description
            label: Description
            sizing: "flex(3)"
        actions:
          - { name: refresh, key: r, type: reload }
          - { name: start, key: "a s", id: start }
          - { name: stop, key: "a x", id: stop }
          - { name: restart, key: "a r", id: restart }
          - { name: enable, key: "a e", id: enable }
          - { name: disable, key: "a d", id: disable }
          - { name: mask, key: "a m", id: mask }
          - { name: unmask, key: "a u", id: unmask }
          # What the distribution meant this unit to be. `a p` enables or
          # disables it to match the preset policy — the Preset column on the
          # Unit files subtab is where you can see which way it will go.
          - { name: apply preset, key: "a p", id: preset }

  # ------------------------------------------------------------------ failed
  # The same level as Services, narrowed by a default query. A view, not a
  # fourth node type — which is also its one limitation: a failed *timer* does
  # not appear here, because this level lists services.
  - name: Failed
    key: "t f"
    node_type: "systemd:service"
    # Every row can unfold into what it needs — see the `dependencies`
    # child below. A tree continuation only continues from a tree-active
    # parent, so this level has to be a tree level itself; `name` is the
    # column the indent and the expand marker are drawn into.
    tree_label: name
    query:
      editable: true
      menu_key: q
      default: |
        query:
          [active, =, failed]

    columns:
      - key: name
        label: Unit
        source: label
        style: text_high
        sizing: "flex(2)"
      - key: sub
        label: Sub
        sizing: "fixed(12)"
      - key: enabled
        label: Enabled
        style: tertiary
        sizing: "fixed(9)"
      - key: restarts
        label: Restarts
        kind: number
        sizing: "fixed(8)"
      # How long it took — here, how long it took to fail. A unit that dies
      # on its first syscall and one that hangs until a timeout kills it both
      # end up on this subtab reading `failed`; this is the column that tells
      # them apart. See the Services level for what `format: precise` is for.
      - key: startup
        label: Startup
        kind: duration
        format: precise
        sizing: "fixed(9)"
      - key: since
        label: Since
        kind: datetime
        style: secondary
        sizing: max
      - key: description
        label: Description
        style: secondary
        sizing: "flex(3)"
      - key: fragment
        label: Fragment
        kind: path
        sizing: "flex(2)"
        hidden: true

    actions:
      - { name: refresh, key: r, type: reload }
    # Acting on the unit under the cursor. `a` is the project-wide action
    # leader; nothing else in this tab claims it, so the whole verb set fits
    # on one level of chord. Related letters sit together: the running verbs
    # (start/stop/restart/reload) on `s x r l`, the boot-time ones
    # (enable/disable/mask/unmask) on `e d m u`, and a capital means "and
    # now" — `a E` enables *and* starts, `a D` disables *and* stops.
    #
    # Which of these a level actually offers is the adapter's decision, not
    # this file's: a verb declares the scope it works in, and a binding for a
    # verb the level does not serve is simply inert. Timers have no processes
    # and so have no `reload`, `kill` or `freeze`; a unit file is not loaded
    # and so has no `reset-failed`.
    #
    # The disruptive ones ask before they act, and the adapter writes the
    # question — only it knows that stopping a unit stops whatever depends on
    # it. Protected units (see `protect:` in the adapter config) refuse the
    # disruptive verbs outright rather than asking: a prompt answers "did you
    # mean it", which is no answer to "this would take the session down".
      - { name: start, key: "a s", id: start }
      - { name: stop, key: "a x", id: stop }
      - { name: restart, key: "a r", id: restart }
      # `reload` asks the unit to re-read its config without dropping what it
      # is doing; `reload-or-restart` falls back to a restart when the unit
      # cannot. Only services — a timer has nothing to re-read.
      - { name: reload, key: "a l", id: reload }
      - { name: reload or restart, key: "a L", id: reload-or-restart }
      # The [Install] side: what happens at the next login, not now.
      - { name: enable, key: "a e", id: enable }
      - { name: enable and start, key: "a E", id: enable-now }
      - { name: disable, key: "a d", id: disable }
      - { name: disable and stop, key: "a D", id: disable-now }
      # Masking points the unit at /dev/null, so nothing can start it —
      # not a dependency, not systemctl, not this tab. It is the one verb
      # whose effect outlives a reboot and is invisible in the running state,
      # which is why `unmask` sits right next to it.
      - { name: mask, key: "a m", id: mask }
      - { name: unmask, key: "a u", id: unmask }
      # What the distribution meant this unit to be. `a p` enables or
      # disables it to match the preset policy — the Preset column on the
      # Unit files subtab is where you can see which way it will go.
      - { name: apply preset, key: "a p", id: preset }
      # Editing the unit's configuration. `e` is the editor leader everywhere
      # else in the app and it means the same here: a buffer opens, you save
      # it, the adapter writes the file.
      #
      # `e e` is what `systemctl edit` does — a *drop-in* at
      # ~/.config/systemd/user/<unit>.d/override.conf, layered on top of the
      # file the distribution ships. The vendor unit keeps receiving package
      # updates, and `systemctl --user revert <unit>` takes the change back
      # out in one word.
      #
      # A drop-in is read *in addition to* the unit file, so a directive that
      # takes a list — ExecStart=, ExecStartPre=, Environment=, After= — ADDS
      # an entry rather than replacing one. Replacing means clearing the list
      # first: `ExecStart=` on a line of its own, then the new value. The
      # buffer says so at the top, every time, because a second ExecStart= is
      # refused by systemd and the message does not mention drop-ins.
      #
      # `e f` edits the whole file instead, copying the vendor one into
      # ~/.config/systemd/user on first use. It shadows the vendor unit
      # completely — which also means it stops following its updates. If the
      # unit already loads from a file in that tree, `e e` edits that same
      # file: there is nothing underneath left to preserve, and a drop-in
      # would only split one unit across two files.
      #
      # Nothing is written before `systemd-analyze verify` has seen the text
      # in a staging directory. A unit systemd would refuse never reaches
      # ~/.config at all; one it merely complains about is written, and the
      # complaint is in the notification — a directive that silently never
      # took effect is how an edit goes unnoticed for weeks. The previous
      # version is kept under
      # ~/.local/share/not_yet_done/systemd-backups/<unit>/ (the last ten),
      # outside the systemd tree on purpose: every *.conf next to a drop-in is
      # configuration systemd would read, so a backup filed beside the file
      # would be safe by naming convention only.
      #
      # After the write the manager re-reads the file, which changes nothing
      # about what is already running. If the unit is up, a picker asks what
      # to do about that — restart, reload-or-restart, or nothing for now; if
      # it is not, there is no question to ask and none is asked. Protected
      # units (see `protect:` above) refuse the editor too: the unit file
      # decides what the unit comes back as.
      - { name: edit drop-in, key: "e e", type: edit, id: edit }
      - { name: edit whole unit file, key: "e f", type: edit, id: edit-full }
      # Clears the failed state so the unit can be started again — and so it
      # stops showing up in the Failed subtab. Changes nothing about what is
      # running.
      - { name: reset failed, key: "a f", id: reset-failed }
      # Signals. `a k` opens a menu rather than sending anything: the
      # deliberate act of picking SIGTERM or SIGKILL out of a list is what
      # takes the place of a y/n here.
      - { name: kill, key: "a k", id: kill }
      # Freeze suspends every process in the unit's cgroup without killing
      # it; pressing it again thaws. One key for both directions, because the
      # adapter can see which state the unit is in and you cannot mis-aim it.
      - { name: freeze or thaw, key: "a z", id: freeze }
      # Everything the manager knows about this unit, as a table — what
      # `systemctl show` prints, only sortable and filterable.
      - { name: properties, key: p, type: navigate, navigate_to: "systemd:property" }
      # The unit's own journal — `J` opens it as a level, `a j` follows it in
      # a terminal. The Services subtab above carries the explanation.
      - { name: journal, key: J, type: navigate, navigate_to: "systemd:log" }
      # `After=` / `Before=` for this unit, as their own level. `enter`
      # is taken: on a unit row it unfolds the dependency TREE (see
      # `children:` below), which answers what this unit needs rather than
      # what it is sequenced against.
      - { name: ordering, key: D, type: navigate, navigate_to: "systemd:order" }
      # The security checks for this unit — the Services subtab above carries
      # the explanation.
      - { name: security, key: H, type: navigate, navigate_to: "systemd:security" }
      # What the start of the unit under the cursor actually waited for,
      # one hop per row — see the `Chain` child below. `C` for chain; the
      # lowercase `c` is the column leader and not available.
      - { name: chain, key: C, type: navigate, navigate_to: "systemd:chain" }
      - { name: follow in a terminal, key: "a j", id: follow }
      # Creating a unit — `n s` a service, `n t` a timer with its service,
      # `n f` an empty file in `$EDITOR`. These act on the manager rather than
      # on the row under the cursor, so they are the same three keys on every
      # level; the Services level above carries the explanation.
      - { name: new service, key: "n s", type: custom, id: new-service, on_container: true }
      - { name: new timer, key: "n t", type: custom, id: new-timer, on_container: true }
      - { name: new unit file, key: "n f", type: create, id: new-file }

    children:
      # `systemctl show` is two hundred `Key=value` lines and a terminal can
      # only scroll them. The same content as a level is sortable and
      # filterable with everything the tab already has: `[name, has, Timeout]`
      # answers in one keystroke what grepping a wall of text answers in three.
      #
      # Both interfaces at once: the generic `Unit` one (ActiveState,
      # LoadState, the dependency lists) and the unit's own. The `interface`
      # column says which a row came from.
      #
      # Only under a *loaded* unit. A unit file the manager has never touched
      # has no D-Bus object behind it, so there is nothing to read — which is
      # why the Unit files level below has no such child.
      - name: Properties
        node_type: "systemd:property"
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the properties. Columns: name, value, interface.
            #
            #   query:
            #     [name, has, Timeout]         # every timeout at once
            #     [interface, =, Service]      # drop the generic Unit half
            #     [value, has, /home]          # what points into my home
            query:
              [name, has, ""]
        columns:
          - key: name
            label: Property
            source: label
            style: text_high
            sizing: "flex(2)"
          - key: value
            label: Value
            sizing: "flex(5)"
          - key: interface
            label: Interface
            style: tertiary
            sizing: "fixed(10)"
        actions:
          - { name: refresh, key: r, type: reload }
      # The unit's own journal, newest first — see the Services subtab above
      # for what this level is and how its query reads.
      - name: Journal
        node_type: "systemd:log"
        # Newest first, and `>` / `<` walk older / newer in windows of this
        # size. A journal has no end to load towards, so "all rows" is not an
        # option the way it is for a list of units.
        pagination: { mode: server, page_size: 200 }
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the journal. Columns: time, level, prio, pid, message.
            #
            #   query:
            #     [prio, lte, 3]                 # errors and worse
            #     [message, has, timeout]        # what mentions a timeout
            #     [time, gte, "today"]           # since midnight
            #
            #   query:
            #     and:
            #       - [prio, lte, 4]
            #       - [time, gte, "yesterday"]
            #
            # `[level, =, err]` and `[prio, =, 3]` select the same rows —
            # `prio` is the number, `level` the word for it. What journalctl
            # can answer itself the adapter hands to it: a severity bound and
            # a time bound narrow what is *read*. Everything else is matched
            # here, on the decoded line, which is why `message` is never
            # pushed down — the bytes on disk still carry the colour escapes
            # that the cell no longer does.
            #
            # The line below matches everything — replace it with your filter:
            query:
              [message, has, ""]
        columns:
          - key: time
            label: Time
            kind: datetime
            style: secondary
            sizing: max
          - key: level
            label: Level
            sizing: "fixed(8)"
          - key: pid
            label: PID
            kind: number
            style: tertiary
            sizing: "fixed(8)"
          # The first line of the entry. `v` unfolds the rest: a message that
          # spans lines — a backtrace, a config dump — wraps into the column
          # instead of being cut off. A query on `message` sees the whole
          # entry either way.
          - key: message
            label: Message
            source: label
            long_source: message
            sizing: "flex(6)"
          # The number behind `level`, for `[prio, lte, 3]` and for sorting by
          # severity. Hidden because the word beside it says the same thing
          # legibly — a column of bare digits is not something anyone reads.
          - key: prio
            label: Prio
            kind: number
            sizing: "fixed(5)"
            hidden: true
        # Severity as colour, so a wall of log lines has a shape before it is
        # read. In file order, later rules layering over earlier ones.
        highlights:
          - when: { field: level, matches: '^(emerg|alert|crit|err)$' }
            style: error
          - when: { field: level, matches: '^warning$' }
            style: warning
          - when: { field: level, matches: '^debug$' }
            style: text_dim
        actions:
          - { name: refresh, key: r, type: reload }

      # And the security checks, aliased from Services. Worth having exactly
      # here: a unit that started failing right after a hardening drop-in is
      # usually failing *because* of it, and this level is where you can see
      # what the drop-in took away.
      - *security

      # And the chain, aliased from Services. A unit that failed on a timeout
      # failed waiting for something, and this is the level that names it —
      # the chain is built from the timestamps of the last start, so it
      # survives the unit having gone on to fail.
      - *chain

      # The same two levels as under Services, aliased rather than copied: a
      # unit's dependencies do not change shape because the list above them
      # is narrowed to what is broken. Handy exactly here, in fact — a failed
      # unit often failed because something underneath it did.
      - *dependencies
      - *ordering

  # ------------------------------------------------------------------ timers
  - name: Timers
    key: "t t"
    node_type: "systemd:timer"
    # Every row can unfold into what it needs — see the `dependencies`
    # child below. A tree continuation only continues from a tree-active
    # parent, so this level has to be a tree level itself; `name` is the
    # column the indent and the expand marker are drawn into.
    tree_label: name

    # Columns on this level: name, description, active, sub, enabled, next,
    # last, unit, result, persistent. (`left` and `passed` are derived by the
    # table engine from `next` and `last`, so they cannot be queried — query
    # the instant instead.)
    query:
      editable: true
      menu_key: q
      template: |
        # Filter the loaded timers. Columns: name, description, active, sub,
        # enabled, next, last, unit, result, persistent.
        #
        #   query:
        #     [result, '!=', success]          # a timer whose unit failed
        #
        #   query:
        #     [next, lte, "end of day"]        # what still runs today
        #
        # The line below matches everything — replace it with your filter:
        query:
          [name, has, ""]

    columns:
      - key: name
        label: Timer
        source: label
        style: text_high
        sizing: "flex(2)"
      - key: next
        label: Next
        kind: datetime
        sizing: max
      # No value of its own — the mirror of `passed` below: the engine renders
      # `next` − now and ticks it live, on a two-unit scale ("1w 2d", "5h
      # 24min", "13s"). A timer whose elapse has passed counts on downwards
      # with a leading "-", which is how one sees that it is late.
      - key: left
        label: Left
        kind: countdown
        countdown_to: next
        style: secondary
        sizing: "fixed(10)"
      - key: last
        label: Last
        kind: datetime
        style: secondary
        sizing: max
      # No value of its own: the table engine renders now − `last`, ticking
      # live. This is what "ran 20 minutes ago" looks like without a column
      # that goes stale between loads.
      - key: passed
        label: Ago
        kind: elapsed
        elapsed_from: last
        style: tertiary
        sizing: "fixed(9)"
      - key: unit
        label: Triggers
        sizing: "flex(2)"
      - key: result
        label: Result
        sizing: "fixed(9)"
      - key: active
        label: Active
        sizing: "fixed(10)"
        hidden: true
      - key: sub
        label: Sub
        style: secondary
        sizing: "fixed(10)"
        hidden: true
      - key: enabled
        label: Enabled
        style: tertiary
        sizing: "fixed(9)"
        hidden: true
      - key: persistent
        label: Persistent
        sizing: "fixed(10)"
        hidden: true
      - key: description
        label: Description
        style: secondary
        sizing: "flex(3)"

    actions:
      - { name: refresh, key: r, type: reload }
    # Acting on the unit under the cursor. `a` is the project-wide action
    # leader; nothing else in this tab claims it, so the whole verb set fits
    # on one level of chord. Related letters sit together: the running verbs
    # (start/stop/restart/reload) on `s x r l`, the boot-time ones
    # (enable/disable/mask/unmask) on `e d m u`, and a capital means "and
    # now" — `a E` enables *and* starts, `a D` disables *and* stops.
    #
    # Which of these a level actually offers is the adapter's decision, not
    # this file's: a verb declares the scope it works in, and a binding for a
    # verb the level does not serve is simply inert. Timers have no processes
    # and so have no `reload`, `kill` or `freeze`; a unit file is not loaded
    # and so has no `reset-failed`.
    #
    # The disruptive ones ask before they act, and the adapter writes the
    # question — only it knows that stopping a unit stops whatever depends on
    # it. Protected units (see `protect:` in the adapter config) refuse the
    # disruptive verbs outright rather than asking: a prompt answers "did you
    # mean it", which is no answer to "this would take the session down".
      - { name: start, key: "a s", id: start }
      - { name: stop, key: "a x", id: stop }
      - { name: restart, key: "a r", id: restart }
      # The [Install] side: what happens at the next login, not now.
      - { name: enable, key: "a e", id: enable }
      - { name: enable and start, key: "a E", id: enable-now }
      - { name: disable, key: "a d", id: disable }
      - { name: disable and stop, key: "a D", id: disable-now }
      # Masking points the unit at /dev/null, so nothing can start it —
      # not a dependency, not systemctl, not this tab. It is the one verb
      # whose effect outlives a reboot and is invisible in the running state,
      # which is why `unmask` sits right next to it.
      - { name: mask, key: "a m", id: mask }
      - { name: unmask, key: "a u", id: unmask }
      # What the distribution meant this unit to be. `a p` enables or
      # disables it to match the preset policy — the Preset column on the
      # Unit files subtab is where you can see which way it will go.
      - { name: apply preset, key: "a p", id: preset }
      # Editing the unit's configuration. `e` is the editor leader everywhere
      # else in the app and it means the same here: a buffer opens, you save
      # it, the adapter writes the file.
      #
      # `e e` is what `systemctl edit` does — a *drop-in* at
      # ~/.config/systemd/user/<unit>.d/override.conf, layered on top of the
      # file the distribution ships. The vendor unit keeps receiving package
      # updates, and `systemctl --user revert <unit>` takes the change back
      # out in one word.
      #
      # A drop-in is read *in addition to* the unit file, so a directive that
      # takes a list — ExecStart=, ExecStartPre=, Environment=, After= — ADDS
      # an entry rather than replacing one. Replacing means clearing the list
      # first: `ExecStart=` on a line of its own, then the new value. The
      # buffer says so at the top, every time, because a second ExecStart= is
      # refused by systemd and the message does not mention drop-ins.
      #
      # `e f` edits the whole file instead, copying the vendor one into
      # ~/.config/systemd/user on first use. It shadows the vendor unit
      # completely — which also means it stops following its updates. If the
      # unit already loads from a file in that tree, `e e` edits that same
      # file: there is nothing underneath left to preserve, and a drop-in
      # would only split one unit across two files.
      #
      # Nothing is written before `systemd-analyze verify` has seen the text
      # in a staging directory. A unit systemd would refuse never reaches
      # ~/.config at all; one it merely complains about is written, and the
      # complaint is in the notification — a directive that silently never
      # took effect is how an edit goes unnoticed for weeks. The previous
      # version is kept under
      # ~/.local/share/not_yet_done/systemd-backups/<unit>/ (the last ten),
      # outside the systemd tree on purpose: every *.conf next to a drop-in is
      # configuration systemd would read, so a backup filed beside the file
      # would be safe by naming convention only.
      #
      # After the write the manager re-reads the file, which changes nothing
      # about what is already running. If the unit is up, a picker asks what
      # to do about that — restart, reload-or-restart, or nothing for now; if
      # it is not, there is no question to ask and none is asked. Protected
      # units (see `protect:` above) refuse the editor too: the unit file
      # decides what the unit comes back as.
      - { name: edit drop-in, key: "e e", type: edit, id: edit }
      - { name: edit whole unit file, key: "e f", type: edit, id: edit-full }
      # Clears the failed state so the unit can be started again — and so it
      # stops showing up in the Failed subtab. Changes nothing about what is
      # running.
      - { name: reset failed, key: "a f", id: reset-failed }
      # Everything the manager knows about this unit, as a table — what
      # `systemctl show` prints, only sortable and filterable.
      - { name: properties, key: p, type: navigate, navigate_to: "systemd:property" }
      # The unit's own journal — `J` opens it as a level, `a j` follows it in
      # a terminal. The Services subtab above carries the explanation.
      - { name: journal, key: J, type: navigate, navigate_to: "systemd:log" }
      # `After=` / `Before=` for this unit, as their own level. `enter`
      # is taken: on a unit row it unfolds the dependency TREE (see
      # `children:` below), which answers what this unit needs rather than
      # what it is sequenced against.
      - { name: ordering, key: D, type: navigate, navigate_to: "systemd:order" }
      # The security checks — but for the service this timer triggers, not for
      # the timer. See the `Security` child below.
      - { name: security, key: H, type: navigate, navigate_to: "systemd:security" }
      # What the start of the unit under the cursor actually waited for,
      # one hop per row — see the `Chain` child below. `C` for chain; the
      # lowercase `c` is the column leader and not available.
      - { name: chain, key: C, type: navigate, navigate_to: "systemd:chain" }
      - { name: follow in a terminal, key: "a j", id: follow }
      # Creating a unit — `n s` a service, `n t` a timer with its service,
      # `n f` an empty file in `$EDITOR`. These act on the manager rather than
      # on the row under the cursor, so they are the same three keys on every
      # level; the Services level above carries the explanation.
      - { name: new service, key: "n s", type: custom, id: new-service, on_container: true }
      - { name: new timer, key: "n t", type: custom, id: new-timer, on_container: true }
      - { name: new unit file, key: "n f", type: create, id: new-file }

    children:
      # `systemctl show` is two hundred `Key=value` lines and a terminal can
      # only scroll them. The same content as a level is sortable and
      # filterable with everything the tab already has: `[name, has, Timeout]`
      # answers in one keystroke what grepping a wall of text answers in three.
      #
      # Both interfaces at once: the generic `Unit` one (ActiveState,
      # LoadState, the dependency lists) and the unit's own. The `interface`
      # column says which a row came from.
      #
      # Only under a *loaded* unit. A unit file the manager has never touched
      # has no D-Bus object behind it, so there is nothing to read — which is
      # why the Unit files level below has no such child.
      - name: Properties
        node_type: "systemd:property"
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the properties. Columns: name, value, interface.
            #
            #   query:
            #     [name, has, Timeout]         # every timeout at once
            #     [interface, =, Service]      # drop the generic Unit half
            #     [value, has, /home]          # what points into my home
            query:
              [name, has, ""]
        columns:
          - key: name
            label: Property
            source: label
            style: text_high
            sizing: "flex(2)"
          - key: value
            label: Value
            sizing: "flex(5)"
          - key: interface
            label: Interface
            style: tertiary
            sizing: "fixed(10)"
        actions:
          - { name: refresh, key: r, type: reload }
      # The unit's own journal, newest first — see the Services subtab above
      # for what this level is and how its query reads.
      - name: Journal
        node_type: "systemd:log"
        # Newest first, and `>` / `<` walk older / newer in windows of this
        # size. A journal has no end to load towards, so "all rows" is not an
        # option the way it is for a list of units.
        pagination: { mode: server, page_size: 200 }
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the journal. Columns: time, level, prio, pid, message.
            #
            #   query:
            #     [prio, lte, 3]                 # errors and worse
            #     [message, has, timeout]        # what mentions a timeout
            #     [time, gte, "today"]           # since midnight
            #
            #   query:
            #     and:
            #       - [prio, lte, 4]
            #       - [time, gte, "yesterday"]
            #
            # `[level, =, err]` and `[prio, =, 3]` select the same rows —
            # `prio` is the number, `level` the word for it. What journalctl
            # can answer itself the adapter hands to it: a severity bound and
            # a time bound narrow what is *read*. Everything else is matched
            # here, on the decoded line, which is why `message` is never
            # pushed down — the bytes on disk still carry the colour escapes
            # that the cell no longer does.
            #
            # The line below matches everything — replace it with your filter:
            query:
              [message, has, ""]
        columns:
          - key: time
            label: Time
            kind: datetime
            style: secondary
            sizing: max
          - key: level
            label: Level
            sizing: "fixed(8)"
          - key: pid
            label: PID
            kind: number
            style: tertiary
            sizing: "fixed(8)"
          # The first line of the entry. `v` unfolds the rest: a message that
          # spans lines — a backtrace, a config dump — wraps into the column
          # instead of being cut off. A query on `message` sees the whole
          # entry either way.
          - key: message
            label: Message
            source: label
            long_source: message
            sizing: "flex(6)"
          # The number behind `level`, for `[prio, lte, 3]` and for sorting by
          # severity. Hidden because the word beside it says the same thing
          # legibly — a column of bare digits is not something anyone reads.
          - key: prio
            label: Prio
            kind: number
            sizing: "fixed(5)"
            hidden: true
        # Severity as colour, so a wall of log lines has a shape before it is
        # read. In file order, later rules layering over earlier ones.
        highlights:
          - when: { field: level, matches: '^(emerg|alert|crit|err)$' }
            style: error
          - when: { field: level, matches: '^warning$' }
            style: warning
          - when: { field: level, matches: '^debug$' }
            style: text_dim
        actions:
          - { name: refresh, key: r, type: reload }

      # The security checks, aliased from Services — but a timer is not a
      # service unit, and `systemd-analyze security` refuses one outright. It
      # is right to: a timer starts no processes of its own, so it has no
      # sandbox to describe. What it does have is the service it triggers, and
      # that is the unit this level analyses. The rows say so — each carries
      # the unit it was measured on, and `e h` writes into *that* unit's
      # drop-in, not into the timer's.
      - *security

      # The chain, aliased from Services — and note that it does *not* do
      # what the level above it does. Security redirects to the service the
      # timer triggers, because a timer has no sandbox of its own. A timer
      # does have a start of its own, so the chain is the timer's: what the
      # manager had to bring up before this timer could begin waiting. For
      # the chain of the run it triggers, open the service.
      - *chain

      # The same two levels as under Services. A timer needs and is ordered
      # against other units exactly as a service is — not least the service
      # it triggers, which is usually the first row of the tree.
      - *dependencies
      - *ordering

  # -------------------------------------------------------------- unit files
  - name: Unit files
    key: "t u"
    node_type: "systemd:unitfile"

    # Columns on this level: name, state, path, vendor, preset, drift,
    # shadows. The last three are not things systemd hands over — there is no
    # D-Bus route to a unit file's preset, and `ListUnitFiles` reports only the
    # file that won — so the adapter reads the preset policy and walks the
    # search path itself, exactly as systemctl does.
    query:
      editable: true
      menu_key: q
      template: |
        # Filter the unit files on disk. Columns: name, state, path, vendor,
        # preset, drift, shadows.
        #
        #   query:
        #     [drift, has, should]             # every unit off its policy
        #
        #   query:
        #     [drift, =, should-disable]       # on, and the policy says off
        #
        #   query:
        #     [shadows, has, /usr]             # my copy hides the packaged one
        #
        #   query:
        #     [vendor, =, user]                # units I wrote myself
        #
        #   query:
        #     [state, =, masked]               # what is masked off
        #
        # The first three are the audit, and each one is worth keeping with
        # `★` in this menu: `drift` is empty for every unit that agrees with
        # its preset, `shadows` for every file that is alone under its name.
        # A row that answers one of them is a row to look at.
        #
        # The line below matches everything — replace it with your filter:
        query:
          [name, has, ""]

    columns:
      - key: name
        label: Unit file
        source: label
        style: text_high
        sizing: "flex(2)"
      - key: state
        label: State
        sizing: "fixed(12)"
      - key: vendor
        label: Origin
        style: tertiary
        sizing: "fixed(9)"
      # What the distribution's policy wants this unit's enablement to be,
      # read against `state` next to it. Empty where a preset cannot apply at
      # all — a `static` unit has no [Install] section to enable, a
      # `generated` or `transient` one has no file anybody wrote.
      - key: preset
        label: Preset
        style: tertiary
        sizing: "fixed(9)"
      # How the unit disagrees with the policy, named as the fix:
      # `should-enable` or `should-disable` is what `a p` would do to this row.
      # Empty when the two agree, which is why the column is quiet on a
      # machine in line with its distribution — and why sorting by it is the
      # audit.
      #
      # `should-enable` is loud on a distribution that ships no default-off
      # preset (on a plain Arch-family install the only user preset file is
      # systemd's own 90-systemd.preset, with two `enable` lines): systemd's
      # default for an unmatched unit is `enable`, so `systemctl preset-all`
      # really would switch all of those on. That is the policy's answer, not
      # a wrong reading of it.
      #
      # An empty cell says the unit agrees with its policy, not that `a p`
      # would do nothing: a unit enabled from /etc/systemd/user reads
      # `enabled` here, and a user-level preset can still write its own
      # symlink beside it. `a p` says which of the two happened.
      - key: drift
        label: Drift
        sizing: "fixed(14)"
      # The unit file this one hides. A file in ~/.config with the same name
      # as one in /usr/lib means the distribution's version is not being read
      # — the unit works, it is simply not the unit the package ships, which
      # is how an update goes unnoticed. Empty for every file that is alone
      # under its name, which is nearly all of them.
      - key: shadows
        label: Shadows
        kind: path
        style: secondary
        sizing: "flex(2)"
      - key: path
        label: Path
        kind: path
        style: secondary
        sizing: "flex(3)"

    actions:
      - { name: refresh, key: r, type: reload }
    # Acting on the unit under the cursor. `a` is the project-wide action
    # leader; nothing else in this tab claims it, so the whole verb set fits
    # on one level of chord. Related letters sit together: the running verbs
    # (start/stop/restart/reload) on `s x r l`, the boot-time ones
    # (enable/disable/mask/unmask) on `e d m u`, and a capital means "and
    # now" — `a E` enables *and* starts, `a D` disables *and* stops.
    #
    # Which of these a level actually offers is the adapter's decision, not
    # this file's: a verb declares the scope it works in, and a binding for a
    # verb the level does not serve is simply inert. Timers have no processes
    # and so have no `reload`, `kill` or `freeze`; a unit file is not loaded
    # and so has no `reset-failed`.
    #
    # The disruptive ones ask before they act, and the adapter writes the
    # question — only it knows that stopping a unit stops whatever depends on
    # it. Protected units (see `protect:` in the adapter config) refuse the
    # disruptive verbs outright rather than asking: a prompt answers "did you
    # mean it", which is no answer to "this would take the session down".
      - { name: start, key: "a s", id: start }
      - { name: stop, key: "a x", id: stop }
      - { name: restart, key: "a r", id: restart }
      # The [Install] side: what happens at the next login, not now.
      - { name: enable, key: "a e", id: enable }
      - { name: enable and start, key: "a E", id: enable-now }
      - { name: disable, key: "a d", id: disable }
      - { name: disable and stop, key: "a D", id: disable-now }
      # Masking points the unit at /dev/null, so nothing can start it —
      # not a dependency, not systemctl, not this tab. It is the one verb
      # whose effect outlives a reboot and is invisible in the running state,
      # which is why `unmask` sits right next to it.
      - { name: mask, key: "a m", id: mask }
      - { name: unmask, key: "a u", id: unmask }
      # What the distribution meant this unit to be. `a p` enables or
      # disables it to match the preset policy — the Preset column on the
      # Unit files subtab is where you can see which way it will go.
      - { name: apply preset, key: "a p", id: preset }
      # Editing the unit's configuration. `e` is the editor leader everywhere
      # else in the app and it means the same here: a buffer opens, you save
      # it, the adapter writes the file.
      #
      # `e e` is what `systemctl edit` does — a *drop-in* at
      # ~/.config/systemd/user/<unit>.d/override.conf, layered on top of the
      # file the distribution ships. The vendor unit keeps receiving package
      # updates, and `systemctl --user revert <unit>` takes the change back
      # out in one word.
      #
      # A drop-in is read *in addition to* the unit file, so a directive that
      # takes a list — ExecStart=, ExecStartPre=, Environment=, After= — ADDS
      # an entry rather than replacing one. Replacing means clearing the list
      # first: `ExecStart=` on a line of its own, then the new value. The
      # buffer says so at the top, every time, because a second ExecStart= is
      # refused by systemd and the message does not mention drop-ins.
      #
      # `e f` edits the whole file instead, copying the vendor one into
      # ~/.config/systemd/user on first use. It shadows the vendor unit
      # completely — which also means it stops following its updates. If the
      # unit already loads from a file in that tree, `e e` edits that same
      # file: there is nothing underneath left to preserve, and a drop-in
      # would only split one unit across two files.
      #
      # Nothing is written before `systemd-analyze verify` has seen the text
      # in a staging directory. A unit systemd would refuse never reaches
      # ~/.config at all; one it merely complains about is written, and the
      # complaint is in the notification — a directive that silently never
      # took effect is how an edit goes unnoticed for weeks. The previous
      # version is kept under
      # ~/.local/share/not_yet_done/systemd-backups/<unit>/ (the last ten),
      # outside the systemd tree on purpose: every *.conf next to a drop-in is
      # configuration systemd would read, so a backup filed beside the file
      # would be safe by naming convention only.
      #
      # After the write the manager re-reads the file, which changes nothing
      # about what is already running. If the unit is up, a picker asks what
      # to do about that — restart, reload-or-restart, or nothing for now; if
      # it is not, there is no question to ask and none is asked. Protected
      # units (see `protect:` above) refuse the editor too: the unit file
      # decides what the unit comes back as.
      - { name: edit drop-in, key: "e e", type: edit, id: edit }
      - { name: edit whole unit file, key: "e f", type: edit, id: edit-full }
      # The unit's own journal — `J` opens it as a level, `a j` follows it in
      # a terminal. The Services subtab above carries the explanation.
      - { name: journal, key: J, type: navigate, navigate_to: "systemd:log" }
      # The security checks for this unit — the Services subtab above carries
      # the explanation.
      - { name: security, key: H, type: navigate, navigate_to: "systemd:security" }
      # No chain binding here, deliberately. A critical chain is made of
      # timestamps, and a unit the manager has never loaded has none: it
      # has a file and nothing else. The adapter does not offer the level
      # under a unit file at all, so there is nothing to navigate to.
      - { name: follow in a terminal, key: "a j", id: follow }
      # Creating a unit — `n s` a service, `n t` a timer with its service,
      # `n f` an empty file in `$EDITOR`. These act on the manager rather than
      # on the row under the cursor, so they are the same three keys on every
      # level; the Services level above carries the explanation.
      - { name: new service, key: "n s", type: custom, id: new-service, on_container: true }
      - { name: new timer, key: "n t", type: custom, id: new-timer, on_container: true }
      - { name: new unit file, key: "n f", type: create, id: new-file }

    children:
      # The unit's own journal, newest first — see the Services subtab above
      # for what this level is and how its query reads.
      - name: Journal
        node_type: "systemd:log"
        # Newest first, and `>` / `<` walk older / newer in windows of this
        # size. A journal has no end to load towards, so "all rows" is not an
        # option the way it is for a list of units.
        pagination: { mode: server, page_size: 200 }
        query:
          editable: true
          menu_key: q
          template: |
            # Filter the journal. Columns: time, level, prio, pid, message.
            #
            #   query:
            #     [prio, lte, 3]                 # errors and worse
            #     [message, has, timeout]        # what mentions a timeout
            #     [time, gte, "today"]           # since midnight
            #
            #   query:
            #     and:
            #       - [prio, lte, 4]
            #       - [time, gte, "yesterday"]
            #
            # `[level, =, err]` and `[prio, =, 3]` select the same rows —
            # `prio` is the number, `level` the word for it. What journalctl
            # can answer itself the adapter hands to it: a severity bound and
            # a time bound narrow what is *read*. Everything else is matched
            # here, on the decoded line, which is why `message` is never
            # pushed down — the bytes on disk still carry the colour escapes
            # that the cell no longer does.
            #
            # The line below matches everything — replace it with your filter:
            query:
              [message, has, ""]
        columns:
          - key: time
            label: Time
            kind: datetime
            style: secondary
            sizing: max
          - key: level
            label: Level
            sizing: "fixed(8)"
          - key: pid
            label: PID
            kind: number
            style: tertiary
            sizing: "fixed(8)"
          # The first line of the entry. `v` unfolds the rest: a message that
          # spans lines — a backtrace, a config dump — wraps into the column
          # instead of being cut off. A query on `message` sees the whole
          # entry either way.
          - key: message
            label: Message
            source: label
            long_source: message
            sizing: "flex(6)"
          # The number behind `level`, for `[prio, lte, 3]` and for sorting by
          # severity. Hidden because the word beside it says the same thing
          # legibly — a column of bare digits is not something anyone reads.
          - key: prio
            label: Prio
            kind: number
            sizing: "fixed(5)"
            hidden: true
        # Severity as colour, so a wall of log lines has a shape before it is
        # read. In file order, later rules layering over earlier ones.
        highlights:
          - when: { field: level, matches: '^(emerg|alert|crit|err)$' }
            style: error
          - when: { field: level, matches: '^warning$' }
            style: warning
          - when: { field: level, matches: '^debug$' }
            style: text_dim
        actions:
          - { name: refresh, key: r, type: reload }

      # The security checks, aliased from Services. This is the one place they
      # can be asked about a unit the manager has never loaded: the analysis
      # reads the file, not a bus object. A unit file that is not a service
      # refuses, in systemd's own words.
      - *security
