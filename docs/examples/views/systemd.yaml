  # ------------------------------------------------------------------ timers
  - name: Timers
    key: "t t"
    node_type: "systemd:timer"

    # Columns on this level: name, description, active, sub, enabled, next,
    # left, last, unit, result, persistent.
    query:
      editable: true
      menu_key: q
      template: |
        # Filter the loaded timers. Columns: name, description, active, sub,
        # enabled, next, left, last, unit, result, persistent.
        #
        #   query:
        #     [result, '!=', success]          # a timer whose unit failed
        #
        #   query:
        #     [next, lte, "end of day"]        # what still runs today
        #
        # The line below matches everything — replace it with your filter:
        query:
          [name, has, ""]

    columns:
      - key: name
        label: Timer
        source: label
        style: text_high
        sizing: "flex(2)"
      - key: next
        label: Next
        kind: datetime
        sizing: max
      # Adapter-formatted ("2h 15min"), so it cannot be sorted on — sort by
      # `next`, which is the same order and is a real instant.
      - key: left
        label: Left
        style: secondary
        sizing: "fixed(10)"
      - key: last
        label: Last
        kind: datetime
        style: secondary
        sizing: max
      # No value of its own: the table engine renders now − `last`, ticking
      # live. This is what "ran 20 minutes ago" looks like without a column
      # that goes stale between loads.
      - key: passed
        label: Ago
        kind: elapsed
        elapsed_from: last
        style: tertiary
        sizing: "fixed(9)"
      - key: unit
        label: Triggers
        sizing: "flex(2)"
      - key: result
        label: Result
        sizing: "fixed(9)"
      - key: active
        label: Active
        sizing: "fixed(10)"
        hidden: true
      - key: sub
        label: Sub
        style: secondary
        sizing: "fixed(10)"
        hidden: true
      - key: enabled
        label: Enabled
        style: tertiary
        sizing: "fixed(9)"
        hidden: true
      - key: persistent
        label: Persistent
        sizing: "fixed(10)"
        hidden: true
      - key: description
        label: Description
        style: secondary
        sizing: "flex(3)"

    actions:
      - { name: refresh, key: r, type: reload }
