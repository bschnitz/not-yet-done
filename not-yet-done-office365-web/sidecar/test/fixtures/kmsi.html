<!doctype html>
<!--
  Fixture: the "Stay signed in?" (KMSI) prompt shown after a successful
  password step. No email/password inputs are visible; a keep-signed-in
  checkbox plus Yes (submit) / No (back) buttons. Invented data.
-->
<html lang="en">
  <head><meta charset="utf-8" /><title>Stay signed in?</title></head>
  <body>
    <h1>Stay signed in?</h1>
    <form>
      <input type="checkbox" id="KmsiCheckboxField" />
      <label for="KmsiCheckboxField">Don't show this again</label>
      <input type="button" id="idBtn_Back" value="No" />
      <input type="submit" id="idSIButton9" value="Yes" />
    </form>
  </body>
</html>
