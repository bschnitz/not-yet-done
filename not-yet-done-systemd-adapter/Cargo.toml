[package]
name = "not-yet-done-systemd-adapter"
version = "0.1.0"
edition = "2024"

# The `systemd` content adapter. Browses a systemd manager as a content tree —
# services, timers and unit files as tables — over D-Bus rather than by shelling
# out to `systemctl`. See docs/plan-systemd-adapter.md for the phase plan; this
# crate is phase 0 (read-only) and grows from there.

[dependencies]
async-trait = { workspace = true }
chrono      = { workspace = true }
dirs        = { workspace = true }
fieldsmith  = { workspace = true }
futures     = { workspace = true }
# Preset files match unit names with shell-style wildcards — see `preset`.
globset     = { workspace = true }
serde       = { workspace = true }
# `journalctl --output=json` is the journal's only machine-readable interface —
# there is no D-Bus one. See `journal`.
serde_json  = { workspace = true }
tempfile    = { workspace = true }
tokio       = { workspace = true }

# Generated proxies for org.freedesktop.systemd1, versioned by systemd release
# (0.26100.x = systemd 261). Only the interfaces we speak are compiled in.
zbus_systemd = { workspace = true }

# The one-shot timer's "tomorrow at 9": a single instant, which is exactly
# what this resolver does — a recurrence is systemd's job (see `calendar`).
natural-date        = { path = "../natural-date" }

not-yet-done-content = { path = "../not-yet-done-content" }
not-yet-done-filter  = { path = "../not-yet-done-filter" }

[dev-dependencies]
serde_yaml = { workspace = true }
tokio      = { workspace = true }
