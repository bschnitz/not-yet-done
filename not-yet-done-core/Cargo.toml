# Dev-only: the dual-registry guard test (tests/c2_dual_registry_sync.rs)
# needs task-core's entities linked so they self-register at runtime.
# task-core does not depend on core, so this introduces no cycle and no
# production dependency — db::connect() syncs the task registry purely by
# the module-path glob string (C3 of the DB-split).
not-yet-done-task-core = { path = "../not-yet-done-task-core" }
